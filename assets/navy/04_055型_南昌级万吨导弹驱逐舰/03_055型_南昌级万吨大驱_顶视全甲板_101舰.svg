<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" data-asset-id="naval.type055.top.deck" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1120" height="300" fill="#080a0b"/>
    <rect x="20" y="20" width="1080" height="260" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1084 20 H 1100 V 36 M 20 264 V 280 H 36 M 1084 280 H 1100 V 264" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1100" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="254" x2="1100" y2="254" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">PLA NAVY TYPE-055 DDG (101 NANCHANG) · FULL DECK PLANIMETRIC VIEW</text>
    <text x="1086" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">055型「101 南昌舰」万吨大驱 · 顶视全甲板工程图 (八角翼桥主桅 + 前后8×8垂发矩阵)</text>
    <text x="34" y="271" class="p mono" fill="#8aa1a7" font-size="9.5">OCTAGONAL INTEGRATED BRIDGE &amp; MAST · FWD 64-CELL + AFT 64-CELL VLS · TWIN HANGAR &amp; HELIDECK (101) · REF: F105-MIDDLE</text>
    <text x="1086" y="271" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (无损原生算子输出) -->
  <g id="layer-ship-cad">
    <g transform="translate(56.0,81.0) scale(2.400,2.089)">
      <!-- 1. 055型修长穿浪飞剪船体顶视外廓与首楼折角边线 (舰政标准规范) -->
      <polygon points="8,14 78,12 282,12 348,18 414,34 348,50 282,56 78,56 8,54"
               fill="#0a1822" stroke="#d4e3e6" stroke-width="1.4"/>
      <polygon points="78,15 280,15 344,21 402,34 344,47 280,53 78,53"
               fill="#0d202c" stroke="#38bdf8" stroke-width="0.85"/>

      <!-- 2. 舰尾直升机起降甲板 (X=8..76 · 舰政标准图档：双同心圆起降标 + 上下三角标 + 中轴虚线 + 双横线 + 舰尾「101」大字！) -->
      <rect x="10" y="15" width="66" height="38" fill="#08131a" stroke="#d4e3e6" stroke-width="1.0"/>
      <!-- 舰尾两侧安全网边框 (Safety Nets) -->
      <line x1="12" y1="13" x2="74" y2="13" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="3 1.5"/>
      <line x1="12" y1="55" x2="74" y2="55" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="3 1.5"/>
      <!-- 前后白色限位双横线与中轴虚线 -->
      <line x1="52" y1="16" x2="52" y2="52" stroke="#d4e3e6" stroke-width="0.9"/>
      <line x1="55" y1="16" x2="55" y2="52" stroke="#d4e3e6" stroke-width="0.7"/>
      <line x1="12" y1="34" x2="74" y2="34" stroke="#d4e3e6" stroke-width="0.9" stroke-dasharray="4 2.5"/>
      <!-- 双层白色同心圆起降标志 -->
      <circle cx="38" cy="34" r="10.5" fill="none" stroke="#d4e3e6" stroke-width="1.15"/>
      <circle cx="38" cy="34" r="3.2" fill="none" stroke="#38bdf8" stroke-width="0.9"/>
      <!-- 起降圈上下各 3 个白色对位小三角 (舰政标准规范 2+10+3 标示) -->
      <circle cx="33" cy="20" r="0.9" fill="#d4e3e6"/><circle cx="38" cy="20" r="0.9" fill="#d4e3e6"/><circle cx="43" cy="20" r="0.9" fill="#d4e3e6"/>
      <circle cx="33" cy="48" r="0.9" fill="#d4e3e6"/><circle cx="38" cy="48" r="0.9" fill="#d4e3e6"/><circle cx="43" cy="48" r="0.9" fill="#d4e3e6"/>
      <!-- 舰尾末端「101」~「108」白色着舰识别标号 (舰政标准规范 最右端) -->
      <text x="19" y="37" text-anchor="middle" class="p mono" font-size="8" fill="#d4e3e6" font-weight="bold">101</text>

      <!-- 3. 后部双直升机机库顶盖 + 红旗-10 + 左右 2×3 白色救生筏筒 + 球形卫通罩 (X=76..134 · 舰政标准规范) -->
      <polygon points="76,16 128,16 134,21 134,47 128,52 76,52" fill="#102432" stroke="#d4e3e6" stroke-width="1.15"/>
      <!-- 机库后段左右两片浅灰白甲板区 (舰政标准规范 H308 区) -->
      <rect x="78" y="17.5" width="24" height="8" fill="#1a3648" stroke="#38bdf8" stroke-width="0.6"/>
      <rect x="78" y="42.5" width="24" height="8" fill="#1a3648" stroke="#38bdf8" stroke-width="0.6"/>
      <!-- 机库后中轴：24联装红旗-10 (HQ-10) 导弹发射架 -->
      <rect x="85" y="30" width="9" height="8" rx="1" fill="#162e3e" stroke="#ff5a36" stroke-width="1.0"/>
      <!-- 机库前段左右两侧各 3 具白色胶囊形救生筏筒 (2×3 Life-Raft Canisters · 舰政标准规范) -->
      <rect x="108" y="18" width="4.5" height="2.4" rx="1" fill="#d4e3e6"/><rect x="114" y="18" width="4.5" height="2.4" rx="1" fill="#d4e3e6"/><rect x="120" y="18" width="4.5" height="2.4" rx="1" fill="#d4e3e6"/>
      <rect x="108" y="47.6" width="4.5" height="2.4" rx="1" fill="#d4e3e6"/><rect x="114" y="47.6" width="4.5" height="2.4" rx="1" fill="#d4e3e6"/><rect x="120" y="47.6" width="4.5" height="2.4" rx="1" fill="#d4e3e6"/>
      <!-- 机库前中轴凸台与球形卫通天线罩 -->
      <rect x="106" y="27" width="24" height="14" fill="#0c1c28" stroke="#38bdf8" stroke-width="0.85"/>
      <circle cx="125" cy="34" r="3.5" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.8"/>

      <!-- 4. 后部平台 64 单元 (8×8) 大口径通用垂发矩阵 (X=138..164 · 舰政标准规范) -->
      <rect x="138" y="22" width="24" height="24" fill="#07131c" stroke="#d4e3e6" stroke-width="1.0"/><line x1="141.0" y1="22" x2="141.0" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="144.0" y1="22" x2="144.0" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="147.0" y1="22" x2="147.0" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="150.0" y1="22" x2="150.0" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="153.0" y1="22" x2="153.0" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="156.0" y1="22" x2="156.0" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="159.0" y1="22" x2="159.0" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="138" y1="28.0" x2="162" y2="28.0" stroke="#38bdf8" stroke-width="0.5"/><line x1="138" y1="34.0" x2="162" y2="34.0" stroke="#38bdf8" stroke-width="0.5"/><line x1="138" y1="40.0" x2="162" y2="40.0" stroke="#38bdf8" stroke-width="0.5"/><line x1="138" y1="34.0" x2="162" y2="34.0" stroke="#d4e3e6" stroke-width="0.8"/>

      <!-- 5. 中段隐身烟囱、白色方舱盖与双联黑色燃气轮机排气口 (X=168..236 · 舰政标准规范 H12/33 区) -->
      <!-- 后白色方舱盖 (内含双并列小方框) -->
      <rect x="168" y="23" width="16" height="22" fill="#183244" stroke="#d4e3e6" stroke-width="1.0"/>
      <rect x="171" y="26" width="10" height="6" fill="#0b1a24" stroke="#38bdf8" stroke-width="0.6"/>
      <rect x="171" y="36" width="10" height="6" fill="#0b1a24" stroke="#38bdf8" stroke-width="0.6"/>
      <!-- 中段烟囱顶：前后两组黑色燃气轮机排气格栅与双黑圆孔 -->
      <polygon points="184,21 232,19 236,23 236,45 232,49 184,47" fill="#0f2330" stroke="#d4e3e6" stroke-width="1.1"/>
      <rect x="188" y="24" width="10" height="8" fill="#04080b" stroke="#38bdf8" stroke-width="0.8"/>
      <rect x="188" y="36" width="10" height="8" fill="#04080b" stroke="#38bdf8" stroke-width="0.8"/>
      <circle cx="204" cy="34" r="2.2" fill="#04080b" stroke="#d4e3e6" stroke-width="0.6"/>
      <rect x="214" y="25" width="9" height="18" fill="#04080b" stroke="#38bdf8" stroke-width="0.8"/>
      <rect x="225" y="26" width="9" height="16" fill="#162e3e" stroke="#d4e3e6" stroke-width="0.8"/>

      <!-- 6. 核心灵魂：八角翼桥包络 + 阶梯金字塔一体化隐身主桅杆俯视图 (X=236..286 · 舰政标准图档 最具辨识度的钻石八角桥楼！) -->
      <!-- 外层八角翼桥与四面 346B S波段相控阵盾切面 -->
      <polygon points="236,16 266,16 284,24 284,44 266,52 236,52 246,44 246,24"
               fill="#122836" stroke="#d4e3e6" stroke-width="1.3"/>
      <!-- 翼桥前斜切 346B 大盾高亮边与舰桥内框 -->
      <polygon points="252,20 268,20 278,26 278,42 268,48 252,48"
               fill="#18364a" stroke="#38bdf8" stroke-width="1.05"/>
      <!-- 中央阶梯金字塔一体化主桅杆俯视同心台体 + 向后延伸的白色主桅横桁 -->
      <polygon points="244,26 262,26 266,30 266,38 262,42 244,42" fill="#0d202c" stroke="#d4e3e6" stroke-width="1.0"/>
      <rect x="248" y="30" width="12" height="8" fill="#1a3a4e" stroke="#38bdf8" stroke-width="0.9"/>
      <circle cx="254" cy="34" r="2.2" fill="#d4e3e6"/>
      <line x1="238" y1="34" x2="254" y2="34" stroke="#d4e3e6" stroke-width="1.3"/>

      <!-- 7. B炮位五边形前突切角平台与 H/PJ-11 型 1130 近防炮 (X=284..304 · 舰政标准规范) -->
      <polygon points="284,24 298,26 304,30 304,38 298,42 284,44" fill="#102432" stroke="#38bdf8" stroke-width="1.0"/>
      <circle cx="294" cy="34" r="3.8" fill="#163244" stroke="#d4e3e6" stroke-width="0.9"/>
      <line x1="297" y1="34" x2="303" y2="34" stroke="#38bdf8" stroke-width="1.3"/>

      <!-- 8. 舰首 64 单元 (8×8) 大口径通用垂发矩阵 (X=308..334 · 与后部合计 128 单元 · 舰政标准规范) -->
      <rect x="308" y="22" width="26" height="24" fill="#07131c" stroke="#d4e3e6" stroke-width="1.0"/><line x1="311.3" y1="22" x2="311.3" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="314.5" y1="22" x2="314.5" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="317.8" y1="22" x2="317.8" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="321.0" y1="22" x2="321.0" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="324.3" y1="22" x2="324.3" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="327.5" y1="22" x2="327.5" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="330.8" y1="22" x2="330.8" y2="46" stroke="#38bdf8" stroke-width="0.5"/><line x1="308" y1="28.0" x2="334" y2="28.0" stroke="#38bdf8" stroke-width="0.5"/><line x1="308" y1="34.0" x2="334" y2="34.0" stroke="#38bdf8" stroke-width="0.5"/><line x1="308" y1="40.0" x2="334" y2="40.0" stroke="#38bdf8" stroke-width="0.5"/><line x1="308" y1="34.0" x2="334" y2="34.0" stroke="#d4e3e6" stroke-width="0.8"/>

      <!-- 9. 舰首 H/PJ-45A 型 130mm 隐身主炮、V形防浪板与飞剪尖艏分水脊线 (X=340..414 · 舰政标准规范) -->
      <polygon points="340,28 349,26 355,28 355,40 349,42 340,40" fill="#163244" stroke="#d4e3e6" stroke-width="1.15"/>
      <rect x="343" y="31" width="6" height="6" fill="#09151e" stroke="#38bdf8" stroke-width="0.6"/>
      <line x1="355" y1="34" x2="378" y2="34" stroke="#d4e3e6" stroke-width="1.6"/>
      <!-- 舰首 V 形防浪挡板与中轴线 -->
      <polyline points="374,23 386,34 374,45" fill="none" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="378" y1="34" x2="412" y2="34" stroke="#4a6368" stroke-width="0.8"/>
    </g>
  </g>
</svg>
