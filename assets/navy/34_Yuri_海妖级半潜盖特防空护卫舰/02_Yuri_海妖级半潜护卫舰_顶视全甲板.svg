<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" data-asset-id="naval.yuri.siren.top" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      .p { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1080" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="9.5" font-weight="bold">YURI SIREN-CLASS SEMI-SUBMERSIBLE GATTLING FRIGATE (SRN-14) · DECK PLAN</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="9.5">尤里「海妖级」穿浪半潜式盖特防空护卫舰 · 顶视全甲板与双盖特火控总图 (2,850T)</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9.5">7.57:1 WAVE-PIERCING BALLAST HULL (112.0M × 14.8M) · 2×TWIN 30MM 6-BARREL SEA GATTLING · Ψ-LINK MAST · 2×PUMP-JETS</text>
    <text x="1066" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 scale(2.400,2.400)，严格锁定 7.57:1 真实长宽比) -->
  <g id="layer-ship-cad">
    <g transform="translate(36.0,78.0) scale(2.400,2.400)">
      <!-- 0. 外部净空区尺寸标尺与五大尤里海妖级专属地标引线标注 (严格置于 Y=6.0 与 Y=82.5 净空区，零重叠) -->
      <g id="siren-top-callouts">
        <!-- 左端 14.8M 舰宽标尺 (Y=18.1..69.9, 跨度 51.8 单位) -->
        <line x1="9" y1="18.1" x2="9" y2="69.9" stroke="#38bdf8" stroke-width="0.65"/>
        <line x1="6.5" y1="18.1" x2="11.5" y2="18.1" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="6.5" y1="69.9" x2="11.5" y2="69.9" stroke="#38bdf8" stroke-width="0.75"/>
        <text x="5.5" y="44.0" text-anchor="middle" transform="rotate(-90 5.5 44.0)" class="mono" font-size="2.6" fill="#38bdf8">BEAM 14.8M (7.57:1)</text>

        <!-- 上方净空区引线标注：后双联 30mm 盖特炮塔 + 心灵并网接收主桅 + 穿浪刀锋首 -->
        <polyline points="113,31.0 102,7.2 22,7.2" fill="none" stroke="#ff5a36" stroke-width="0.65"/>
        <circle cx="113" cy="31.0" r="1.0" fill="#ff5a36"/>
        <text x="22" y="5.2" class="mono" font-size="2.4" fill="#ff5a36">AFT TURRET: TWIN 30MM 6-BARREL SEA GATTLING</text>

        <polyline points="222.5,33.5 222.5,7.2 296,7.2" fill="none" stroke="#eab308" stroke-width="0.65"/>
        <circle cx="222.5" cy="33.5" r="1.0" fill="#eab308"/>
        <text x="225" y="5.2" class="mono" font-size="2.4" fill="#eab308">Ψ-LINK &amp; PHASED-ARRAY SYNC MAST</text>

        <polyline points="374,32.5 384,7.2 412,7.2" fill="none" stroke="#38bdf8" stroke-width="0.65"/>
        <circle cx="374" cy="32.5" r="1.0" fill="#38bdf8"/>
        <text x="412" y="5.2" text-anchor="end" class="mono" font-size="2.4" fill="#38bdf8">INVERTED WAVE-PIERCING BOW</text>

        <!-- 下方净空区引线标注：双泵喷推进器与反潜火箭深弹 + 半潜压载水舱格栅 + 前双联 30mm 盖特主炮 -->
        <polyline points="64,52.0 54,80.8 20,80.8" fill="none" stroke="#eab308" stroke-width="0.65"/>
        <circle cx="64" cy="52.0" r="1.0" fill="#eab308"/>
        <text x="20" y="83.2" class="mono" font-size="2.4" fill="#eab308">ASW ROCKET MORTAR &amp; 2×PUMP-JETS</text>

        <polyline points="164,67.5 174,80.8 258,80.8" fill="none" stroke="#38bdf8" stroke-width="0.65"/>
        <circle cx="164" cy="67.5" r="1.0" fill="#38bdf8"/>
        <text x="176" y="83.2" class="mono" font-size="2.4" fill="#38bdf8">RAPID BALLAST FLOOD GRATES</text>

        <polyline points="309,57.0 320,80.8 412,80.8" fill="none" stroke="#ff5a36" stroke-width="0.65"/>
        <circle cx="309" cy="57.0" r="1.0" fill="#ff5a36"/>
        <text x="412" y="83.2" text-anchor="end" class="mono" font-size="2.4" fill="#ff5a36">FWD GATTLING (7,200 RPM · UID-27)</text>
      </g>

      <!-- 1. 水下双涵道泵喷推进器喷口与首尾水平潜舵 (2×Pump-Jet Thrusters &amp; Hydroplanes) -->
      <g id="siren-top-thrusters-and-hydroplanes">
        <!-- 舰首水下可收放水平潜舵 (X=366..382, Y=22.5..65.5) -->
        <polygon points="366,28.0 374,21.5 381,22.5 376,30.0" fill="#18364a" stroke="#eab308" stroke-width="0.8"/>
        <polygon points="366,60.0 374,66.5 381,65.5 376,58.0" fill="#18364a" stroke="#eab308" stroke-width="0.8"/>

        <!-- 舰尾水下水平稳定翼与双涵道静音泵喷推进器 (X=14..32, Y=24.0..64.0) -->
        <polygon points="32,26.0 24,21.5 19,22.5 24,28.0" fill="#18364a" stroke="#eab308" stroke-width="0.8"/>
        <polygon points="32,62.0 24,66.5 19,65.5 24,60.0" fill="#18364a" stroke="#eab308" stroke-width="0.8"/>
        <!-- 左右双涵道泵喷导流管 -->
        <rect x="16" y="32.5" width="9.5" height="6.8" rx="1.2" fill="#142c3c" stroke="#eab308" stroke-width="0.95"/>
        <rect x="16" y="48.7" width="9.5" height="6.8" rx="1.2" fill="#142c3c" stroke="#eab308" stroke-width="0.95"/>
        <line x1="8" y1="35.9" x2="15.5" y2="35.9" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 1.2"/>
        <line x1="8" y1="52.1" x2="15.5" y2="52.1" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 1.2"/>
      </g>

      <!-- 2. 7.57:1 穿浪半潜式压载艇体主轮廓 (LOA=112.0m -> X=20..412, BEAM=14.8m -> Y=18.1..69.9) -->
      <g id="siren-top-ballast-hull">
        <!-- 外层半潜压载水舱艇体最大包络 (Y=18.1..69.9) -->
        <path d="M 20,28.0 L 42,20.5 L 96,18.1 L 288,18.1 L 345,23.5 L 388,34.5 L 412,44.0 L 388,53.5 L 345,64.5 L 288,69.9 L 96,69.9 L 42,67.5 L 20,60.0 Z"
              fill="#0a1822" stroke="#d4e3e6" stroke-width="1.35"/>

        <!-- 内层「交战半潜低可探测水线包络」(SEMI-SUBMERGED COMBAT WL · #ff5a36 警示虚线，半潜时仅此线以内露出水面!) -->
        <path d="M 32,31.5 L 88,24.2 L 292,24.2 L 345,28.5 L 392,44.0 L 345,59.5 L 292,63.8 L 88,63.8 L 32,56.5 Z"
              fill="#0d202c" stroke="#ff5a36" stroke-width="0.95" stroke-dasharray="4.5 2.0"/>

        <!-- 两舷高压快速注排水压载水舱格栅群 (Rapid Flood/Blow Ballast Vents · X=56..336) -->
        <g fill="#050c10" stroke="#38bdf8" stroke-width="0.65">
          <!-- 前压载水舱注水格栅 -->
          <rect x="332" y="21.0" width="10" height="2.4"/><rect x="318" y="19.8" width="10" height="2.4"/>
          <rect x="332" y="64.6" width="10" height="2.4"/><rect x="318" y="65.8" width="10" height="2.4"/>
          <!-- 中压载水舱注水格栅 -->
          <rect x="144" y="19.5" width="12" height="2.8"/><rect x="160" y="19.5" width="12" height="2.8"/>
          <rect x="144" y="65.7" width="12" height="2.8"/><rect x="160" y="65.7" width="12" height="2.8"/>
          <!-- 后压载水舱注水格栅 -->
          <rect x="54" y="21.2" width="11" height="2.6"/><rect x="70" y="20.2" width="11" height="2.6"/>
          <rect x="54" y="64.2" width="11" height="2.6"/><rect x="70" y="65.2" width="11" height="2.6"/>
        </g>

        <!-- 逆向内倾穿浪刀锋首脊线与 SRN-14 战术舷号 (Inverted Wave-Piercing Blade Bow · X=345..412) -->
        <polygon points="345,28.5 376,36.5 412,44.0 376,51.5 345,59.5 356,44.0"
                 fill="#122836" stroke="#38bdf8" stroke-width="0.95"/>
        <line x1="20" y1="44.0" x2="412" y2="44.0" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 2.5"/>
        <text x="362" y="41.2" text-anchor="middle" class="mono" font-size="3.2" fill="#d4e3e6" font-weight="bold">SRN-14</text>
      </g>

      <!-- 3. 舰尾可伸缩双联装反潜深弹/反蛙人火箭发射器 + 水下可伸缩主动猎潜声呐虚线投影 (X=46..82) -->
      <g id="siren-top-stern-asw">
        <!-- 水下可伸缩主动猎潜声呐吊舱虚线圆与声波弧 -->
        <ellipse cx="64" cy="44.0" rx="9.5" ry="6.2" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2.2 1.2"/>
        <!-- 甲板可伸缩双联 6管反潜深弹/反蛙人榴弹发射塔 (X=58..72, Y=38.5..49.5) -->
        <rect x="57" y="38.5" width="14" height="11.0" rx="1.2" fill="#102432" stroke="#d4e3e6" stroke-width="0.9"/>
        <rect x="60" y="40.2" width="8.5" height="7.6" rx="0.8" fill="#18364a" stroke="#eab308" stroke-width="0.85"/>
        <line x1="60" y1="42.2" x2="50" y2="42.2" stroke="#ff5a36" stroke-width="1.15"/>
        <line x1="60" y1="45.8" x2="50" y2="45.8" stroke="#ff5a36" stroke-width="1.15"/>
      </g>

      <!-- 4. 舯部低矮多面体半潜隐身指挥室 + 射频相控阵与心灵感应预警并网接收主桅 (X=184..280, Y=25.5..62.5) -->
      <g id="siren-top-citadel-and-psychic-mast">
        <!-- 多面体水密装甲核心堡垒外廓 -->
        <polygon points="184,30.0 198,25.5 262,25.5 280,32.5 280,55.5 262,62.5 198,62.5 184,58.0"
                 fill="#102432" stroke="#d4e3e6" stroke-width="1.25"/>
        <polygon points="192,33.0 204,29.0 256,29.0 270,35.0 270,53.0 256,59.0 204,59.0 192,55.0"
                 fill="#152e3e" stroke="#38bdf8" stroke-width="0.9"/>
        <!-- 多面体折面棱线 -->
        <line x1="184" y1="30.0" x2="192" y2="33.0" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="184" y1="58.0" x2="192" y2="55.0" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="280" y1="32.5" x2="270" y2="35.0" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="280" y1="55.5" x2="270" y2="53.0" stroke="#38bdf8" stroke-width="0.75"/>

        <!-- 前部防EMP/防激光狭长装甲观察窗 (X=256..268) -->
        <polyline points="256,31.5 266,36.5 266,51.5 256,56.5" fill="none" stroke="#ff5a36" stroke-width="1.25"/>

        <!-- 后侧半潜式水冷排气消音扩散器格栅 (X=192..206, Y=35.5..52.5) -->
        <rect x="193" y="35.5" width="11" height="6.8" rx="1" fill="#04080b" stroke="#38bdf8" stroke-width="0.75"/>
        <rect x="193" y="45.7" width="11" height="6.8" rx="1" fill="#04080b" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="193" y1="38.9" x2="204" y2="38.9" stroke="#ff5a36" stroke-width="0.55"/>
        <line x1="193" y1="49.1" x2="204" y2="49.1" stroke="#ff5a36" stroke-width="0.55"/>

        <!-- 核心地标：射频相控阵 + 心灵感应预警并网接收主桅顶视图 (Ψ-Link &amp; Phased-Array Sync Mast · Center X=222.5, Y=44.0) -->
        <!-- 四面 X 波段相控阵菱形基座 -->
        <polygon points="211,44.0 222.5,32.5 234,44.0 222.5,55.5" fill="#18364a" stroke="#d4e3e6" stroke-width="1.1"/>
        <!-- 外层与内层心灵感应谐振环 (Ψ-Sensor Resonance Rings) -->
        <circle cx="222.5" cy="44.0" r="8.2" fill="none" stroke="#ff5a36" stroke-width="0.95" stroke-dasharray="3 1.5"/>
        <circle cx="222.5" cy="44.0" r="5.2" fill="#09151e" stroke="#eab308" stroke-width="0.95"/>
        <circle cx="222.5" cy="44.0" r="2.0" fill="#ff5a36"/>
        <line x1="214.3" y1="44.0" x2="230.7" y2="44.0" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="222.5" y1="35.8" x2="222.5" y2="52.2" stroke="#38bdf8" stroke-width="0.75"/>
      </g>

      <!-- 5. 前后两座双联装 30mm 六管海用无刷伺服多档「盖特」防空炮塔顶视图 (2×Twin 30mm 6-Barrel Sea Gattling Turrets · X=309 &amp; X=113) -->
      <g id="siren-top-twin-gattling-turrets">
        <!-- (1) 前甲板 1号双联装 30mm 六管海用盖特防空炮塔 (Center X=309, Y=44.0, 炮管朝向舰首 +X) -->
        <!-- 360° 伺服火控射界虚线圆与无刷伺服座圈 -->
        <circle cx="309" cy="44.0" r="14.5" fill="none" stroke="#ff5a36" stroke-width="0.65" stroke-dasharray="3 2"/>
        <circle cx="309" cy="44.0" r="10.8" fill="#08131a" stroke="#38bdf8" stroke-width="0.9"/>
        <!-- 多边形重装甲隐身炮塔外壳 -->
        <polygon points="299,37.0 305,34.0 315,35.0 319,38.5 319,49.5 315,53.0 305,54.0 299,51.0"
                 fill="#163244" stroke="#d4e3e6" stroke-width="1.25"/>
        <polygon points="302,39.0 307,36.8 314,37.5 316,40.0 316,48.0 314,50.5 307,51.2 302,49.0"
                 fill="#0d202c" stroke="#ff5a36" stroke-width="0.85"/>
        <!-- 双路供弹鼓与导热凝胶冷却管顶视 -->
        <rect x="302" y="38.2" width="6.5" height="3.2" rx="0.6" fill="#18364a" stroke="#eab308" stroke-width="0.65"/>
        <rect x="302" y="46.6" width="6.5" height="3.2" rx="0.6" fill="#18364a" stroke="#eab308" stroke-width="0.65"/>
        <!-- 顶部光电/相控跟踪球 -->
        <circle cx="308" cy="44.0" r="2.6" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.8"/>
        <circle cx="308" cy="44.0" r="0.9" fill="#ff5a36"/>
        <!-- 左右并列 2 门长身管 30mm 六管加特林转管炮束 (Twin 6-Barrel 30mm Rotary Cannon Bundles · X=319..342) -->
        <rect x="319" y="38.2" width="6.0" height="3.2" fill="#18364a" stroke="#eab308" stroke-width="0.75"/>
        <rect x="319" y="46.6" width="6.0" height="3.2" fill="#18364a" stroke="#eab308" stroke-width="0.75"/>
        <!-- 左门六管炮束 -->
        <line x1="325" y1="38.8" x2="342" y2="38.8" stroke="#d4e3e6" stroke-width="1.05"/>
        <line x1="325" y1="39.8" x2="343" y2="39.8" stroke="#38bdf8" stroke-width="0.85"/>
        <line x1="325" y1="40.8" x2="342" y2="40.8" stroke="#d4e3e6" stroke-width="1.05"/>
        <rect x="338" y="38.4" width="1.8" height="2.8" fill="#ff5a36"/>
        <!-- 右门六管炮束 -->
        <line x1="325" y1="47.2" x2="342" y2="47.2" stroke="#d4e3e6" stroke-width="1.05"/>
        <line x1="325" y1="48.2" x2="343" y2="48.2" stroke="#38bdf8" stroke-width="0.85"/>
        <line x1="325" y1="49.2" x2="342" y2="49.2" stroke="#d4e3e6" stroke-width="1.05"/>
        <rect x="338" y="46.8" width="1.8" height="2.8" fill="#ff5a36"/>

        <!-- (2) 后甲板 2号双联装 30mm 六管海用盖特防空炮塔 (Center X=113, Y=44.0, 炮管朝向舰尾 -X) -->
        <circle cx="113" cy="44.0" r="14.5" fill="none" stroke="#ff5a36" stroke-width="0.65" stroke-dasharray="3 2"/>
        <circle cx="113" cy="44.0" r="10.8" fill="#08131a" stroke="#38bdf8" stroke-width="0.9"/>
        <polygon points="123,37.0 117,34.0 107,35.0 103,38.5 103,49.5 107,53.0 117,54.0 123,51.0"
                 fill="#163244" stroke="#d4e3e6" stroke-width="1.25"/>
        <polygon points="120,39.0 115,36.8 108,37.5 106,40.0 106,48.0 108,50.5 115,51.2 120,49.0"
                 fill="#0d202c" stroke="#ff5a36" stroke-width="0.85"/>
        <rect x="113.5" y="38.2" width="6.5" height="3.2" rx="0.6" fill="#18364a" stroke="#eab308" stroke-width="0.65"/>
        <rect x="113.5" y="46.6" width="6.5" height="3.2" rx="0.6" fill="#18364a" stroke="#eab308" stroke-width="0.65"/>
        <circle cx="114" cy="44.0" r="2.6" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.8"/>
        <circle cx="114" cy="44.0" r="0.9" fill="#ff5a36"/>
        <!-- 左右并列 2 门长身管 30mm 六管加特林转管炮束 (朝向舰尾 -X · X=80..103) -->
        <rect x="97" y="38.2" width="6.0" height="3.2" fill="#18364a" stroke="#eab308" stroke-width="0.75"/>
        <rect x="97" y="46.6" width="6.0" height="3.2" fill="#18364a" stroke="#eab308" stroke-width="0.75"/>
