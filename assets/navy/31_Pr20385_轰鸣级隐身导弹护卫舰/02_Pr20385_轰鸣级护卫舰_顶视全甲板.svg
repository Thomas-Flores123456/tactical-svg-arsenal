  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#050a0e"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#grid20)"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#grid100)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
    <line x1="20" y1="52" x2="1080" y2="52" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="316" x2="1080" y2="316" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="40" font-size="9.5" class="p mono" fill="#38bdf8" font-weight="bold">PR.20385 GREMYASHCHIY (337) · ORTHOGRAPHIC FULL DECK PLAN (8.18:1)</text>
    <text x="1066" y="40" font-size="9.5" text-anchor="end" class="p cap" fill="#d4e3e6">20385型「轰鸣」级隐身轻型护卫舰 · 顶视全甲板与前8后16垂发阵列图</text>
    <text x="34" y="332" font-size="9.5" class="p mono" fill="#8aa1a7">LOA: 106.3M · BEAM: 13.0M (8.18:1) · 100MM A-190 · FWD 8×UKSK (3M22 ZIRCON) · ZASLON 8×AESA · AFT 16×REDUT SAM · UID=71</text>
    <text x="1066" y="332" font-size="9.5" text-anchor="end" class="p mono" fill="#5f7c84">OBLIVION UI GFX · POSEIDON NAVAL CAD · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 sx===sy=2.400, 局部船长 X=20..412 共392单位, 中心线 Y=44.0, 舰宽 Y=20.05..67.95 共47.9单位, 长宽比 8.18:1) -->
  <g id="layer-ship-cad">
    <g transform="translate(52.0,78.0) scale(2.400,2.400)">

      <!-- 0. 顶视纵中线与水下首部 Zarya-M 声呐罩/尾部双轴螺旋桨及 Minotavr-M 拖曳声呐虚线透视 -->
      <line x1="12" y1="44.0" x2="418" y2="44.0" stroke="#2c3b40" stroke-width="0.55" stroke-dasharray="5 2.5"/>
      <!-- 水下首部 Zarya-M 球鼻声呐罩外伸轮廓 -->
      <path d="M 401 38.6 C 411 39.6, 414.5 41.8, 414.5 44.0 C 414.5 46.2, 411 48.4, 401 49.4"
            fill="none" stroke="#ff5a36" stroke-width="0.7" stroke-dasharray="2 1.2"/>
      <!-- 船尾水下双轴五叶金色螺旋桨 (#eab308) 与 Minotavr-M 拖曳声呐舱门 -->
      <g stroke="#eab308" stroke-width="0.75" fill="#eab308" fill-opacity="0.3">
        <line x1="15" y1="33.5" x2="21" y2="33.5"/><ellipse cx="16.5" cy="33.5" rx="1.1" ry="3.2"/>
        <line x1="15" y1="54.5" x2="21" y2="54.5"/><ellipse cx="16.5" cy="54.5" rx="1.1" ry="3.2"/>
      </g>
      <rect x="17.5" y="42.2" width="2.5" height="3.6" fill="#050a0e" stroke="#38bdf8" stroke-width="0.65"/>

      <!-- 1. 20385型 8.18:1 隐身折角全通甲板主船体外廓 (X=20..412, Y=20.05..67.95, 舰宽严格等于 47.9 单位) -->
      <polygon points="20,26.0 54,22.2 126,20.4 162,20.05 294,20.05 336,22.2 370,27.8 396,35.2 412,44.0 396,52.8 370,60.2 336,65.8 294,67.95 162,67.95 126,67.6 54,65.8 20,62.0"
               fill="#0a1822" stroke="#d4e3e6" stroke-width="1.4"/>
      <!-- 内侧主甲板隐身折角边线 -->
      <polygon points="22.5,28.0 126,22.6 294,22.4 334,24.5 368,30.0 402,44.0 368,58.0 334,63.5 294,65.6 126,65.4 22.5,60.0"
               fill="#0d202c" stroke="#38bdf8" stroke-width="0.8"/>

      <!-- 2. 地标三与舰载机：舰尾末端 16 单元 (4×4) 3K96-3 Redut 鲁道特防空垂发 (X=24..52) + 直升机甲板停放 Ka-27PL 与舷号 337 (X=54..126) -->
      <g id="top-aft-redut-and-helodeck">
        <!-- 舰尾最末端尾楼甲板：20385型标志性 16 单元 (4×4 / 2×8) 3K96-3 Redut 防空导弹垂发矩阵 (X=25..49, Y=31.0..57.0 · 高亮 #38bdf8) -->
        <rect x="25" y="31.0" width="24" height="26.0" rx="0.8" fill="#07131c" stroke="#38bdf8" stroke-width="1.15"/>
        <line x1="31" y1="31.0" x2="31" y2="57.0" stroke="#38bdf8" stroke-width="0.55"/>
        <line x1="37" y1="31.0" x2="37" y2="57.0" stroke="#d4e3e6" stroke-width="0.8"/>
        <line x1="43" y1="31.0" x2="43" y2="57.0" stroke="#38bdf8" stroke-width="0.55"/>
        <line x1="25" y1="37.5" x2="49" y2="37.5" stroke="#38bdf8" stroke-width="0.55"/>
        <line x1="25" y1="44.0" x2="49" y2="44.0" stroke="#d4e3e6" stroke-width="0.8"/>
        <line x1="25" y1="50.5" x2="49" y2="50.5" stroke="#38bdf8" stroke-width="0.55"/>
        <!-- 16个独立防空垂发井盖与一坑四弹 (9M100×4) 示范井 -->
        <circle cx="28" cy="34.2" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="34" cy="34.2" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="40" cy="34.2" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="46" cy="34.2" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="28" cy="40.8" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="34" cy="40.8" r="1.3" fill="#ff5a36" stroke="#eab308" stroke-width="0.5"/>
        <circle cx="40" cy="40.8" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="46" cy="40.8" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="28" cy="47.2" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="34" cy="47.2" r="1.3" fill="#ff5a36" stroke="#eab308" stroke-width="0.5"/>
        <circle cx="40" cy="47.2" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="46" cy="47.2" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="28" cy="53.8" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="34" cy="53.8" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="40" cy="53.8" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>
        <circle cx="46" cy="53.8" r="1.2" fill="#18384c" stroke="#38bdf8" stroke-width="0.5"/>

        <!-- 直升机起降甲板 (X=54..126, Y=22.5..65.5) -->
        <polygon points="54,23.5 126,22.6 126,65.4 54,64.5" fill="#08131a" stroke="#d4e3e6" stroke-width="1.0"/>
        <line x1="56" y1="21.2" x2="122" y2="19.5" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="3 1.5"/>
        <line x1="56" y1="66.8" x2="122" y2="68.5" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="3 1.5"/>
        <circle cx="90" cy="44.0" r="11.2" fill="none" stroke="#d4e3e6" stroke-width="1.1"/>
        <circle cx="90" cy="44.0" r="3.0" fill="none" stroke="#38bdf8" stroke-width="0.8"/>
        <line x1="90" y1="44.0" x2="126" y2="44.0" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2.5 1.5"/>
        <!-- 甲板识别舷号 337 -->
        <text x="64" y="46.2" text-anchor="middle" class="mono" font-size="5.6" fill="#d4e3e6" font-weight="bold">337</text>

        <!-- Ka-27PL Helix 共轴双旋翼反潜直升机俯视图 (X=76..106, Y=31..57) -->
        <g id="ka27pl-top">
          <path d="M 78 42.2 L 84 41.5 L 98 41.5 C 102 41.5, 104 42.6, 104 44.0 C 104 45.4, 102 46.5, 98 46.5 L 84 46.5 L 78 45.8 Z"
                fill="#142c3c" stroke="#d4e3e6" stroke-width="0.9"/>
          <rect x="76.5" y="40.0" width="5.2" height="8.0" rx="0.6" fill="none" stroke="#38bdf8" stroke-width="0.7"/>
          <polygon points="99,42.2 103,42.8 103,45.2 99,45.8" fill="#38bdf8"/>
          <g stroke="#d4e3e6" stroke-width="0.85">
            <line x1="92" y1="44.0" x2="92" y2="31.0"/>
            <line x1="92" y1="44.0" x2="80.8" y2="50.5"/>
            <line x1="92" y1="44.0" x2="103.2" y2="50.5"/>
          </g>
          <g stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="3.5 1">
            <line x1="92" y1="44.0" x2="92" y2="57.0"/>
            <line x1="92" y1="44.0" x2="80.8" y2="37.5"/>
            <line x1="92" y1="44.0" x2="103.2" y2="37.5"/>
          </g>
          <circle cx="92" cy="44.0" r="1.5" fill="#eab308" stroke="#050a0e" stroke-width="0.5"/>
        </g>
      </g>

      <!-- 3. 地标四：固定机库两侧 2×30mm AK-630M 近防炮 + 舷侧内藏 2×4 330mm Paket-NK 反潜/反鱼雷发射器 + 低红外排气口 (X=126..232) -->
      <g id="top-hangar-ak630-paket">
        <polygon points="126,22.6 232,22.4 232,65.6 126,65.4" fill="#102432" stroke="#d4e3e6" stroke-width="1.2"/>
        <rect x="132" y="26.5" width="96" height="35.0" fill="#142c3c" stroke="#38bdf8" stroke-width="0.85"/>
        <line x1="132" y1="44.0" x2="228" y2="44.0" stroke="#2c3b40" stroke-width="0.65" stroke-dasharray="3 2"/>

        <!-- 固定机库顶左右两侧对称布置 2×30mm AK-630M 六管近防炮 + SP-520 光电球 (X=144.5, Y=30.5 与 Y=57.5) -->
        <g transform="translate(144.5, 30.5)">
          <circle cx="0" cy="0" r="3.6" fill="#0b1a24" stroke="#d4e3e6" stroke-width="0.85"/>
          <circle cx="0" cy="0" r="1.8" fill="#18384c" stroke="#38bdf8" stroke-width="0.75"/>
          <line x1="-1.8" y1="0" x2="-6.5" y2="-1.2" stroke="#d4e3e6" stroke-width="1.05"/>
        </g>
        <g transform="translate(144.5, 57.5)">
          <circle cx="0" cy="0" r="3.6" fill="#0b1a24" stroke="#d4e3e6" stroke-width="0.85"/>
          <circle cx="0" cy="0" r="1.8" fill="#18384c" stroke="#38bdf8" stroke-width="0.75"/>
          <line x1="-1.8" y1="0" x2="-6.5" y2="1.2" stroke="#d4e3e6" stroke-width="1.05"/>
        </g>
        <circle cx="155" cy="44.0" r="2.2" fill="#163244" stroke="#eab308" stroke-width="0.8"/>

        <!-- 舯部两舷舱门内藏 2×4 330mm Paket-NK 反潜/反鱼雷发射器 (X=172..196, Y=23.5..28.5 与 Y=59.5..64.5 · 高亮 #ff5a36) -->
        <g fill="#261014" stroke="#ff5a36" stroke-width="0.85">
          <!-- 左舷四联装 Paket-NK -->
          <polygon points="173,23.8 194,24.8 193.5,29.0 172.5,28.0"/>
          <line x1="173" y1="25.2" x2="194" y2="26.2" stroke="#eab308" stroke-width="0.5"/>
          <line x1="172.8" y1="26.6" x2="193.8" y2="27.6" stroke="#eab308" stroke-width="0.5"/>
          <!-- 右舷四联装 Paket-NK -->
          <polygon points="172.5,60.0 193.5,59.0 194,63.2 173,64.2"/>
          <line x1="173" y1="62.8" x2="194" y2="61.8" stroke="#eab308" stroke-width="0.5"/>
          <line x1="172.8" y1="61.4" x2="193.8" y2="60.4" stroke="#eab308" stroke-width="0.5"/>
        </g>

        <!-- 机库前部紧凑隐身辅助排气百叶与左右舷救生快艇舱 (X=202..226) -->
        <rect x="204" y="36.5" width="16" height="15.0" rx="1.0" fill="#08131a" stroke="#38bdf8" stroke-width="0.85"/>
        <circle cx="212" cy="40.8" r="2.2" fill="#04080b" stroke="#eab308" stroke-width="0.75"/>
        <circle cx="212" cy="47.2" r="2.2" fill="#04080b" stroke="#eab308" stroke-width="0.75"/>
        <ellipse cx="214" cy="27.5" rx="7.5" ry="2.2" fill="#09151e" stroke="#38bdf8" stroke-width="0.65" stroke-dasharray="2 1"/>
        <ellipse cx="214" cy="60.5" rx="7.5" ry="2.2" fill="#09151e" stroke="#38bdf8" stroke-width="0.65" stroke-dasharray="2 1"/>
      </g>

      <!-- 4. 地标二：全封闭多面体复合材料隐身舰桥 + 一体化 MF-RLK Zaslon 综合射频金字塔主塔桅俯视图 (8块 X+S 波段相控阵 + Puma 球罩 · X=232..308) -->
      <g id="top-zaslon-pyramid-bridge">
        <polygon points="232,22.4 288,22.4 308,28.5 308,59.5 288,65.6 232,65.6"
                 fill="#122836" stroke="#d4e3e6" stroke-width="1.25"/>
        <!-- 航海舰桥前端折角防冰观察窗 -->
        <polyline points="292,29.5 301,35.5 301,52.5 292,58.5" fill="none" stroke="#38bdf8" stroke-width="1.25"/>
        <!-- 舰桥前顶平台：5P-10-03E Puma 主炮火控雷达球罩 -->
        <rect x="283" y="38.5" width="10.5" height="11.0" rx="1.0" fill="#163244" stroke="#d4e3e6" stroke-width="0.85"/>
        <circle cx="288.8" cy="44.0" r="3.2" fill="#18384c" stroke="#eab308" stroke-width="0.95"/>
        <circle cx="288.8" cy="44.0" r="1.1" fill="#eab308"/>

        <!-- 一体化 MF-RLK Zaslon 金字塔综合射频主塔桅正交俯视图 (双层 4+4 = 8块 X+S 波段 AESA 阵面 · X=242..276, Y=27.5..60.5) -->
        <polygon points="242,27.5 276,29.2 276,58.8 242,60.5" fill="#163244" stroke="#d4e3e6" stroke-width="1.15"/>
        <polygon points="249,32.5 269,33.5 269,54.5 249,55.5" fill="#1c445c" stroke="#38bdf8" stroke-width="0.95"/>
        <line x1="242" y1="27.5" x2="255" y2="39.5" stroke="#d4e3e6" stroke-width="0.7"/>
        <line x1="276" y1="29.2" x2="263" y2="39.5" stroke="#d4e3e6" stroke-width="0.7"/>
        <line x1="242" y1="60.5" x2="255" y2="48.5" stroke="#d4e3e6" stroke-width="0.7"/>
        <line x1="276" y1="58.8" x2="263" y2="48.5" stroke="#d4e3e6" stroke-width="0.7"/>

        <!-- 外圈 4 块 S 波段远程有源相控阵阵面切边 (前/后/左/右高亮 #38bdf8) -->
        <rect x="250" y="28.0" width="18" height="2.4" fill="#20506c" stroke="#38bdf8" stroke-width="1.05"/>
        <rect x="250" y="57.6" width="18" height="2.4" fill="#20506c" stroke="#38bdf8" stroke-width="1.05"/>
        <rect x="273.2" y="36.0" width="2.4" height="16.0" fill="#20506c" stroke="#38bdf8" stroke-width="1.05"/>
        <rect x="242.4" y="36.0" width="2.4" height="16.0" fill="#20506c" stroke="#38bdf8" stroke-width="1.05"/>

        <!-- 内圈 4 块 X 波段火控/照射有源相控阵阵面切边 -->
        <line x1="252" y1="32.8" x2="266" y2="33.5" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="252" y1="55.2" x2="266" y2="54.5" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="269" y1="36.5" x2="269" y2="51.5" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="249" y1="36.5" x2="249" y2="51.5" stroke="#38bdf8" stroke-width="1.5"/>

        <!-- 塔顶圆筒形综合卫通/导航天线罩 -->
        <circle cx="259.0" cy="44.0" r="4.2" fill="#0d202c" stroke="#38bdf8" stroke-width="1.1"/>
        <circle cx="259.0" cy="44.0" r="1.4" fill="#ff5a36"/>
      </g>

      <!-- 5. 地标一：前甲板 B 炮位 8 单元 (1×8 / 2×4) 3S14 UKSK 重型高超音速通用垂发 (X=310..344) + 100mm A-190-01 隐身舰炮 (X=352..412) -->
      <g id="top-fwd-uksk-and-a190">
        <!-- B 炮位抬高平台：8 单元 3S14 UKSK 重型热垂发模块 (X=311..343, Y=31.5..56.5 · 警示橘红高亮 #ff5a36) -->
        <rect x="311" y="31.5" width="32" height="25.0" rx="0.8" fill="#1c0d10" stroke="#ff5a36" stroke-width="1.15"/>
        <line x1="311" y1="44.0" x2="343" y2="44.0" stroke="#ff5a36" stroke-width="0.8"/>
        <line x1="319" y1="31.5" x2="319" y2="56.5" stroke="#5f7c84" stroke-width="0.55"/>
        <line x1="327" y1="31.5" x2="327" y2="56.5" stroke="#ff5a36" stroke-width="0.8"/>
        <line x1="335" y1="31.5" x2="335" y2="56.5" stroke="#5f7c84" stroke-width="0.55"/>
        <!-- 8 个重型通用垂发圆井盖 (其中 2 个井口开盖露出红色 3M22 Zircon 锆石高超音速导弹头锥!) -->
        <circle cx="315" cy="37.8" r="2.2" fill="#ff5a36" stroke="#eab308" stroke-width="0.65"/>
        <circle cx="315" cy="37.8" r="0.8" fill="#eab308"/>
        <circle cx="323" cy="37.8" r="2.1" fill="#2a1216" stroke="#d4e3e6" stroke-width="0.6"/>
        <circle cx="331" cy="37.8" r="2.1" fill="#2a1216" stroke="#d4e3e6" stroke-width="0.6"/>
