          <line x1="3.0" y1="1.5" x2="35.0" y2="1.5" stroke="#d4e3e6" stroke-width="0.95"/>
          <line x1="4.5" y1="3.8" x2="33.5" y2="3.8" stroke="#38bdf8" stroke-width="0.95"/>
          <!-- 四轮起落架 -->
          <circle cx="15" cy="12.4" r="0.95" fill="#050a0e" stroke="#d4e3e6" stroke-width="0.55"/>
          <circle cx="25" cy="12.4" r="0.95" fill="#050a0e" stroke="#d4e3e6" stroke-width="0.55"/>
        </g>
      </g>

