        <!-- 尾部升高飞行甲板驻留：卡-27PL「蜗牛」(Ka-27PL Helix-A) 共轴双旋翼反潜直升机 (X=34..74, Y=33.2..46.2) -->
        <g transform="translate(36, 33.2)">
          <!-- 机身、机头下颌搜潜雷达罩与双垂尾 -->
          <path d="M 4 7.5 L 13 8.2 L 26 8.2 C 30 8.2 31.5 10.5 28 11.8 L 13 11.8 L 4 9.5 Z" fill="#142c3c" stroke="#d4e3e6" stroke-width="0.85"/>
