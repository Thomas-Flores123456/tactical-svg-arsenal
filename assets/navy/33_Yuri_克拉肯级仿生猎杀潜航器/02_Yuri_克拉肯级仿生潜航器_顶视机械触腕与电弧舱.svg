<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" data-asset-id="naval.yuri.kraken.top" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1080" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="9.5" font-weight="bold">YURI KRAKEN-CLASS BIOMIMETIC HUNTER UUV (KRK-09) · TOP VIEW &amp; MAGNETIC TENTACLE ARRAY</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="9.5">尤里「克拉肯级」多节仿生强磁猎杀潜航器 · 顶视机械触腕与生物电弧舱总图</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9.5">LOA: 48.0M · BEAM: 9.6M (5.00:1) · 4×SMA MAGNETIC SUCTION TENTACLES · PLASMA TORCH · 50KV BIO-CAPACITOR · UID-28/07</text>
    <text x="1066" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT (5.00:1)</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 真实长宽比等比缩放 scale(2.380,2.380) 锁定：总长 390u=48.0m，主躯干 Y=21.0..67.0) -->
  <g id="layer-ship-cad">
    <g transform="translate(56.0,96.0) scale(2.380,2.380)">

      <!-- 0. 顶视纵中剖面基准线与上/下净空区工程标注 -->
      <line x1="10" y1="44.0" x2="416" y2="44.0" stroke="#2c3b40" stroke-width="0.6" stroke-dasharray="6 3"/>
      <text x="20" y="8.2" class="mono" font-size="2.5" fill="#38bdf8">PORT UNDULATING FIN &amp; 2×SMA TENTACLES (MAGNETIC SUCTION CUPS + HYDRAULIC RIPPING CLAWS)</text>
      <text x="410" y="8.2" text-anchor="end" class="mono" font-size="2.5" fill="#ff5a36">CENTRAL PLASMA CUTTING TORCH &amp; 50KV ARC</text>

      <!-- 1. 两侧仿生波动推进侧鳍 (Undulating Biomimetic Pectoral Fins · X=74..198, 左鳍 Y=11.5..23.0, 右鳍 Y=65.0..76.5) -->
      <g id="undulating-pectoral-fins">
        <!-- 左舷仿生波动侧鳍与内部记忆合金鳍条 -->
        <path d="M 74 25.5 C 94 14.5 118 11.5 148 12.2 C 174 12.8 190 17.5 202 22.2 Z"
              fill="#0d2230" fill-opacity="0.82" stroke="#38bdf8" stroke-width="1.1"/>
        <g stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="2 1">
          <line x1="96" y1="23.5" x2="92" y2="15.8"/><line x1="116" y1="22.0" x2="114" y2="12.8"/>
          <line x1="136" y1="21.2" x2="136" y2="12.0"/><line x1="156" y1="21.2" x2="158" y2="12.8"/>
          <line x1="176" y1="21.5" x2="180" y2="15.5"/>
        </g>
        <!-- 右舷仿生波动侧鳍与内部记忆合金鳍条 -->
        <path d="M 74 62.5 C 94 73.5 118 76.5 148 75.8 C 174 75.2 190 70.5 202 65.8 Z"
              fill="#0d2230" fill-opacity="0.82" stroke="#38bdf8" stroke-width="1.1"/>
        <g stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="2 1">
          <line x1="96" y1="64.5" x2="92" y2="72.2"/><line x1="116" y1="66.0" x2="114" y2="75.2"/>
          <line x1="136" y1="66.8" x2="136" y2="76.0"/><line x1="156" y1="66.8" x2="158" y2="75.2"/>
          <line x1="176" y1="66.5" x2="180" y2="72.5"/>
        </g>
      </g>

      <!-- 2. 尾部：无轴静音磁流体喷水推进器 (Shaftless MHD Water-Jet · X=20..44) + 两腮进水涵道 -->
      <g id="stern-mhd-top">
        <!-- 矢量偏转磁流体喷管 (X=20..42, Y=37.2..50.8) -->
        <polygon points="20,39.5 32,37.2 42,36.5 42,51.5 32,50.8 20,48.5" fill="#0e2432" stroke="#38bdf8" stroke-width="1.15"/>
        <polygon points="20,40.8 28,39.5 28,48.5 20,47.2" fill="#1c0d10" stroke="#ff5a36" stroke-width="0.9"/>
        <line x1="31" y1="37.4" x2="31" y2="50.6" stroke="#eab308" stroke-width="0.9" stroke-dasharray="1.5 1.0"/>
        <line x1="36" y1="37.0" x2="36" y2="51.0" stroke="#eab308" stroke-width="0.9" stroke-dasharray="1.5 1.0"/>
        <!-- 磁流体喷水尾流 -->
        <line x1="11" y1="44.0" x2="20" y2="44.0" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2.5 1.2"/>
        <line x1="14" y1="41.5" x2="20" y2="42.2" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="1.8 1.0"/>
        <line x1="14" y1="46.5" x2="20" y2="45.8" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="1.8 1.0"/>
      </g>

      <!-- 3. 6节铰接深海抗压几丁质-钛合金复合装甲躯干顶视主外廓 (X=42..248, 躯干主宽 Y=21.0..67.0) -->
      <g id="mantle-6segment-top">
        <path d="M 42 36.5
                 C 64 28.5 96 22.5 132 21.0
                 L 212 21.0
                 C 232 21.0 244 26.5 248 33.5
                 L 248 54.5
                 C 244 61.5 232 67.0 212 67.0
                 L 132 67.0
                 C 96 65.5 64 59.5 42 51.5 Z"
              fill="#091620" stroke="#d4e3e6" stroke-width="1.4"/>

        <!-- 两腮磁流体进水涵道口 (Lateral Gill MHD Intakes, X=72..96, Y=24..28 &amp; Y=60..64) -->
        <polygon points="72,27.5 96,23.5 96,26.8 72,30.5" fill="#04080b" stroke="#38bdf8" stroke-width="0.8"/>
        <polygon points="72,60.5 96,64.5 96,61.2 72,57.5" fill="#04080b" stroke="#38bdf8" stroke-width="0.8"/>

        <!-- 6 节铰接几丁质装甲板弧形分节缝 (SEG-06..SEG-01) -->
        <g stroke="#38bdf8" stroke-width="0.85" fill="none">
          <path d="M 74 28.2 C 68 38.5 68 49.5 74 59.8"/>
          <path d="M 106 23.2 C 100 37.0 100 51.0 106 64.8"/>
          <path d="M 140 21.2 C 134 36.5 134 51.5 140 66.8"/>
          <path d="M 174 21.2 C 168 36.5 168 51.5 174 66.8"/>
          <path d="M 208 21.2 C 202 36.5 202 51.5 208 66.8"/>
        </g>

        <!-- 背部中轴高强龙骨脊线与脑波遥控水声接收鳍脊 -->
        <ellipse cx="56" cy="44.0" rx="14.0" ry="1.8" fill="#132c3a" stroke="#d4e3e6" stroke-width="0.85"/>
        <circle cx="50" cy="44.0" r="1.1" fill="#ff5a36"/>
      </g>

      <!-- 4. 中段核心 X-Ray 透视：仿电鳗高密度生物发电腺体阵列 (UID-07) + 50,000V 超导脉冲电容舱 (X=76..210, Y=28.5..59.5) -->
      <g id="bio-electric-capacitor-top-xray">
        <rect x="76.0" y="28.8" width="132.0" height="30.4" rx="5.0"
              fill="#060f15" fill-opacity="0.86" stroke="#38bdf8" stroke-width="0.9" stroke-dasharray="4 2"/>

        <!-- 后段：磁流体超导直线加速涵道 (MHD Accelerator Duct, X=78..108) -->
        <rect x="79.0" y="37.5" width="28.0" height="13.0" rx="1.5" fill="#0c1f2c" stroke="#38bdf8" stroke-width="0.85"/>
        <line x1="42.0" y1="44.0" x2="107.0" y2="44.0" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="2.5 1.2"/>

        <!-- 中段：左右对称 2×3 组蜂窝状「仿电鳗高密度生物发电细胞柱阵列」(Bio-Eel Electroplax Organ Banks · X=112..164) -->
        <g fill="#241508" stroke="#eab308" stroke-width="0.85">
          <!-- 左舷 3 组生物发电腺体柱 -->
          <rect x="112.0" y="31.2" width="15.0" height="10.2" rx="1.2"/>
          <rect x="130.0" y="31.2" width="15.0" height="10.2" rx="1.2"/>
          <rect x="148.0" y="31.2" width="15.0" height="10.2" rx="1.2"/>
          <!-- 右舷 3 组生物发电腺体柱 -->
          <rect x="112.0" y="46.6" width="15.0" height="10.2" rx="1.2"/>
          <rect x="130.0" y="46.6" width="15.0" height="10.2" rx="1.2"/>
          <rect x="148.0" y="46.6" width="15.0" height="10.2" rx="1.2"/>
        </g>
        <!-- 电鳗细胞柱中心活性放电核 -->
        <g fill="#eab308">
          <circle cx="119.5" cy="36.3" r="1.4"/><circle cx="137.5" cy="36.3" r="1.4"/><circle cx="155.5" cy="36.3" r="1.4"/>
          <circle cx="119.5" cy="51.7" r="1.4"/><circle cx="137.5" cy="51.7" r="1.4"/><circle cx="155.5" cy="51.7" r="1.4"/>
        </g>

        <!-- 前段：50,000V 超导脉冲电容阵列舱 (50kV Superconducting Pulse Capacitor Bank, X=167..205) -->
        <rect x="167.0" y="31.0" width="38.0" height="26.0" rx="2.0" fill="#1e0c10" stroke="#ff5a36" stroke-width="0.95"/>
        <!-- 6 座超导储能环形电容 (2×3 矩阵) -->
        <g fill="#2c1014" stroke="#ff5a36" stroke-width="0.8">
          <circle cx="174.5" cy="37.5" r="4.0"/><circle cx="186.0" cy="37.5" r="4.0"/><circle cx="197.5" cy="37.5" r="4.0"/>
          <circle cx="174.5" cy="50.5" r="4.0"/><circle cx="186.0" cy="50.5" r="4.0"/><circle cx="197.5" cy="50.5" r="4.0"/>
        </g>
        <g fill="#eab308">
          <circle cx="174.5" cy="37.5" r="1.4"/><circle cx="186.0" cy="37.5" r="1.4"/><circle cx="197.5" cy="37.5" r="1.4"/>
          <circle cx="174.5" cy="50.5" r="1.4"/><circle cx="186.0" cy="50.5" r="1.4"/><circle cx="197.5" cy="50.5" r="1.4"/>
        </g>
        <!-- 中央高压汇流排与四路触腕放电馈线 -->
        <line x1="112.0" y1="44.0" x2="248.0" y2="44.0" stroke="#38bdf8" stroke-width="1.15"/>
      </g>

      <!-- 5. 首部：左右复眼水声/蓝绿激光光学传感器簇 + 中央「超空泡等离子切割炬」(X=214..312) -->
      <g id="bow-eyes-plasma-torch-top">
        <!-- 背甲战术编号 KRK-09 与中央心灵/声学神经处理核 -->
        <circle cx="226.0" cy="44.0" r="5.2" fill="#122836" stroke="#38bdf8" stroke-width="0.95"/>
        <circle cx="226.0" cy="44.0" r="2.0" fill="#ff5a36"/>
        <text x="226.0" y="35.8" text-anchor="middle" class="mono" font-size="3.8" fill="#d4e3e6" font-weight="bold">KRK-09</text>

        <!-- 左/右两侧巨型复眼水声与蓝绿激光传感器阵列 (Compound Acoustic / Blue-Green Laser Eyes) -->
        <ellipse cx="236.5" cy="27.2" rx="6.2" ry="3.4" fill="#050c10" stroke="#38bdf8" stroke-width="1.0"/>
        <circle cx="237.5" cy="26.8" r="1.6" fill="#eab308"/>
        <ellipse cx="236.5" cy="60.8" rx="6.2" ry="3.4" fill="#050c10" stroke="#38bdf8" stroke-width="1.0"/>
        <circle cx="237.5" cy="61.2" r="1.6" fill="#eab308"/>

        <!-- 4组触腕环绕正中央：首部超空泡等离子切割炬 (Supercavitating Plasma Cutting Torch · X=248..312, Y=40.0..48.0) -->
        <polygon points="248,39.8 268,41.0 276,42.5 276,45.5 268,47.0 248,48.2" fill="#1c0d10" stroke="#ff5a36" stroke-width="1.05"/>
        <rect x="252" y="42.0" width="16" height="4.0" fill="#0d222e" stroke="#38bdf8" stroke-width="0.75"/>
        <!-- 向前高速喷射的高温等离子切割电弧射流 (PLASMA TORCH JET) -->
        <polygon points="276,42.4 312,44.0 276,45.6" fill="#38bdf8" fill-opacity="0.85"/>
        <polygon points="276,43.2 298,44.0 276,44.8" fill="#eab308"/>
        <polyline points="276,44.0 286,41.8 295,46.2 304,42.5 312,44.0" fill="none" stroke="#ff5a36" stroke-width="0.85"/>
      </g>

      <!-- 6. 核心灵魂：首部向外张开伸展的 4 组高强度记忆合金与合成肌束「多关节柔性机械触腕」(4×SMA Tentacle Arms · X=246..410, Y=13..75) -->
      <g id="four-mechanical-tentacles-top">
        <!-- 6.1 左外侧第 1 机械触腕 (Port-Outer Arm #1 · X=246..408, Y=14..32) -->
        <path d="M 246 31.5 C 276 20.5 316 14.5 356 17.5 C 376 19.0 390 23.5 398 26.5"
