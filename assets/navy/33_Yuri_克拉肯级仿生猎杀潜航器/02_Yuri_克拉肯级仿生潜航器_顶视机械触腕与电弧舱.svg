        <path d="M 246 31.5 C 276 20.5 316 14.5 356 17.5 C 376 19.0 390 23.5 398 26.5"
              fill="none" stroke="#eab308" stroke-width="0.65"/>
        <!-- 内侧超导电磁吸盘列 (Superconducting Magnetic Suction Cups · #38bdf8) -->
        <g fill="#38bdf8" stroke="#08141c" stroke-width="0.4">
          <circle cx="264" cy="28.2" r="1.4"/><circle cx="276" cy="24.8" r="1.4"/><circle cx="288" cy="22.2" r="1.4"/>
          <circle cx="300" cy="20.4" r="1.4"/><circle cx="312" cy="19.2" r="1.4"/><circle cx="324" cy="18.8" r="1.4"/>
          <circle cx="336" cy="19.0" r="1.35"/><circle cx="348" cy="19.6" r="1.35"/><circle cx="360" cy="20.8" r="1.3"/>
          <circle cx="372" cy="22.4" r="1.25"/><circle cx="384" cy="24.5" r="1.2"/>
        </g>
        <!-- 尖端钛合金液压倍力撕裂爪 (Hydraulic Multiplier Ripping Claw · #ff5a36) -->
        <polygon points="396,24.0 409,22.2 403,26.5 410,30.2 396,28.8" fill="#261014" stroke="#ff5a36" stroke-width="1.1"/>
        <circle cx="397" cy="26.5" r="1.35" fill="#eab308"/>

        <!-- 6.2 左内侧第 2 机械触腕 (Port-Inner Arm #2 · X=248..402, Y=28..39) -->
        <path d="M 248 37.5 C 282 31.8 324 29.8 360 33.2 C 376 34.8 386 36.8 392 38.5"
              fill="none" stroke="#0b1b26" stroke-width="3.8"/>
        <path d="M 248 37.5 C 282 31.8 324 29.8 360 33.2 C 376 34.8 386 36.8 392 38.5"
              fill="none" stroke="#38bdf8" stroke-width="1.05" stroke-dasharray="5.8 1.6"/>
        <g fill="#38bdf8">
          <circle cx="270" cy="36.2" r="1.15"/><circle cx="284" cy="34.5" r="1.15"/><circle cx="298" cy="33.2" r="1.15"/>
          <circle cx="312" cy="32.6" r="1.15"/><circle cx="326" cy="32.6" r="1.15"/><circle cx="340" cy="33.2" r="1.1"/>
          <circle cx="354" cy="34.4" r="1.1"/><circle cx="368" cy="35.8" r="1.05"/><circle cx="380" cy="37.4" r="1.0"/>
        </g>
        <polygon points="390,36.5 402,35.2 397,38.5 402,41.5 390,40.5" fill="#261014" stroke="#ff5a36" stroke-width="0.95"/>

        <!-- 6.3 右内侧第 3 机械触腕 (Starboard-Inner Arm #3 · X=248..402, Y=49..60) -->
        <path d="M 248 50.5 C 282 56.2 324 58.2 360 54.8 C 376 53.2 386 51.2 392 49.5"
              fill="none" stroke="#0b1b26" stroke-width="3.8"/>
        <path d="M 248 50.5 C 282 56.2 324 58.2 360 54.8 C 376 53.2 386 51.2 392 49.5"
              fill="none" stroke="#38bdf8" stroke-width="1.05" stroke-dasharray="5.8 1.6"/>
        <g fill="#38bdf8">
          <circle cx="270" cy="51.8" r="1.15"/><circle cx="284" cy="53.5" r="1.15"/><circle cx="298" cy="54.8" r="1.15"/>
          <circle cx="312" cy="55.4" r="1.15"/><circle cx="326" cy="55.4" r="1.15"/><circle cx="340" cy="54.8" r="1.1"/>
          <circle cx="354" cy="53.6" r="1.1"/><circle cx="368" cy="52.2" r="1.05"/><circle cx="380" cy="50.6" r="1.0"/>
        </g>
        <polygon points="390,47.5 402,46.5 397,49.5 402,52.8 390,51.5" fill="#261014" stroke="#ff5a36" stroke-width="0.95"/>

        <!-- 6.4 右外侧第 4 机械触腕 (Starboard-Outer Arm #4 · X=246..408, Y=56..74) -->
        <path d="M 246 56.5 C 276 67.5 316 73.5 356 70.5 C 376 69.0 390 64.5 398 61.5"
              fill="none" stroke="#0f2432" stroke-width="4.8"/>
        <path d="M 246 56.5 C 276 67.5 316 73.5 356 70.5 C 376 69.0 390 64.5 398 61.5"
              fill="none" stroke="#d4e3e6" stroke-width="1.3" stroke-dasharray="6.5 1.8"/>
        <path d="M 246 56.5 C 276 67.5 316 73.5 356 70.5 C 376 69.0 390 64.5 398 61.5"
              fill="none" stroke="#eab308" stroke-width="0.65"/>
        <!-- 内侧超导电磁吸盘列 (#38bdf8) -->
        <g fill="#38bdf8" stroke="#08141c" stroke-width="0.4">
          <circle cx="264" cy="59.8" r="1.4"/><circle cx="276" cy="63.2" r="1.4"/><circle cx="288" cy="65.8" r="1.4"/>
          <circle cx="300" cy="67.6" r="1.4"/><circle cx="312" cy="68.8" r="1.4"/><circle cx="324" cy="69.2" r="1.4"/>
          <circle cx="336" cy="69.0" r="1.35"/><circle cx="348" cy="68.4" r="1.35"/><circle cx="360" cy="67.2" r="1.3"/>
          <circle cx="372" cy="65.6" r="1.25"/><circle cx="384" cy="63.5" r="1.2"/>
        </g>
        <!-- 尖端钛合金液压倍力撕裂爪 (#ff5a36) -->
