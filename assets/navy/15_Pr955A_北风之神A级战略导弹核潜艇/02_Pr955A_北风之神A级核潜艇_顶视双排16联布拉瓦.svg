        <rect x="24.5" y="63.6" width="16.5" height="1.8" rx="0.5" fill="#0d222e" stroke="#38bdf8" stroke-width="0.85"/>

        <!-- 环形导管泵喷推进器俯视剖面 (Annular Shrouded Pump-Jet Propulsor · X=12.5..29, Y=37.4..50.6) -->
