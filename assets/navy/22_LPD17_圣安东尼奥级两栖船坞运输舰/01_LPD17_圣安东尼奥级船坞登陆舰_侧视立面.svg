<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" data-asset-id="naval.sanantonio17.side" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      .p { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="320" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="280" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 284 V 300 H 36 M 1064 300 H 1080 V 284" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="274" x2="1080" y2="274" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8"  font-weight="bold" font-size="9.5">US NAVY SAN ANTONIO-CLASS LPD-17 · STEALTH AMPHIBIOUS DOCK ELEVATION</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6"  font-size="9.5">LPD-17「圣安东尼奥」级隐身船坞运输舰 · 侧视双八角桅与三层坞舱剖面图</text>
    <text x="34" y="291" class="p mono" fill="#8aa1a7" font-size="9.5">LOA: 208.5M · BEAM: 31.9M · 2×OCTAGONAL AEM/S STEALTH MASTS · 2×LCAC WELL DECK · 3-DECK VEHICLE BAY (2,200 SQ.M) · MV-22B</text>
    <text x="1066" y="291" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 scale(2.400,2.400)) -->
  <g id="layer-ship-cad">
    <g transform="translate(26.0,64.0) scale(2.400,2.400)">
      <!-- 0. 顶部净空区工程引线标注 (严格避开双八角 AEM/S 集成桅杆与旋翼机) -->
      <g id="lpd17-side-callouts">
        <!-- 后飞行甲板 MV-22B 与 CH-53K 标注 -->
        <polyline points="88,28.5 76,12.0 18,12.0" fill="none" stroke="#eab308" stroke-width="0.65"/>
        <circle cx="88" cy="28.5" r="1.0" fill="#eab308"/>
        <text x="18" y="9.8" class="mono" font-size="2.5" fill="#eab308">AFT FLIGHT DECK: MV-22B OSPREY &amp; CH-53K</text>

        <!-- 后八角形 AEM/S 隐身集成主桅 (内藏 AN/SPS-48G 3D 雷达) -->
        <polyline points="178,4.0 162,0.5 92,0.5" fill="none" stroke="#38bdf8" stroke-width="0.65"/>
        <circle cx="178" cy="4.0" r="1.0" fill="#38bdf8"/>
        <text x="92" y="-1.6" class="mono" font-size="2.5" fill="#38bdf8">AFT AEM/S MAST (AN/SPS-48G 3D RADAR)</text>

        <!-- 前八角形 AEM/S 隐身集成主桅 (内藏 AN/SPQ-9B 雷达) -->
        <polyline points="301,4.8 318,0.5 398,0.5" fill="none" stroke="#38bdf8" stroke-width="0.65"/>
        <circle cx="301" cy="4.8" r="1.0" fill="#38bdf8"/>
        <text x="320" y="-1.6" class="mono" font-size="2.5" fill="#38bdf8">FWD AEM/S MAST (AN/SPQ-9B &amp; C4I)</text>

        <!-- 舰首 RIM-116 RAM 与 30mm Mk 46 隐身舰炮标注 -->
        <polyline points="348,23.5 362,12.0 412,12.0" fill="none" stroke="#ff5a36" stroke-width="0.65"/>
        <circle cx="348" cy="23.5" r="1.0" fill="#ff5a36"/>
        <text x="412" y="9.8" text-anchor="end" class="mono" font-size="2.5" fill="#ff5a36">RIM-116 RAM &amp; 30MM MK 46 GUN</text>
      </g>

      <!-- 1. 工程尺寸标尺 (LOA 208.5M = 392.0 CAD Units, X=20..412) -->
      <line x1="20" y1="74.5" x2="412" y2="74.5" stroke="#2c3b40" stroke-width="0.6"/>
      <line x1="20" y1="72.5" x2="20" y2="76.5" stroke="#38bdf8" stroke-width="0.75"/>
      <line x1="412" y1="72.5" x2="412" y2="76.5" stroke="#38bdf8" stroke-width="0.75"/>
      <text x="216" y="77.8" text-anchor="middle" class="mono" font-size="2.6" fill="#8aa1a7">LOA 208.5M · BEAM 31.9M (6.54:1) · DRAFT 7.0M · 25,300T FULL LOAD · 4×PC2.5 STC DIESELS</text>

      <!-- 2. 水线以下：暗红防污船底 (fill="#261014" stroke="#ff5a36") + 球鼻艏 + 舭龙骨 + 双轴五叶螺旋桨与双舵 -->
      <g id="lpd17-underwater-hull">
        <path d="M 20 55.0 L 396 55.0 C 405 55.0 411.5 58.0 411.0 62.0 C 410.5 65.8 403.5 67.2 392 67.2 L 62 67.2 L 38 63.2 L 20 59.5 Z"
              fill="#261014" stroke="#ff5a36" stroke-width="1.05"/>
        <!-- 舭龙骨与减摇鳍 -->
        <polygon points="156,63.5 266,63.5 262,66.2 160,66.2" fill="#1a0b0e" stroke="#ff5a36" stroke-width="0.65"/>

        <!-- 舰尾双平衡舵与双轴五叶调距螺旋桨 (#eab308) -->
        <polygon points="26,60.8 33,60.8 31.5,69.2 24.5,68.8" fill="#261014" stroke="#ff5a36" stroke-width="0.85"/>
        <polygon points="35,61.8 41,61.8 39.8,68.8 33.8,68.4" fill="#1d0c10" stroke="#ff5a36" stroke-width="0.75"/>
        <line x1="98" y1="62.0" x2="50" y2="67.2" stroke="#eab308" stroke-width="1.15"/>
        <line x1="124" y1="62.0" x2="74" y2="67.2" stroke="#eab308" stroke-width="1.1"/>
        <line x1="57" y1="63.5" x2="52" y2="67.2" stroke="#d4e3e6" stroke-width="0.8"/>
        <line x1="81" y1="63.5" x2="76" y2="67.2" stroke="#d4e3e6" stroke-width="0.8"/>
        <ellipse cx="50" cy="67.2" rx="1.6" ry="4.2" fill="#eab308" stroke="#d4e3e6" stroke-width="0.55"/>
        <ellipse cx="74" cy="67.2" rx="1.6" ry="4.2" fill="#eab308" stroke="#d4e3e6" stroke-width="0.55"/>

        <!-- 尾门开启泛水浪花 -->
        <path d="M 6 55.0 Q 13 53.2 20 55.0 Q 13 56.8 6 55.0 Z" fill="#123042" stroke="#38bdf8" stroke-width="0.65"/>
      </g>

      <!-- 3. 全通式多面体内倾隐身封闭船体与上层建筑 (Faceted Tumblehome Stealth Hull &amp; Integrated Superstructure · X=20..412) -->
      <g id="lpd17-stealth-hull">
        <!-- 主船体外廓 + 后飞行甲板 (X=20..120, Y=38.0) + 全封闭多面体上层建筑 (X=120..360, Y=24.0..38.0) + 封闭舰首甲板 (X=360..412) -->
        <polygon points="20,38.0 120,38.0 126,24.5 278,24.5 282,22.5 322,22.5 334,26.0 356,26.0 364,34.5 412,33.0 403,44.5 396,55.0 20,55.0"
                 fill="#09151e" stroke="#d4e3e6" stroke-width="1.3"/>
        <!-- 贯穿全舰的标志性多面体隐身折角腰线 (Continuous Stealth Chine Line) -->
        <polyline points="20,43.5 120,43.5 364,38.0 408,36.8" fill="none" stroke="#38bdf8" stroke-width="0.95"/>
        <polyline points="122,32.0 359,32.0" fill="none" stroke="#4a6368" stroke-width="0.7"/>
        <!-- 水线基准白线 -->
        <line x1="20" y1="55.0" x2="396" y2="55.0" stroke="#d4e3e6" stroke-width="0.95"/>

        <!-- 前舰桥低RCS阶梯式防眩光观察窗 + 封闭锚机舱 + 舰首「17」大号白色舷号 -->
        <polygon points="321,23.5 332,26.5 332,28.5 320,25.5" fill="#38bdf8" stroke="#d4e3e6" stroke-width="0.55"/>
        <rect x="334" y="27.2" width="16" height="1.8" fill="#38bdf8"/>
        <circle cx="396" cy="40.5" r="1.5" fill="#050a0e" stroke="#d4e3e6" stroke-width="0.65"/>
        <text x="380" y="45.2" text-anchor="middle" class="mono" font-size="6.0" fill="#d4e3e6" font-weight="bold">17</text>

        <!-- 舯部隐身卷帘舱门与内部 11m RHIB 刚性快艇/重型艇吊透视窗 (X=214..258, Y=26.5..36.0) -->
        <rect x="214" y="26.5" width="44" height="9.2" fill="#050b0f" stroke="#eab308" stroke-width="0.85" stroke-dasharray="3 1.5"/>
        <ellipse cx="228" cy="32.5" rx="8.5" ry="2.0" fill="#142c3c" stroke="#d4e3e6" stroke-width="0.7"/>
        <line x1="244" y1="35.5" x2="244" y2="27.5" stroke="#eab308" stroke-width="0.9"/>
        <line x1="244" y1="28.0" x2="226" y2="30.0" stroke="#eab308" stroke-width="0.75"/>
        <text x="236" y="29.5" text-anchor="middle" class="mono" font-size="2.2" fill="#eab308">RHIB &amp; CRANE BAY</text>
      </g>

      <!-- 4. 前后两座巨型八角形多面体 AEM/S 全封闭复合材料隐身集成主桅 + 低矮隐身排气烟囱罩 -->
      <g id="lpd17-aems-stealth-masts">
        <!-- (1) 前八角形 AEM/S 隐身集成主桅 (Forward Octagonal AEM/S Mast · X=285..318, Y=4.8..22.5) -->
        <polygon points="285,22.5 289,12.5 292,6.5 301.5,4.8 311,6.5 314,12.5 318,22.5"
                 fill="#0e2230" stroke="#d4e3e6" stroke-width="1.25"/>
        <!-- 八角形外表面折面棱线 (#38bdf8 高亮) -->
        <polyline points="294,6.2 292,12.5 290,22.5" fill="none" stroke="#38bdf8" stroke-width="0.85"/>
        <polyline points="309,6.2 311,12.5 313,22.5" fill="none" stroke="#38bdf8" stroke-width="0.85"/>
        <line x1="289" y1="12.5" x2="314" y2="12.5" stroke="#38bdf8" stroke-width="0.85"/>
        <line x1="287" y1="17.5" x2="316" y2="17.5" stroke="#4a6368" stroke-width="0.65"/>
        <!-- 内部透视虚线：AN/SPQ-9B 超视距火控雷达与 C4ISR 通信阵列 -->
        <ellipse cx="301.5" cy="9.5" rx="6.5" ry="2.0" fill="none" stroke="#eab308" stroke-width="0.75" stroke-dasharray="2 1.2"/>
        <rect x="296.5" y="14.2" width="10.0" height="3.8" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 1.2"/>
        <line x1="301.5" y1="4.8" x2="301.5" y2="1.8" stroke="#d4e3e6" stroke-width="0.8"/>

        <!-- 前桅后方低矮隐身排气烟囱罩與卫通球罩 (Fwd Stealth Exhaust Stack · X=264..280) -->
        <polygon points="264,24.5 267,18.2 278,18.2 280,24.5" fill="#0b1a24" stroke="#d4e3e6" stroke-width="0.95"/>
        <rect x="267.5" y="17.0" width="10" height="1.4" fill="#04080b" stroke="#38bdf8" stroke-width="0.65"/>
        <circle cx="260" cy="21.8" r="2.2" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.65"/>

        <!-- (2) 后八角形 AEM/S 隐身集成主桅 (Aft Octagonal AEM/S Mast · X=162..195, Y=4.0..24.5) -->
        <polygon points="162,24.5 166,13.0 169,5.8 178.5,4.0 188,5.8 191,13.0 195,24.5"
                 fill="#0e2230" stroke="#d4e3e6" stroke-width="1.25"/>
        <!-- 八角形外表面折面棱线 -->
        <polyline points="171,5.5 169,13.0 167,24.5" fill="none" stroke="#38bdf8" stroke-width="0.85"/>
        <polyline points="186,5.5 188,13.0 190,24.5" fill="none" stroke="#38bdf8" stroke-width="0.85"/>
        <line x1="166" y1="13.0" x2="191" y2="13.0" stroke="#38bdf8" stroke-width="0.85"/>
        <line x1="164" y1="18.8" x2="193" y2="18.8" stroke="#4a6368" stroke-width="0.65"/>
        <!-- 内部透视虚线：AN/SPS-48G 大型三坐标对空搜索雷达旋转天线 -->
        <polygon points="172.5,6.8 184.5,6.2 183.5,11.6 173.5,12.0" fill="none" stroke="#ff5a36" stroke-width="0.85" stroke-dasharray="2.2 1.2"/>
        <rect x="173.5" y="14.5" width="10.0" height="3.8" fill="none" stroke="#eab308" stroke-width="0.7" stroke-dasharray="2 1.2"/>
        <line x1="178.5" y1="4.0" x2="178.5" y2="1.2" stroke="#d4e3e6" stroke-width="0.8"/>

        <!-- 后桅后方低矮隐身排气烟囱罩 (Aft Stealth Exhaust Stack · X=144..159) -->
        <polygon points="144,24.5 147,18.2 157,18.2 159,24.5" fill="#0b1a24" stroke="#d4e3e6" stroke-width="0.95"/>
        <rect x="147.5" y="17.0" width="9" height="1.4" fill="#04080b" stroke="#38bdf8" stroke-width="0.65"/>
        <circle cx="201" cy="21.8" r="2.2" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.65"/>
      </g>

      <!-- 5. 前后自卫武备：2×RIM-116 RAM 海拉姆防空导弹 + 2×30mm Mk 46 Bushmaster II 隐身速射炮 -->
      <g id="lpd17-side-weapons">
        <!-- 前舰桥顶：RIM-116 RAM (X=343) + 前 30mm Mk 46 隐身炮塔 (X=357) -->
        <rect x="341" y="22.8" width="6.2" height="3.2" fill="#163244" stroke="#ff5a36" stroke-width="0.8"/>
        <line x1="347" y1="23.8" x2="350" y2="22.5" stroke="#ff5a36" stroke-width="0.9"/>
        <polygon points="356,34.5 358,31.2 363,31.2 364.5,34.5" fill="#142c3c" stroke="#d4e3e6" stroke-width="0.8"/>
        <line x1="364" y1="32.4" x2="370" y2="32.0" stroke="#38bdf8" stroke-width="0.95"/>

        <!-- 后机库顶：RIM-116 RAM (X=132) + 后 30mm Mk 46 隐身炮塔 (X=122) -->
        <rect x="131" y="21.3" width="6.2" height="3.2" fill="#163244" stroke="#ff5a36" stroke-width="0.8"/>
        <line x1="131" y1="22.3" x2="128" y2="21.0" stroke="#ff5a36" stroke-width="0.9"/>
        <polygon points="120,24.5 121.5,21.5 126,21.5 127.5,24.5" fill="#142c3c" stroke="#d4e3e6" stroke-width="0.8"/>
        <line x1="121" y1="22.6" x2="115" y2="22.2" stroke="#38bdf8" stroke-width="0.95"/>
      </g>

      <!-- 6. 内部三层立体两栖投送剖面 (泛水船坞舱 2×LCAC + 舰舯三层 2,200㎡ 重型车辆甲板 + 4×PC2.5 柴油机舱) -->
      <g id="lpd17-internal-cutaway">
        <!-- (A) 舰尾泛水船坞舱 (Floodable Well Deck · X=20..122, Y=46.2..56.0) -->
        <rect x="20" y="46.2" width="102" height="9.8" fill="#050c10" stroke="#ff5a36" stroke-width="0.95" stroke-dasharray="3 1.5"/>
        <line x1="20" y1="46.2" x2="16.5" y2="50.5" stroke="#eab308" stroke-width="1.1"/>
        <!-- LCAC #1 (X=25..67) -->
        <g transform="translate(25,47.5)">
          <rect x="0" y="4.8" width="42" height="2.0" rx="0.8" fill="#261014" stroke="#ff5a36" stroke-width="0.75"/>
          <rect x="2.0" y="3.4" width="38" height="1.4" fill="#102432" stroke="#d4e3e6" stroke-width="0.65"/>
          <polygon points="15,3.4 17,1.4 29,1.4 31,3.4" fill="#18364a" stroke="#38bdf8" stroke-width="0.55"/>
          <rect x="2.5" y="0.5" width="6.2" height="2.9" rx="0.6" fill="#09151e" stroke="#eab308" stroke-width="0.75"/>
        </g>
        <!-- LCAC #2 (X=73..115) -->
        <g transform="translate(73,47.5)">
          <rect x="0" y="4.8" width="42" height="2.0" rx="0.8" fill="#261014" stroke="#ff5a36" stroke-width="0.75"/>
          <rect x="2.0" y="3.4" width="38" height="1.4" fill="#102432" stroke="#d4e3e6" stroke-width="0.65"/>
          <polygon points="15,3.4 17,1.4 29,1.4 31,3.4" fill="#18364a" stroke="#38bdf8" stroke-width="0.55"/>
          <rect x="2.5" y="0.5" width="6.2" height="2.9" rx="0.6" fill="#09151e" stroke="#eab308" stroke-width="0.75"/>
        </g>
        <text x="71" y="59.2" text-anchor="middle" class="mono" font-size="2.4" fill="#ff5a36">WELL DECK (2×LCAC / 1×LCU / 14×EFV)</text>

        <!-- (B) 舰舯三层 2,200㎡ 重型车辆甲板 (3-Deck Vehicle Stowage Bay · X=126..312, Y=37.2..54.0) -->
        <rect x="126" y="37.2" width="186" height="16.8" fill="#061016" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2.5 1.2"/>
        <!-- 三层车辆甲板分界层板与内部斜坡道 -->
        <line x1="126" y1="42.8" x2="312" y2="42.8" stroke="#38bdf8" stroke-width="0.65"/>
        <line x1="126" y1="48.4" x2="312" y2="48.4" stroke="#38bdf8" stroke-width="0.65"/>
        <line x1="196" y1="48.4" x2="212" y2="42.8" stroke="#eab308" stroke-width="0.85"/>
        <line x1="252" y1="42.8" x2="268" y2="37.2" stroke="#eab308" stroke-width="0.85"/>
        <!-- 上/中/下三层停放的 M1A1 主战坦克与 AAV-7A1 / ACV 两栖突击车序列 -->
        <g fill="#142c3c" stroke="#d4e3e6" stroke-width="0.55">
          <!-- 上层甲板车辆 -->
          <rect x="134" y="39.5" width="13" height="2.8"/><rect x="152" y="39.5" width="13" height="2.8"/><rect x="170" y="39.5" width="13" height="2.8"/>
          <!-- 中层甲板 M1A1 坦克 (带炮管) -->
          <rect x="134" y="45.0" width="14" height="2.9" stroke="#eab308"/><line x1="148" y1="45.8" x2="154" y2="45.6" stroke="#eab308" stroke-width="0.7"/>
          <rect x="160" y="45.0" width="14" height="2.9" stroke="#eab308"/><line x1="174" y1="45.8" x2="180" y2="45.6" stroke="#eab308" stroke-width="0.7"/>
          <!-- 下层甲板 ACV / AAV-7A1 突击车列 -->
          <rect x="134" y="50.6" width="13" height="2.8" stroke="#38bdf8"/><rect x="152" y="50.6" width="13" height="2.8" stroke="#38bdf8"/>
          <rect x="170" y="50.6" width="13" height="2.8" stroke="#38bdf8"/><rect x="188" y="50.6" width="13" height="2.8" stroke="#38bdf8"/>
        </g>
        <text x="260" y="41.2" text-anchor="middle" class="mono" font-size="2.3" fill="#38bdf8">3-DECK VEHICLE BAY (2,200 SQ.M)</text>
