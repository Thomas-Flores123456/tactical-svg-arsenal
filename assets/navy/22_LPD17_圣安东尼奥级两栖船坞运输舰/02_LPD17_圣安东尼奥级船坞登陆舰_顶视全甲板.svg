<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" data-asset-id="naval.sanantonio17.top" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      .p { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1080" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">US NAVY SAN ANTONIO-CLASS LPD-17 · ORTHOGRAPHIC STEALTH DECK PLAN VIEW</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">LPD-17「圣安东尼奥级」隐身船坞运输舰 · 顶视双八角AEM/S桅杆与飞行甲板总图 (25,300T)</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9.5">6.54:1 BROAD STEALTH HULL (208.5M × 31.9M) · 2×OCTAGONAL AEM/S MASTS · ENCLOSED RHIB BAYS · 2×RAM · 2×30MM MK 46 · MV-22B</text>
    <text x="1066" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 scale(2.400,2.400)，严格锁定 6.54:1 真实长宽比) -->
  <g id="layer-ship-cad">
    <g transform="translate(26.0,78.0) scale(2.400,2.400)">
      <!-- 0. 外部净空区尺寸标尺与引线标注 (严格置于 Y=6.0 与 Y=82.5 净空区，零碰撞) -->
      <g id="lpd17-top-callouts">
        <!-- 左端 31.9M 舰宽标尺 (Y=14.0..74.0, 跨度 60.0 单位) -->
        <line x1="9" y1="14.0" x2="9" y2="74.0" stroke="#38bdf8" stroke-width="0.65"/>
        <line x1="6.5" y1="14.0" x2="11.5" y2="14.0" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="6.5" y1="74.0" x2="11.5" y2="74.0" stroke="#38bdf8" stroke-width="0.75"/>
        <text x="5.5" y="44.0" text-anchor="middle" transform="rotate(-90 5.5 44.0)" class="mono" font-size="2.6" fill="#38bdf8">BEAM 31.9M (6.54:1)</text>

        <!-- 上方净空标注：后飞行甲板与后八角 AEM/S 集成桅杆 -->
        <text x="20" y="6.8" class="mono" font-size="2.5" fill="#eab308">AFT FLIGHT DECK: SPOTS 1 &amp; 2 (MV-22B + CH-53K)</text>
        <polyline points="178.5,31.0 170,6.2 196,6.2" fill="none" stroke="#38bdf8" stroke-width="0.65"/>
        <circle cx="178.5" cy="31.0" r="1.0" fill="#38bdf8"/>
        <text x="198" y="6.8" class="mono" font-size="2.5" fill="#38bdf8">AFT OCTAGONAL AEM/S MAST (SPS-48G)</text>

        <!-- 下方净空标注：舯部隐身快艇舱门与前八角 AEM/S 集成桅杆 -->
        <polyline points="236,70.5 224,81.5 136,81.5" fill="none" stroke="#eab308" stroke-width="0.65"/>
        <circle cx="236" cy="70.5" r="1.0" fill="#eab308"/>
        <text x="134" y="82.2" text-anchor="end" class="mono" font-size="2.5" fill="#eab308">FLUSH RHIB &amp; CRANE BAYS</text>

        <polyline points="301.5,57.0 312,81.5 404,81.5" fill="none" stroke="#38bdf8" stroke-width="0.65"/>
        <circle cx="301.5" cy="57.0" r="1.0" fill="#38bdf8"/>
        <text x="314" y="82.2" class="mono" font-size="2.5" fill="#38bdf8">FWD AEM/S MAST + RAM + 30MM MK 46</text>
      </g>

      <!-- 1. 宽厚 6.54:1 全封闭多面体隐身船体主轮廓 (LOA=208.5m -> X=20..412, BEAM=31.9m -> Y=14.0..74.0) -->
      <g id="lpd17-top-hull">
        <!-- 外层水线/干舷折角边界 (Y=14.0..74.0) -->
        <path d="M 20,16.5 L 26,14.0 L 312,14.0 C 352,14.0 388,24.5 412,44.0 C 388,63.5 352,74.0 312,74.0 L 26,74.0 L 20,71.5 Z"
              fill="#0a1822" stroke="#d4e3e6" stroke-width="1.35"/>
        <!-- 内倾干舷折角内边界 (Tumblehome Flush Deck Edge · 无外露甲板走道) -->
        <path d="M 22,18.5 L 310,17.5 C 348,17.5 382,27.0 404,44.0 C 382,61.0 348,70.5 310,70.5 L 22,69.5 Z"
              fill="#0d202c" stroke="#38bdf8" stroke-width="0.85"/>

        <!-- 舰首封闭式锚机甲板舱室、防浪折线与中轴线 (X=356..412) -->
        <polygon points="356,24.5 384,32.0 404,44.0 384,56.0 356,63.5" fill="#102432" stroke="#d4e3e6" stroke-width="0.95"/>
        <line x1="356" y1="44.0" x2="412" y2="44.0" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4 2"/>
        <!-- 舰首封闭式系缆孔与顶视「17」标号 -->
        <rect x="372" y="38.5" width="12" height="11.0" fill="#08131a" stroke="#38bdf8" stroke-width="0.65"/>
        <text x="378" y="46.2" text-anchor="middle" class="mono" font-size="5.2" fill="#d4e3e6" font-weight="bold">17</text>
      </g>

      <!-- 2. 后部宽大飞行甲板与底层泛水船坞舱虚线透视 (Aft Flight Deck &amp; Well Deck Footprint · X=20..120) -->
      <g id="lpd17-top-flight-deck">
        <rect x="20" y="15.5" width="100" height="57.0" fill="#08131a" stroke="#d4e3e6" stroke-width="1.15"/>
        <!-- 两侧防坠安全网虚线 -->
        <line x1="22" y1="14.2" x2="118" y2="14.2" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 1.5"/>
        <line x1="22" y1="73.8" x2="118" y2="73.8" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3 1.5"/>

        <!-- 底层泛水船坞舱 (2×LCAC) 虚线轮廓 -->
        <rect x="20" y="25.0" width="96" height="38.0" fill="none" stroke="#ff5a36" stroke-width="0.75" stroke-dasharray="3.5 2"/>

        <!-- 飞行甲板纵向引导标线与舰尾「17」着舰识别大字 -->
        <line x1="24" y1="26.0" x2="118" y2="26.0" stroke="#d4e3e6" stroke-width="0.85"/>
        <line x1="24" y1="62.0" x2="118" y2="62.0" stroke="#d4e3e6" stroke-width="0.85"/>
        <line x1="24" y1="44.0" x2="118" y2="44.0" stroke="#eab308" stroke-width="0.95" stroke-dasharray="5 2.5"/>
        <text x="27" y="46.5" text-anchor="middle" class="mono" font-size="6.8" fill="#d4e3e6" font-weight="bold">17</text>

        <!-- 前后 2 个大型旋翼机起降圈 (Spot 1 at X=90, Spot 2 at X=48) -->
        <circle cx="90" cy="44.0" r="11.5" fill="none" stroke="#eab308" stroke-width="0.95" stroke-dasharray="4 2"/>
        <circle cx="90" cy="44.0" r="3.5" fill="none" stroke="#d4e3e6" stroke-width="0.8"/>
        <text x="90" y="60.2" text-anchor="middle" class="mono" font-size="2.6" fill="#eab308">SPOT 1</text>

        <circle cx="48" cy="44.0" r="11.5" fill="none" stroke="#eab308" stroke-width="0.95" stroke-dasharray="4 2"/>
        <circle cx="48" cy="44.0" r="3.5" fill="none" stroke="#d4e3e6" stroke-width="0.8"/>
        <text x="48" y="60.2" text-anchor="middle" class="mono" font-size="2.6" fill="#eab308">SPOT 2</text>
      </g>

      <!-- 3. 全通式多面体内倾隐身封闭上层建筑 (Full-Width Faceted Enclosed Superstructure · X=120..356, Y=17.5..70.5) -->
      <g id="lpd17-top-superstructure">
        <!-- 主封闭堡垒甲板室 -->
        <polygon points="120,17.5 316,17.5 356,24.5 356,63.5 316,70.5 120,70.5"
                 fill="#0f2330" stroke="#d4e3e6" stroke-width="1.25"/>
        <!-- 上层建筑顶部内收折角甲板面 (Tumblehome Roof Facets · Y=22.5..65.5) -->
        <polygon points="124,22.5 312,22.5 348,28.5 348,59.5 312,65.5 124,65.5"
                 fill="#132b3a" stroke="#38bdf8" stroke-width="0.9"/>
        <!-- 侧壁内倾折面斜肋线 -->
        <line x1="120" y1="17.5" x2="124" y2="22.5" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="120" y1="70.5" x2="124" y2="65.5" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="208" y1="17.5" x2="208" y2="22.5" stroke="#4a6368" stroke-width="0.65"/>
        <line x1="208" y1="70.5" x2="208" y2="65.5" stroke="#4a6368" stroke-width="0.65"/>
        <line x1="262" y1="17.5" x2="262" y2="22.5" stroke="#4a6368" stroke-width="0.65"/>
        <line x1="262" y1="70.5" x2="262" y2="65.5" stroke="#4a6368" stroke-width="0.65"/>
        <line x1="316" y1="17.5" x2="312" y2="22.5" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="316" y1="70.5" x2="312" y2="65.5" stroke="#38bdf8" stroke-width="0.75"/>

        <!-- 前舰桥多面体指挥室与楔形观察窗 (Stealth Faceted Bridge · X=318..348, Y=29.0..59.0) -->
        <polygon points="318,29.0 338,29.0 348,35.5 348,52.5 338,59.0 318,59.0"
                 fill="#18364a" stroke="#d4e3e6" stroke-width="1.05"/>
        <polyline points="336,30.5 345,36.5 345,51.5 336,57.5" fill="none" stroke="#38bdf8" stroke-width="1.2"/>

        <!-- 舰桥后方 Mk 41 垂发系统预留井位舱盖 (16-Cell Mk 41 VLS Space/Weight Reservation · X=322..334, Y=38.0..50.0) -->
        <rect x="322" y="38.0" width="12" height="12.0" fill="#08131a" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 1.2"/>
        <line x1="328" y1="38.0" x2="328" y2="50.0" stroke="#4a6368" stroke-width="0.55"/>
        <line x1="322" y1="44.0" x2="334" y2="44.0" stroke="#4a6368" stroke-width="0.55"/>

        <!-- 舯部封闭舱门内透视：大型重型艇吊与左右各1艘 11m RHIB 刚性充气快艇 (X=212..258) -->
        <rect x="212" y="24.0" width="46" height="10.5" fill="#071118" stroke="#eab308" stroke-width="0.85" stroke-dasharray="3 1.5"/>
        <ellipse cx="230" cy="29.2" rx="10.5" ry="3.2" fill="#163244" stroke="#d4e3e6" stroke-width="0.75"/>
        <ellipse cx="230" cy="29.2" rx="7.0" ry="1.6" fill="#09151e" stroke="#38bdf8" stroke-width="0.55"/>

        <rect x="212" y="53.5" width="46" height="10.5" fill="#071118" stroke="#eab308" stroke-width="0.85" stroke-dasharray="3 1.5"/>
        <ellipse cx="230" cy="58.8" rx="10.5" ry="3.2" fill="#163244" stroke="#d4e3e6" stroke-width="0.75"/>
        <ellipse cx="230" cy="58.8" rx="7.0" ry="1.6" fill="#09151e" stroke="#38bdf8" stroke-width="0.55"/>

        <!-- 中轴重型艇吊旋转基座与吊臂 -->
        <circle cx="246" cy="44.0" r="3.8" fill="#163244" stroke="#eab308" stroke-width="0.9"/>
        <line x1="246" y1="44.0" x2="228" y2="31.5" stroke="#eab308" stroke-width="1.05"/>
        <line x1="246" y1="44.0" x2="228" y2="56.5" stroke="#eab308" stroke-width="1.05"/>
      </g>

      <!-- 4. 核心灵魂：前后两座巨型八角形多面体 AEM/S 复合材料全封闭隐身集成主桅 + 隐身烟囱罩 -->
      <g id="lpd17-top-aems-masts">
        <!-- (1) 前八角形 AEM/S 集成主桅俯视图 (Forward Octagonal AEM/S Mast · Center X=301.5, Y=44.0, 跨度 X=285..318) -->
        <!-- 外层八边形底座 -->
        <polygon points="285,39.0 290,31.5 313,31.5 318,39.0 318,49.0 313,56.5 290,56.5 285,49.0"
                 fill="#0e2230" stroke="#d4e3e6" stroke-width="1.3"/>
        <!-- 中层八边形折面锥台 -->
        <polygon points="290,40.5 294,35.0 309,35.0 313,40.5 313,47.5 309,53.0 294,53.0 290,47.5"
                 fill="#163244" stroke="#38bdf8" stroke-width="1.0"/>
        <!-- 顶层八边形封顶盖 -->
        <polygon points="296,42.0 298.5,39.0 304.5,39.0 307,42.0 307,46.0 304.5,49.0 298.5,49.0 296,46.0"
                 fill="#08131a" stroke="#d4e3e6" stroke-width="0.9"/>
        <!-- 八角形放射状折面棱线 -->
        <line x1="285" y1="39.0" x2="296" y2="42.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="290" y1="31.5" x2="298.5" y2="39.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="313" y1="31.5" x2="304.5" y2="39.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="318" y1="39.0" x2="307" y2="42.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="318" y1="49.0" x2="307" y2="46.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="313" y1="56.5" x2="304.5" y2="49.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="290" y1="56.5" x2="298.5" y2="49.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="285" y1="49.0" x2="296" y2="46.0" stroke="#38bdf8" stroke-width="0.7"/>
        <!-- 内部透视虚线：AN/SPQ-9B 旋转雷达天线 -->
        <circle cx="301.5" cy="44.0" r="6.8" fill="none" stroke="#eab308" stroke-width="0.65" stroke-dasharray="2 1.2"/>
        <rect x="300.2" y="38.5" width="2.6" height="11.0" rx="0.8" fill="none" stroke="#eab308" stroke-width="0.8" stroke-dasharray="1.8 1"/>

        <!-- 前桅后方低矮隐身排气烟囱罩 (X=264..280, Y=36.0..52.0) -->
        <polygon points="264,37.0 267,35.0 278,35.0 280,37.0 280,51.0 278,53.0 267,53.0 264,51.0"
                 fill="#0b1a24" stroke="#d4e3e6" stroke-width="0.95"/>
        <rect x="267" y="37.5" width="10" height="5.5" rx="1" fill="#04080b" stroke="#38bdf8" stroke-width="0.7"/>
        <rect x="267" y="45.0" width="10" height="5.5" rx="1" fill="#04080b" stroke="#38bdf8" stroke-width="0.7"/>
        <circle cx="268" cy="28.0" r="2.5" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.7"/>
        <circle cx="268" cy="60.0" r="2.5" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.7"/>

        <!-- (2) 后八角形 AEM/S 集成主桅俯视图 (Aft Octagonal AEM/S Mast · Center X=178.5, Y=44.0, 跨度 X=162..195) -->
        <polygon points="162,39.0 167,31.5 190,31.5 195,39.0 195,49.0 190,56.5 167,56.5 162,49.0"
                 fill="#0e2230" stroke="#d4e3e6" stroke-width="1.3"/>
        <polygon points="167,40.5 171,35.0 186,35.0 190,40.5 190,47.5 186,53.0 171,53.0 167,47.5"
                 fill="#163244" stroke="#38bdf8" stroke-width="1.0"/>
        <polygon points="173,42.0 175.5,39.0 181.5,39.0 184,42.0 184,46.0 181.5,49.0 175.5,49.0 173,46.0"
                 fill="#08131a" stroke="#d4e3e6" stroke-width="0.9"/>
        <!-- 八角形放射状折面棱线 -->
        <line x1="162" y1="39.0" x2="173" y2="42.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="167" y1="31.5" x2="175.5" y2="39.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="190" y1="31.5" x2="181.5" y2="39.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="195" y1="39.0" x2="184" y2="42.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="195" y1="49.0" x2="184" y2="46.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="190" y1="56.5" x2="181.5" y2="49.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="167" y1="56.5" x2="175.5" y2="49.0" stroke="#38bdf8" stroke-width="0.7"/>
        <line x1="162" y1="49.0" x2="173" y2="46.0" stroke="#38bdf8" stroke-width="0.7"/>
        <!-- 内部透视虚线：AN/SPS-48G 3D 对空搜索雷达旋转阵列 -->
        <circle cx="178.5" cy="44.0" r="7.5" fill="none" stroke="#ff5a36" stroke-width="0.65" stroke-dasharray="2 1.2"/>
        <rect x="176.8" y="37.5" width="3.4" height="13.0" rx="0.8" fill="none" stroke="#ff5a36" stroke-width="0.85" stroke-dasharray="1.8 1"/>

        <!-- 后桅后方低矮隐身排气烟囱罩與后机库顶结构 (X=144..159, Y=36.0..52.0) -->
        <polygon points="144,37.0 147,35.0 157,35.0 159,37.0 159,51.0 157,53.0 147,53.0 144,51.0"
                 fill="#0b1a24" stroke="#d4e3e6" stroke-width="0.95"/>
        <rect x="147" y="37.5" width="9.5" height="5.5" rx="1" fill="#04080b" stroke="#38bdf8" stroke-width="0.7"/>
        <rect x="147" y="45.0" width="9.5" height="5.5" rx="1" fill="#04080b" stroke="#38bdf8" stroke-width="0.7"/>
        <circle cx="201" cy="30.0" r="2.5" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.7"/>
        <circle cx="201" cy="58.0" r="2.5" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.7"/>
      </g>

      <!-- 5. 前后自卫武备顶视图：2×RIM-116 RAM 海拉姆 + 2×30mm Mk 46 Bushmaster II 隐身舰炮 -->
      <g id="lpd17-top-weapons">
        <!-- 前舰桥顶：右舷 RIM-116 RAM (X=343, Y=52.0) + 前中轴 30mm Mk 46 隐身舰炮 (X=360, Y=44.0) -->
