<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" data-asset-id="naval.kilo636.side" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.p { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="320" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="280" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 284 V 300 H 36 M 1064 300 H 1080 V 284" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="274" x2="1080" y2="274" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="9.5" font-weight="bold">PROJECT 636.3 IMPROVED KILO SSK (B-261 NOVOROSSIYSK) · STARBOARD PROFILE</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="9.5">636.3型「改进型基洛」级常规潜艇 · 侧视6隔舱与口径导弹剖面图 (3,950T)</text>
    <text x="34" y="291" class="p mono" fill="#8aa1a7" font-size="9.5">LOA: 73.8M · BEAM: 9.9M · 6×533MM TUBES (4×3M-54/14 KALIBR-PL + 14×TORPEDOES) · 2×2DL-42M + PG-141 · UID: 65</text>
    <text x="1066" y="291" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT (7.45:1)</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 sx=sy=2.380 · 艇首朝右 +X · X=24..404 长380单位 = 73.8m) -->
  <g id="layer-ship-cad">
    <g transform="translate(56.0,56.0) scale(2.380,2.380)">
      <!-- 0. 顶部潜望镜深度水面线与 3M-54E Kalibr-PL (SS-N-27「口径」) 鱼雷管出水点火突防轨迹 -->
      <g id="kalibr-torpedo-launch-envelope">
        <line x1="14.0" y1="15.0" x2="416.0" y2="15.0" stroke="#2c3b40" stroke-width="0.6" stroke-dasharray="4 3"/>
        <text x="18.0" y="12.5" class="mono" font-size="2.5" fill="#5f7c84">SEA SURFACE DATUM · 533MM TORPEDO-TUBE LAUNCHED 3M-54E KALIBR-PL TRAJECTORY</text>

        <!-- 从艇首上部 533mm 鱼雷管射出并跃出水面的抛物爬升轨迹弧线 -->
        <path d="M 401.5 40.5 C 416.0 39.5 415.0 21.0 388.0 9.5" fill="none" stroke="#ff5a36" stroke-width="0.85" stroke-dasharray="2.4 1.5"/>
        <!-- 水下分离抛弃的启动运载器环盖 -->
        <rect x="407.5" y="27.5" width="3.5" height="1.6" transform="rotate(-55 409 28)" fill="#0d2230" stroke="#38bdf8" stroke-width="0.55"/>

        <!-- 跃出水面点火爬升的 3M-54E「口径」(Kalibr-PL / Club-S) 潜射巡航导弹剪影 -->
        <g transform="translate(382.0, 8.2) rotate(-158)">
          <!-- 固体助推器尾焰 -->
          <polygon points="-9.0,0 -4.2,-1.4 -4.2,1.4" fill="#ff5a36" fill-opacity="0.85"/>
          <rect x="-4.2" y="-1.1" width="4.2" height="2.2" fill="#261014" stroke="#eab308" stroke-width="0.65"/>
          <!-- 圆柱巡航弹体与三级超音速战斗部头锥 -->
          <path d="M 0 -1.0 L 12.5 -1.0 C 14.8 -1.0 16.5 -0.45 17.2 0 C 16.5 0.45 14.8 1.0 12.5 1.0 L 0 1.0 Z"
                fill="#142b3a" stroke="#ff5a36" stroke-width="0.75"/>
          <!-- 展开态折叠弹翼与十字尾翼 -->
          <polygon points="4.5,-1.0 3.0,-5.5 5.2,-5.5 7.2,-1.0" fill="#0d2230" stroke="#d4e3e6" stroke-width="0.55"/>
          <polygon points="4.5,1.0 3.0,5.5 5.2,5.5 7.2,1.0" fill="#0d2230" stroke="#d4e3e6" stroke-width="0.55"/>
          <polygon points="-3.8,-1.1 -5.0,-2.8 -2.4,-1.1" fill="#0d2230" stroke="#38bdf8" stroke-width="0.5"/>
          <polygon points="-3.8,1.1 -5.0,2.8 -2.4,1.1" fill="#0d2230" stroke="#38bdf8" stroke-width="0.5"/>
        </g>
        <text x="358.0" y="5.5" text-anchor="end" class="mono" font-size="2.5" fill="#ff5a36" font-weight="bold">3M-54E KALIBR-PL (SS-N-27 · MACH 2.9)</text>
      </g>

      <!-- 1. 艇尾 T 形舵构型 (T-Tail Stern · 无下垂尾舵) + 250rpm 超低噪 7 叶大侧斜螺旋桨 (X=23.5..68.0) -->
      <g id="t-tail-stern-and-7blade-screw">
        <!-- 高耸的上垂直方向舵 (Upper Vertical Rudder · X=34..60, Y=23.5..51.5) -->
        <polygon points="34.0,51.5 39.5,23.5 50.5,23.5 60.0,47.5" fill="#0a1822" stroke="#d4e3e6" stroke-width="1.15"/>
        <line x1="45.0" y1="23.5" x2="46.5" y2="50.0" stroke="#4a6368" stroke-width="0.75"/>
        <line x1="45.0" y1="26.0" x2="54.0" y2="26.0" stroke="#38bdf8" stroke-width="0.6"/>
        <!-- 艇尾下部平直坐底龙骨护踵 (Flat Bottom Skeg · 严禁画下垂直尾舵！) -->
        <polygon points="38.0,64.5 74.0,73.5 74.0,75.8 36.0,66.2" fill="#1d0c10" stroke="#ff5a36" stroke-width="0.8"/>

        <!-- 艇尾水平升降舵面与尾流消涡整流鳍 (Horizontal Stern Planes · X=35..64, Y=55.5) -->
        <ellipse cx="48.5" cy="56.5" rx="14.5" ry="2.0" fill="#091620" stroke="#38bdf8" stroke-width="0.9"/>
        <line x1="35.5" y1="56.5" x2="61.5" y2="56.5" stroke="#d4e3e6" stroke-width="0.6"/>

        <!-- 250 rpm 超低转速 7 叶大侧斜镰刀螺旋桨 (7-Blade Skewed Quiet Propeller · #eab308 高亮) -->
        <g stroke="#eab308" stroke-width="0.9" fill="#eab308" fill-opacity="0.3">
          <polygon points="24.0,56.5 28.5,53.8 28.5,59.2"/>
          <path d="M 26.2 56.5 C 23.2 50.8 25.0 46.8 28.2 47.8 C 27.6 51.2 27.2 54.0 26.2 56.5 Z"/>
          <path d="M 26.2 56.5 C 23.2 62.2 25.0 66.2 28.2 65.2 C 27.6 61.8 27.2 59.0 26.2 56.5 Z"/>
          <path d="M 25.0 54.2 C 22.2 51.5 23.0 49.0 25.6 50.0"/>
          <path d="M 25.0 58.8 C 22.2 61.5 23.0 64.0 25.6 63.0"/>
          <circle cx="26.2" cy="56.5" r="1.2" fill="#eab308" stroke="#080a0b" stroke-width="0.4"/>
        </g>
        <text x="24.0" y="20.5" class="mono" font-size="2.4" fill="#eab308">T-TAIL STERN &amp; 7-BLADE SKEWED SCREW</text>
      </g>

      <!-- 2. 主艇体：7.45:1 饱满水滴形双壳体外廓 + 鲸鱼形钝圆上扬艇首 + 下颚巨型声呐球鼻 (X=28..404, Y=34.5..77.0) -->
      <g id="kilo-outer-hull">
        <!-- 下半部暗红防污消声瓦船底与下颚 MGK-400EM 巨型声呐罩包络 -->
        <path d="M 28.5 56.5 L 403.5 56.5 C 401.5 64.0 398.5 76.8 380.0 77.0 L 136.0 76.5 C 94.0 76.5 54.0 68.0 28.5 59.2 Z"
              fill="#220d12" stroke="#ff5a36" stroke-width="1.0"/>
        <!-- 上半部饱满水滴形消声橡胶瓦外壳与鲸鱼形高耸钝圆艇首 (Whale-Shaped Blunt Bow) -->
        <path d="M 28.5 53.8 C 52.0 46.2 88.0 38.2 126.0 35.5 L 352.0 34.5 C 378.0 34.5 396.0 35.2 402.0 39.2 C 404.8 41.2 404.5 47.8 400.5 51.2 C 397.5 53.5 402.5 56.5 400.5 64.0 C 398.0 73.5 391.0 77.0 378.0 77.0 L 136.0 76.5 C 94.0 76.5 54.0 68.0 28.5 59.2 Z"
              fill="#08131b" fill-opacity="0.88" stroke="#d4e3e6" stroke-width="1.35"/>

        <!-- 艇体中轴吃水线、消声瓦分格线与上甲板纵向排水孔栅格 (Flooding Slots) -->
        <line x1="30.0" y1="53.5" x2="399.5" y2="53.5" stroke="#4a6368" stroke-width="0.65" stroke-dasharray="5 2.5"/>
        <!-- 艇首与上甲板标志性 6 道纵向长条形排水孔栅格 (X=306..368, Y=36.2..38.0) -->
        <g fill="#040a0e" stroke="#38bdf8" stroke-width="0.6">
          <rect x="306.0" y="36.2" width="7.5" height="1.7" rx="0.4"/>
          <rect x="316.0" y="36.2" width="7.5" height="1.7" rx="0.4"/>
          <rect x="326.0" y="36.2" width="7.5" height="1.7" rx="0.4"/>
          <rect x="336.0" y="36.2" width="7.5" height="1.7" rx="0.4"/>
          <rect x="346.0" y="36.2" width="7.5" height="1.7" rx="0.4"/>
          <rect x="356.0" y="36.2" width="7.5" height="1.7" rx="0.4"/>
        </g>
        <!-- 后部压载水舱底排孔群 -->
        <g stroke="#4a6368" stroke-width="1.1" stroke-dasharray="2.2 1.5">
          <line x1="82.0" y1="71.2" x2="118.0" y2="74.5"/>
          <line x1="142.0" y1="75.0" x2="188.0" y2="75.0"/>
          <line x1="298.0" y1="75.0" x2="342.0" y2="75.0"/>
        </g>
      </g>

      <!-- 3. 前倾梯形流线指挥台围壳 (Forward-Slanted Trapezoidal Sail · X=228..289, Y=18.5..35.0) + 8×9K38 Igla-M 防空导弹 -->
      <g id="kilo-forward-slanted-sail">
        <!-- 基洛级标志性前缘前倾梯形指挥台围壳与底部消涡导流裙边 -->
        <path d="M 226.0 35.0 L 234.0 18.8 L 289.0 18.8 L 284.5 29.5 Q 283.5 34.8 292.0 35.0 Z"
              fill="#0c1e2a" stroke="#d4e3e6" stroke-width="1.2"/>
        <line x1="231.0" y1="26.5" x2="286.2" y2="26.5" stroke="#4a6368" stroke-width="0.65"/>
        <!-- 围壳前部防风导航观察窗与舷灯 -->
        <polygon points="274.5,20.5 287.2,20.5 286.0,23.8 274.5,23.8" fill="#06121a" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="256.0" y="32.5" text-anchor="middle" class="mono" font-size="2.4" fill="#d4e3e6">B-261 · PR.636.3</text>

        <!-- 围壳内部备便的 8枚 9K38M Igla-M / Verba (针-M/柳树) 潜空防空导弹发射架透视 (X=235..246, Y=20.2..26.0) -->
        <rect x="235.5" y="20.2" width="10.5" height="5.6" rx="0.6" fill="#1e0c10" stroke="#ff5a36" stroke-width="0.75" stroke-dasharray="1.8 1.0"/>
        <line x1="237.5" y1="22.8" x2="245.0" y2="19.5" stroke="#eab308" stroke-width="0.85"/>

        <!-- 围壳顶置升降桅杆群：PZNG-8M 攻击潜望镜、PR-14 导航潜望镜、MRK-50 雷达、MRP-25 电子战与 RDP 通气管 -->
        <!-- PZNG-8M 攻击潜望镜 -->
        <line x1="279.0" y1="18.8" x2="279.0" y2="7.5" stroke="#d4e3e6" stroke-width="0.95"/>
        <rect x="277.5" y="5.8" width="3.0" height="2.0" fill="#133246" stroke="#38bdf8" stroke-width="0.7"/>
        <!-- PR-14 观察/光电潜望镜 -->
        <line x1="271.5" y1="18.8" x2="271.5" y2="9.2" stroke="#d4e3e6" stroke-width="0.9"/>
        <circle cx="271.5" cy="8.4" r="1.1" fill="#0d2230" stroke="#eab308" stroke-width="0.7"/>
        <!-- MRK-50 Kaskad (Snoop Tray) 对海搜索雷达桅杆 -->
        <line x1="263.0" y1="18.8" x2="263.0" y2="10.8" stroke="#5f7c84" stroke-width="0.9"/>
        <rect x="259.8" y="9.4" width="6.4" height="1.6" rx="0.4" fill="#0d2230" stroke="#38bdf8" stroke-width="0.75"/>
        <!-- RDP 柴油机水下通气管 (Snorkel Induction Mast) -->
        <line x1="249.5" y1="18.8" x2="249.5" y2="11.5" stroke="#ff5a36" stroke-width="1.1"/>
        <ellipse cx="249.5" cy="11.0" rx="1.8" ry="1.0" fill="#261014" stroke="#ff5a36" stroke-width="0.7"/>
        <text x="262.0" y="4.2" text-anchor="middle" class="mono" font-size="2.4" fill="#38bdf8">PERISCOPES + RDP + 8×IGLA-M</text>
      </g>

      <!-- 4. 双壳体内部 Ø7.2m 耐压壳体与 6 大水密隔舱总布置内透视 (X=56..356, Y=40.5..74.0) -->
      <g id="six-compartments-cutaway">
        <!-- Ø7.2m 耐压壳体外缘轮廓 (前4隔舱等直径圆柱 + 后2隔舱圆锥台过渡段) -->
        <polygon points="56.0,51.0 132.0,40.8 354.0,40.8 354.0,73.8 132.0,73.8 56.0,62.0"
                 fill="#061018" fill-opacity="0.72" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="4.5 2.0"/>

        <!-- 5道横向水密舱壁分界线 (分隔 I ~ VI 共 6 个水密隔舱) -->
        <g stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2.2 1.2">
          <line x1="86.0" y1="47.0" x2="86.0" y2="66.5"/>
          <line x1="132.0" y1="40.8" x2="132.0" y2="73.8"/>
          <line x1="184.0" y1="40.8" x2="184.0" y2="73.8"/>
          <line x1="236.0" y1="40.8" x2="236.0" y2="73.8"/>
          <line x1="292.0" y1="40.8" x2="292.0" y2="73.8"/>
        </g>

        <!-- [第 VI 隔舱 · X=56..86] 尾舵机电与轴系密封舱 -->
        <line x1="28.5" y1="56.5" x2="128.0" y2="56.5" stroke="#eab308" stroke-width="1.15" stroke-dasharray="3.5 1.5"/>
        <text x="71.0" y="54.2" text-anchor="middle" class="mono" font-size="2.2" fill="#8aa1a7">VI</text>

        <!-- [第 V 隔舱 · X=86..132] 主推进电机舱：PG-141M (5,500 SHP) 主电机 + PG-142 经航超静音电机 -->
        <ellipse cx="109.0" cy="56.5" rx="14.5" ry="8.2" fill="#1e0c10" stroke="#ff5a36" stroke-width="0.9"/>
        <circle cx="109.0" cy="56.5" r="4.2" fill="#2c1216" stroke="#eab308" stroke-width="0.75"/>
        <text x="109.0" y="68.5" text-anchor="middle" class="mono" font-size="2.3" fill="#ff5a36">V: PG-141 MOTOR</text>

        <!-- [第 IV 隔舱 · X=132..184] 柴电动力舱：2×2DL-42M 增压柴油发电机组 (2×1,500 kW · 双层气囊减振浮筏) -->
        <rect x="137.0" y="45.0" width="42.0" height="16.5" rx="1.4" fill="#180d10" stroke="#eab308" stroke-width="0.85"/>
        <rect x="140.5" y="47.5" width="16.5" height="11.0" fill="#0d202c" stroke="#38bdf8" stroke-width="0.65"/>
        <rect x="159.5" y="47.5" width="16.5" height="11.0" fill="#0d202c" stroke="#38bdf8" stroke-width="0.65"/>
        <text x="158.0" y="68.5" text-anchor="middle" class="mono" font-size="2.3" fill="#eab308">IV: 2×2DL-42M DG</text>

        <!-- [第 III 隔舱 · X=184..236] 艇员生活舱与下层第2组 120块蓄电池坑 -->
        <line x1="184.0" y1="52.0" x2="236.0" y2="52.0" stroke="#4a6368" stroke-width="0.65"/>
        <line x1="184.0" y1="62.5" x2="236.0" y2="62.5" stroke="#4a6368" stroke-width="0.65"/>
        <rect x="188.0" y="63.8" width="44.0" height="8.2" fill="#081e2c" stroke="#38bdf8" stroke-width="0.75"/>
        <text x="210.0" y="69.2" text-anchor="middle" class="mono" font-size="2.2" fill="#38bdf8">III: BATTERY #2</text>

        <!-- [第 II 隔舱 · X=236..292] 中央指挥控制室 (Lama-ER 作战系统) 与下层第1组 120块蓄电池坑 -->
        <line x1="236.0" y1="52.0" x2="292.0" y2="52.0" stroke="#4a6368" stroke-width="0.65"/>
        <line x1="236.0" y1="62.5" x2="292.0" y2="62.5" stroke="#4a6368" stroke-width="0.65"/>
        <text x="264.0" y="48.2" text-anchor="middle" class="mono" font-size="2.3" fill="#d4e3e6">II: LAMA-ER C2</text>
        <rect x="240.0" y="63.8" width="48.0" height="8.2" fill="#081e2c" stroke="#38bdf8" stroke-width="0.75"/>
        <text x="264.0" y="69.2" text-anchor="middle" class="mono" font-size="2.2" fill="#38bdf8">BATTERY #1 (120C)</text>

        <!-- [第 I 隔舱 · X=292..354] 鱼雷与 Kalibr-PL 潜射巡航导弹舱 (备弹18枚：4×3M-54/14 口径导弹 + 14×533mm 重型鱼雷) -->
        <line x1="292.0" y1="52.5" x2="354.0" y2="52.5" stroke="#4a6368" stroke-width="0.65"/>
        <line x1="292.0" y1="63.0" x2="354.0" y2="63.0" stroke="#4a6368" stroke-width="0.65"/>
        <!-- 双层自动快速装填架上的 Kalibr-PL 导弹 (#ff5a36) 与 TEST-71ME/UGST 鱼雷 (#eab308) -->
        <rect x="296.0" y="42.8" width="24.0" height="2.4" rx="0.8" fill="#261014" stroke="#ff5a36" stroke-width="0.75"/>
        <rect x="323.0" y="42.8" width="26.0" height="2.4" rx="0.8" fill="#261014" stroke="#ff5a36" stroke-width="0.75"/>
        <rect x="296.0" y="46.8" width="24.0" height="2.4" rx="0.8" fill="#182214" stroke="#eab308" stroke-width="0.7"/>
        <rect x="323.0" y="46.8" width="26.0" height="2.4" rx="0.8" fill="#182214" stroke="#eab308" stroke-width="0.7"/>
