<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" data-asset-id="naval.kilo636.top" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.p { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1080" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="9.5" font-weight="bold">PROJECT 636.3 IMPROVED KILO SSK (B-261) · TOP VIEW &amp; KALIBR-PL / DOUBLE HULL X-RAY</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="9.5">636.3型「改进型基洛」级潜艇 · 顶视双壳体与口径巡航导弹舱透视图</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9.5">Ø7.2M PRESSURE HULL (6 COMPARTMENTS) · 6×533MM TUBES (4×3M-54/14 KALIBR-PL + 14×TORPEDOES) · MGK-400EM SONAR</text>
    <text x="1066" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT (7.45:1)</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 sx=sy=2.380 · X=24..404 长380 / Y=18.5..69.5 宽51.0 = 7.45:1) -->
  <g id="layer-ship-cad">
    <g transform="translate(56.0,80.0) scale(2.380,2.380)">
      <!-- 0. 顶视纵轴中心基准线、9.9m 艇宽标尺与顶部模块标注 (零碰撞净空排布) -->
      <line x1="14.0" y1="44.0" x2="412.0" y2="44.0" stroke="#2c3b40" stroke-width="0.6" stroke-dasharray="6 3"/>
      <!-- 左端 9.9m 最大艇宽工程标尺 (Y=18.5 .. 69.5 = 51.0 单位) -->
      <line x1="14.5" y1="18.5" x2="14.5" y2="69.5" stroke="#38bdf8" stroke-width="0.65"/>
      <line x1="12.0" y1="18.5" x2="17.0" y2="18.5" stroke="#38bdf8" stroke-width="0.7"/>
      <line x1="12.0" y1="69.5" x2="17.0" y2="69.5" stroke="#38bdf8" stroke-width="0.7"/>
      <text x="10.8" y="44.0" text-anchor="middle" transform="rotate(-90 10.8 44.0)" class="mono" font-size="2.5" fill="#38bdf8">BEAM 9.9M (51.0U)</text>

      <!-- 顶部左舷战略模块说明 -->
      <text x="24.0" y="7.5" class="mono" font-size="2.5" fill="#eab308">STERN: 7-BLADE QUIET SCREW &amp; PG-141</text>
      <text x="152.0" y="7.5" class="mono" font-size="2.5" fill="#38bdf8" font-weight="bold">MID: Ø7.2M PRESSURE HULL &amp; 2×2DL-42M DG</text>
      <text x="296.0" y="7.5" class="mono" font-size="2.5" fill="#ff5a36" font-weight="bold">BOW: 4×KALIBR-PL + 6×533MM TUBES</text>

      <!-- 1. 艇尾水平升降舵、上垂直方向舵脊线、两侧喷水辅推器与 7 叶大侧斜螺旋桨 (Stern X=24..68) -->
      <g id="top-t-tail-and-propeller">
        <!-- 左右水平升降尾舵 (Y=14.8..34.0 &amp; Y=54.0..73.2) -->
        <polygon points="36.0,34.5 41.5,14.8 50.5,14.8 59.5,31.0" fill="#0a1822" stroke="#d4e3e6" stroke-width="1.05"/>
        <line x1="46.0" y1="14.8" x2="48.5" y2="33.0" stroke="#4a6368" stroke-width="0.65"/>
        <polygon points="36.0,53.5 41.5,73.2 50.5,73.2 59.5,57.0" fill="#0a1822" stroke="#d4e3e6" stroke-width="1.05"/>
        <line x1="46.0" y1="73.2" x2="48.5" y2="55.0" stroke="#4a6368" stroke-width="0.65"/>

        <!-- 250 rpm 超低噪 7 叶大侧斜镰刀螺旋桨顶视图 (7-Blade Skewed Quiet Propeller · #eab308 高亮) -->
        <g stroke="#eab308" stroke-width="0.9" fill="#eab308" fill-opacity="0.3">
          <polygon points="24.0,44.0 28.5,41.2 28.5,46.8"/>
          <path d="M 26.2 44.0 C 23.2 38.2 25.0 34.2 28.2 35.2 C 27.6 38.6 27.2 41.5 26.2 44.0 Z"/>
          <path d="M 26.2 44.0 C 23.2 49.8 25.0 53.8 28.2 52.8 C 27.6 49.4 27.2 46.5 26.2 44.0 Z"/>
          <path d="M 25.0 41.8 C 22.2 39.0 23.0 36.5 25.6 37.5"/>
          <path d="M 25.0 46.2 C 22.2 49.0 23.0 51.5 25.6 50.5"/>
          <circle cx="26.2" cy="44.0" r="1.2" fill="#eab308" stroke="#080a0b" stroke-width="0.4"/>
        </g>
      </g>

      <!-- 2. 主艇体 7.45:1 饱满水滴形外表面 (Albacore Teardrop Double Hull · X=28..404, 最大宽 Y=18.5..69.5) -->
      <g id="top-teardrop-outer-hull">
        <!-- 艇首两侧展开态可收放首水平舵 (Retractable Upper Bow Planes · X=346..365, Y=11.8..21.5 &amp; 66.5..76.2) -->
        <polygon points="346.0,21.8 350.5,11.8 360.5,11.8 364.5,20.5" fill="#0b1d28" stroke="#38bdf8" stroke-width="1.0"/>
        <line x1="355.5" y1="11.8" x2="356.5" y2="21.0" stroke="#d4e3e6" stroke-width="0.6"/>
        <polygon points="346.0,66.2 350.5,76.2 360.5,76.2 364.5,67.5" fill="#0b1d28" stroke="#38bdf8" stroke-width="1.0"/>
        <line x1="355.5" y1="76.2" x2="356.5" y2="67.0" stroke="#d4e3e6" stroke-width="0.6"/>

        <!-- 经典拉长水滴形非耐压外壳 (中前部 X=220..310 达到最大艇宽 Y=18.5..69.5，向艇尾平滑流线收缩) -->
        <path d="M 28.5 41.2 C 58.0 34.0 108.0 23.5 168.0 19.8 C 212.0 18.5 288.0 18.5 336.0 19.5 C 378.0 20.5 404.0 29.5 404.0 44.0 C 404.0 58.5 378.0 67.5 336.0 68.5 C 288.0 69.5 212.0 69.5 168.0 68.2 C 108.0 64.5 58.0 54.0 28.5 46.8 Z"
              fill="#08131b" stroke="#d4e3e6" stroke-width="1.35"/>

        <!-- 上垂直方向舵中心脊线 (X=34..60, Y=42.8..45.2) 与艇尾两侧应急辅推涵道 (X=64..76) -->
        <rect x="34.0" y="42.8" width="26.0" height="2.4" rx="1.0" fill="#0d2230" stroke="#38bdf8" stroke-width="0.85"/>
        <rect x="64.0" y="29.2" width="11.0" height="2.2" rx="0.6" fill="#091620" stroke="#4a6368" stroke-width="0.65"/>
        <rect x="64.0" y="56.6" width="11.0" height="2.2" rx="0.6" fill="#091620" stroke="#4a6368" stroke-width="0.65"/>

        <!-- 上甲板平整走道与两舷 6 道显著的纵向排水孔栅格 (Flooding Slots · X=306..364) -->
        <path d="M 78.0 36.5 L 386.0 35.5 M 78.0 51.5 L 386.0 52.5" fill="none" stroke="#4a6368" stroke-width="0.65"/>
        <g fill="#040a0e" stroke="#38bdf8" stroke-width="0.55">
          <rect x="306.0" y="22.0" width="7.5" height="1.5" rx="0.4"/>
          <rect x="316.0" y="21.8" width="7.5" height="1.5" rx="0.4"/>
          <rect x="326.0" y="21.8" width="7.5" height="1.5" rx="0.4"/>
          <rect x="336.0" y="22.0" width="7.5" height="1.5" rx="0.4"/>
          <rect x="346.0" y="22.5" width="7.5" height="1.5" rx="0.4"/>
          <rect x="356.0" y="23.5" width="7.5" height="1.5" rx="0.4"/>
          <rect x="306.0" y="64.5" width="7.5" height="1.5" rx="0.4"/>
          <rect x="316.0" y="64.7" width="7.5" height="1.5" rx="0.4"/>
          <rect x="326.0" y="64.7" width="7.5" height="1.5" rx="0.4"/>
          <rect x="336.0" y="64.5" width="7.5" height="1.5" rx="0.4"/>
          <rect x="346.0" y="64.0" width="7.5" height="1.5" rx="0.4"/>
          <rect x="356.0" y="63.0" width="7.5" height="1.5" rx="0.4"/>
        </g>
      </g>

      <!-- 3. 双壳体内部 Ø7.2m 耐压壳体与 I~VI 六大水密隔舱俯视 X 光透视 (X=56..354, Y=25.5..62.5) -->
      <g id="top-six-compartments-xray">
        <!-- Ø7.2m 圆柱耐压壳体 + 后部圆锥过渡壳体 (舷间储备浮力高达 32%！) -->
        <polygon points="56.0,38.0 132.0,25.5 354.0,25.5 354.0,62.5 132.0,62.5 56.0,50.0"
                 fill="#061018" fill-opacity="0.76" stroke="#38bdf8" stroke-width="0.95" stroke-dasharray="4.5 2.0"/>

        <!-- 5道水密隔舱横向分界舱壁 (分隔 VI, V, IV, III, II, I 六大隔舱) -->
        <g stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2.2 1.2">
          <line x1="86.0" y1="33.2" x2="86.0" y2="54.8"/>
          <line x1="132.0" y1="25.5" x2="132.0" y2="62.5"/>
          <line x1="184.0" y1="25.5" x2="184.0" y2="62.5"/>
          <line x1="236.0" y1="25.5" x2="236.0" y2="62.5"/>
          <line x1="292.0" y1="25.5" x2="292.0" y2="62.5"/>
        </g>

        <!-- [第 VI 隔舱 · X=56..86] 尾舵机电舱与后救生舱口 -->
        <line x1="28.5" y1="44.0" x2="126.0" y2="44.0" stroke="#eab308" stroke-width="1.15" stroke-dasharray="3.5 1.5"/>
        <circle cx="72.0" cy="44.0" r="2.8" fill="#0b1d28" stroke="#d4e3e6" stroke-width="0.8"/>

        <!-- [第 V 隔舱 · X=86..132] 主推进电机舱：中央 PG-141M (5,500 SHP) 双电枢直流电机 + 两侧 PG-142 经航超静音电机 -->
        <ellipse cx="109.0" cy="44.0" rx="14.0" ry="8.5" fill="#1e0c10" stroke="#ff5a36" stroke-width="0.95"/>
        <circle cx="109.0" cy="44.0" r="4.0" fill="#2c1216" stroke="#eab308" stroke-width="0.8"/>
        <rect x="98.0" y="30.5" width="14.0" height="3.8" rx="0.8" fill="#0d2230" stroke="#38bdf8" stroke-width="0.65"/>
        <rect x="98.0" y="53.7" width="14.0" height="3.8" rx="0.8" fill="#0d2230" stroke="#38bdf8" stroke-width="0.65"/>

        <!-- [第 IV 隔舱 · X=132..184] 柴电动力舱：左右并列 2×2DL-42M 增压柴油发电机组 (2×1,500 kW) -->
        <rect x="139.0" y="29.5" width="37.0" height="11.2" rx="1.4" fill="#180d10" stroke="#eab308" stroke-width="0.85"/>
        <line x1="142.0" y1="35.1" x2="173.0" y2="35.1" stroke="#38bdf8" stroke-width="0.65" stroke-dasharray="2.5 1.2"/>
        <rect x="139.0" y="47.3" width="37.0" height="11.2" rx="1.4" fill="#180d10" stroke="#eab308" stroke-width="0.85"/>
        <line x1="142.0" y1="52.9" x2="173.0" y2="52.9" stroke="#38bdf8" stroke-width="0.65" stroke-dasharray="2.5 1.2"/>

        <!-- [第 III 隔舱 · X=184..236] 生活区与第2组 120块高容量蓄电池组 + 救生对接舱口 -->
        <rect x="188.5" y="29.0" width="43.0" height="12.0" rx="1.0" fill="#081b28" stroke="#38bdf8" stroke-width="0.7"/>
        <rect x="188.5" y="47.0" width="43.0" height="12.0" rx="1.0" fill="#081b28" stroke="#38bdf8" stroke-width="0.7"/>
        <circle cx="204.0" cy="44.0" r="3.4" fill="#0b1d28" stroke="#d4e3e6" stroke-width="0.85"/>
        <circle cx="204.0" cy="44.0" r="1.4" fill="none" stroke="#38bdf8" stroke-width="0.6"/>

        <!-- [第 II 隔舱 · X=236..292] 中央指挥控制室 (Lama-ER 作战系统) 与第1组 120块蓄电池组 -->
        <rect x="240.0" y="28.5" width="48.0" height="8.0" rx="1.0" fill="#081b28" stroke="#38bdf8" stroke-width="0.7"/>
        <rect x="240.0" y="51.5" width="48.0" height="8.0" rx="1.0" fill="#081b28" stroke="#38bdf8" stroke-width="0.7"/>

        <!-- [第 I 隔舱 · X=292..354] 18枚武器自动快速装填架：4×3M-54/14 Kalibr-PL 口径巡航导弹 (#ff5a36) + 14×533mm 鱼雷 (#eab308) -->
        <!-- 左舷装填架：2枚 Kalibr-PL 运载筒 + 4枚 TEST-71ME / UGST 重型鱼雷 -->
        <rect x="296.0" y="28.0" width="25.0" height="2.8" rx="0.8" fill="#281014" stroke="#ff5a36" stroke-width="0.8"/>
        <rect x="323.0" y="28.0" width="26.0" height="2.8" rx="0.8" fill="#281014" stroke="#ff5a36" stroke-width="0.8"/>
        <rect x="296.0" y="32.2" width="25.0" height="2.5" rx="0.7" fill="#182214" stroke="#eab308" stroke-width="0.75"/>
        <rect x="323.0" y="32.2" width="26.0" height="2.5" rx="0.7" fill="#182214" stroke="#eab308" stroke-width="0.75"/>
        <rect x="296.0" y="36.2" width="25.0" height="2.5" rx="0.7" fill="#182214" stroke="#eab308" stroke-width="0.75"/>
        <!-- 右舷装填架：2枚 Kalibr-PL 运载筒 + 4枚 TEST-71ME / UGST 重型鱼雷 -->
        <rect x="296.0" y="57.2" width="25.0" height="2.8" rx="0.8" fill="#281014" stroke="#ff5a36" stroke-width="0.8"/>
        <rect x="323.0" y="57.2" width="26.0" height="2.8" rx="0.8" fill="#281014" stroke="#ff5a36" stroke-width="0.8"/>
        <rect x="296.0" y="53.3" width="25.0" height="2.5" rx="0.7" fill="#182214" stroke="#eab308" stroke-width="0.75"/>
        <rect x="323.0" y="53.3" width="26.0" height="2.5" rx="0.7" fill="#182214" stroke="#eab308" stroke-width="0.75"/>
        <rect x="296.0" y="49.3" width="25.0" height="2.5" rx="0.7" fill="#182214" stroke="#eab308" stroke-width="0.75"/>

        <!-- 前甲板中轴鱼雷/口径巡航导弹斜向装填舱口与前救生对接圆舱口 (X=306..344, Y=44.0) -->
        <rect x="306.0" y="41.4" width="18.0" height="5.2" rx="1.0" fill="#0d2230" stroke="#38bdf8" stroke-width="0.85"/>
        <circle cx="338.0" cy="44.0" r="3.8" fill="#0b1d28" stroke="#d4e3e6" stroke-width="0.9"/>
        <circle cx="338.0" cy="44.0" r="1.6" fill="#132c3a" stroke="#38bdf8" stroke-width="0.7"/>
      </g>

      <!-- 4. 流线型指挥台围壳俯视图 (Sail · X=226..292, Y=37.8..50.2) + 潜望镜/通气管 + 8×9K38 Igla-M 防空导弹 -->
      <g id="top-kilo-sail">
        <path d="M 226.0 40.5 L 282.0 37.8 C 289.5 37.8 292.5 40.5 292.5 44.0 C 292.5 47.5 289.5 50.2 282.0 50.2 L 226.0 47.5 Z"
              fill="#102534" stroke="#d4e3e6" stroke-width="1.2"/>
        <!-- 围壳前部导航桥窗与后部 8×Igla-M / Verba 防空导弹发射舱 -->
        <path d="M 281.0 39.2 C 287.5 39.2 290.2 41.2 290.2 44.0 C 290.2 46.8 287.5 48.8 281.0 48.8" fill="none" stroke="#38bdf8" stroke-width="0.95"/>
        <rect x="234.0" y="40.8" width="11.5" height="6.4" rx="0.8" fill="#1e0c10" stroke="#ff5a36" stroke-width="0.85"/>
        <line x1="239.8" y1="40.8" x2="239.8" y2="47.2" stroke="#eab308" stroke-width="0.6"/>
        <!-- PZNG-8M / PR-14 潜望镜、MRK-50 雷达与 RDP 通气管井口 -->
        <circle cx="279.0" cy="44.0" r="1.5" fill="#091620" stroke="#38bdf8" stroke-width="0.75"/>
        <circle cx="271.5" cy="44.0" r="1.4" fill="#091620" stroke="#eab308" stroke-width="0.75"/>
        <rect x="260.5" y="42.2" width="5.0" height="3.6" rx="0.6" fill="#091620" stroke="#38bdf8" stroke-width="0.75"/>
        <circle cx="249.5" cy="44.0" r="1.9" fill="#261014" stroke="#ff5a36" stroke-width="0.8"/>
      </g>

      <!-- 5. 鲸鱼形钝圆艇首：上排 6×533mm 鱼雷/口径巡航导弹发射管 + 下部 MGK-400EM Rubikon-M 巨型声呐基阵轮廓 (X=354..404) -->
      <g id="top-bow-tubes-and-rubikon">
        <!-- 下颚 MGK-400EM Rubikon-M (Shark Gill) 巨型主被动声呐导流罩与圆柱基阵虚线轮廓 -->
        <path d="M 358.0 23.8 C 350.0 34.0 350.0 54.0 358.0 64.2" fill="none" stroke="#38bdf8" stroke-width="0.95" stroke-dasharray="3 1.5"/>
        <ellipse cx="378.5" cy="44.0" rx="16.5" ry="13.5" fill="#0b2434" fill-opacity="0.45" stroke="#38bdf8" stroke-width="0.95" stroke-dasharray="2.5 1.2"/>

        <!-- 上排 6具 533mm 气动发射管俯视内透视 (左右对称各 3 具 · 其中 2 具装填红色的 3M-54E Kalibr-PL 潜射巡航导弹) -->
        <g stroke-width="0.85">
          <!-- 左舷 3 具 533mm 发射管 -->
          <rect x="354.0" y="29.5" width="44.0" height="2.4" rx="0.5" fill="#182214" stroke="#eab308"/>
          <rect x="354.0" y="33.5" width="46.5" height="2.4" rx="0.5" fill="#281014" stroke="#ff5a36"/>
          <rect x="354.0" y="37.5" width="48.2" height="2.4" rx="0.5" fill="#281014" stroke="#ff5a36"/>
          <!-- 右舷 3 具 533mm 发射管 -->
