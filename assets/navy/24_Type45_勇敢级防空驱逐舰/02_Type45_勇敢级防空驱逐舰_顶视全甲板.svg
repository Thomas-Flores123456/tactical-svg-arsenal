<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" data-asset-id="naval.type45.top" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.p { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1080" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">ROYAL NAVY TYPE 45 DARING-CLASS DDG (D32 HMS DARING) · ORTHOGRAPHIC FULL DECK PLAN</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">45型「勇敢」级区域防空驱逐舰 (D32) · 顶视全甲板与48单元海毒蛇垂发工程图</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9.5">48×SYLVER A50 (6×8 PAAMS) + 24×SEA CEPTOR CAMM · 2×4 HARPOON · SAMPSON + S1850M · 2×PHALANX CIWS · AW101 MERLIN</text>
    <text x="1066" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT (7.19:1)</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 sx=sy=2.320 · X=20..410 长390 / Y=16.9..71.1 宽54.2 = 7.19:1) -->
  <g id="layer-ship-cad">
    <g transform="translate(68.0,82.0) scale(2.320,2.320)">
      <!-- 0. 顶视纵轴中心基准线、21.2m 舰宽标尺与顶部模块标注 (零碰撞净空排布) -->
      <line x1="12.0" y1="44.0" x2="414.0" y2="44.0" stroke="#2c3b40" stroke-width="0.6" stroke-dasharray="6 3"/>
      <!-- 左端 21.2m 舰宽工程标尺 (Y=16.9 .. 71.1) -->
      <line x1="11.5" y1="16.9" x2="11.5" y2="71.1" stroke="#38bdf8" stroke-width="0.65"/>
      <line x1="9.0" y1="16.9" x2="14.0" y2="16.9" stroke="#38bdf8" stroke-width="0.7"/>
      <line x1="9.0" y1="71.1" x2="14.0" y2="71.1" stroke="#38bdf8" stroke-width="0.7"/>
      <text x="8.0" y="44.0" text-anchor="middle" transform="rotate(-90 8.0 44.0)" class="mono" font-size="2.6" fill="#38bdf8">BEAM 21.2M (54.2U)</text>

      <!-- 顶部净空战术分区说明 -->
      <text x="20.0" y="8.5" class="mono" font-size="2.6" fill="#8aa1a7">AFT: AW101 MERLIN FLIGHT DECK &amp; HANGAR</text>
      <text x="154.0" y="8.5" class="mono" font-size="2.6" fill="#38bdf8" font-weight="bold">MID: S1850M + 2×WR-21 + SAMPSON AESA</text>
      <text x="314.0" y="8.5" class="mono" font-size="2.6" fill="#ff5a36" font-weight="bold">FWD: 48×SYLVER A50 + 24×CAMM + 114MM</text>

      <!-- 1. 主船体 7.19:1 真实比例顶视外廓 (X=20.0..410.0, Y=16.9..71.1 · 中心线 Y=44.0) -->
      <path d="M 20.0 23.5 L 58.0 19.2 L 128.0 16.9 L 278.0 16.9 C 326.0 16.9 374.0 26.5 410.0 44.0 C 374.0 61.5 326.0 71.1 278.0 71.1 L 128.0 71.1 L 58.0 68.8 L 20.0 64.5 Z"
            fill="#08131b" stroke="#d4e3e6" stroke-width="1.35"/>
      <!-- 船体隐身内倾折角外缘线与水下双轴螺旋桨/球鼻声呐虚线透视 -->
      <path d="M 23.0 25.5 L 128.0 19.2 L 278.0 19.2 L 368.0 32.0 M 23.0 62.5 L 128.0 68.8 L 278.0 68.8 L 368.0 56.0"
            fill="none" stroke="#4a6368" stroke-width="0.65"/>
      <!-- 水下双轴五叶螺旋桨与首部 MFS-7000 声呐罩虚线透视 -->
      <line x1="48.0" y1="33.5" x2="136.0" y2="36.5" stroke="#eab308" stroke-width="0.7" stroke-dasharray="3 1.5"/>
      <line x1="48.0" y1="54.5" x2="136.0" y2="51.5" stroke="#eab308" stroke-width="0.7" stroke-dasharray="3 1.5"/>
      <circle cx="52.0" cy="33.5" r="3.2" fill="none" stroke="#eab308" stroke-width="0.65" stroke-dasharray="1.5 1"/>
      <circle cx="52.0" cy="54.5" r="3.2" fill="none" stroke="#eab308" stroke-width="0.65" stroke-dasharray="1.5 1"/>
      <ellipse cx="385.5" cy="44.0" rx="9.2" ry="6.2" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 1.2"/>

      <!-- 2. 舰尾直升机起降甲板 (X=20..92, Y=21.5..66.5) 与展开五叶旋翼的 AW101「梅林」HM2 反潜直升机 -->
      <g id="top-flight-deck-merlin">
        <polygon points="22.0,24.2 92.0,20.8 92.0,67.2 22.0,63.8" fill="#0a1720" stroke="#38bdf8" stroke-width="0.9"/>
        <!-- 起降坪白线边框、鱼叉助降网圆环与斜向进近引导线 -->
        <polyline points="25.0,26.5 89.0,23.5 89.0,64.5 25.0,61.5" fill="none" stroke="#d4e3e6" stroke-width="0.85"/>
        <circle cx="58.0" cy="44.0" r="9.5" fill="none" stroke="#d4e3e6" stroke-width="0.8"/>
        <circle cx="58.0" cy="44.0" r="3.2" fill="#07121a" stroke="#eab308" stroke-width="0.7"/>
        <line x1="25.0" y1="44.0" x2="90.0" y2="44.0" stroke="#eab308" stroke-width="0.7" stroke-dasharray="4 2"/>
        <line x1="58.0" y1="44.0" x2="72.0" y2="30.0" stroke="#d4e3e6" stroke-width="0.65"/>
        <line x1="58.0" y1="44.0" x2="72.0" y2="58.0" stroke="#d4e3e6" stroke-width="0.65"/>
        <text x="33.0" y="34.0" text-anchor="middle" class="mono" font-size="4.8" font-weight="bold" fill="#d4e3e6">D32</text>

        <!-- AW101 Merlin HM2 反潜直升机顶视剪影 (展开 5 叶主旋翼 · cx=58.0, cy=44.0) -->
        <g transform="translate(58.0, 44.0)">
          <circle cx="1.5" cy="0" r="9.8" fill="none" stroke="#38bdf8" stroke-width="0.55" stroke-dasharray="2.2 1.6"/>
          <ellipse cx="2.0" cy="0" rx="7.2" ry="2.5" fill="#0e2230" stroke="#d4e3e6" stroke-width="0.85"/>
          <line x1="-10.5" y1="0" x2="8.5" y2="0" stroke="#d4e3e6" stroke-width="0.95"/>
          <line x1="-9.8" y1="-2.8" x2="-9.8" y2="0.5" stroke="#38bdf8" stroke-width="0.75"/>
          <line x1="1.5" y1="0" x2="11.0" y2="0" stroke="#38bdf8" stroke-width="0.8"/>
          <line x1="1.5" y1="0" x2="4.4" y2="-9.2" stroke="#38bdf8" stroke-width="0.8"/>
          <line x1="1.5" y1="0" x2="-6.5" y2="-5.8" stroke="#38bdf8" stroke-width="0.8"/>
          <line x1="1.5" y1="0" x2="-6.5" y2="5.8" stroke="#38bdf8" stroke-width="0.8"/>
          <line x1="1.5" y1="0" x2="4.4" y2="9.2" stroke="#38bdf8" stroke-width="0.8"/>
          <circle cx="1.5" cy="0" r="1.2" fill="#eab308"/>
        </g>
      </g>

      <!-- 3. 一体化隐身上层建筑：机库段、30mm DS30B 速射炮、后主桅 S1850M 雷达、双 WR-21 烟囱与两舷 Phalanx 密集阵 (X=92..250) -->
      <g id="top-superstructure-s1850m-funnels">
        <!-- 内倾隐身长上层建筑主甲板轮廓 (X=92..298, Y=21.2..66.8) -->
        <polygon points="92.0,22.5 148.0,20.5 252.0,20.5 298.0,25.5 298.0,62.5 252.0,67.5 148.0,67.5 92.0,65.5"
                 fill="#0d1e2a" stroke="#d4e3e6" stroke-width="1.15"/>
        <!-- 机库顶盖折角棱线与两侧 Pacific 24 快艇舱壁龛 (X=94..150) -->
        <rect x="96.0" y="27.5" width="52.0" height="33.0" fill="#102432" stroke="#4a6368" stroke-width="0.75"/>
        <rect x="108.0" y="21.2" width="26.0" height="4.8" fill="#07121a" stroke="#38bdf8" stroke-width="0.7"/>
        <rect x="108.0" y="62.0" width="26.0" height="4.8" fill="#07121a" stroke="#38bdf8" stroke-width="0.7"/>

        <!-- 左右两舷 30mm DS30B 自动化速射炮平台 (X=142.0, Y=23.5 &amp; 64.5) -->
        <circle cx="142.0" cy="24.2" r="2.6" fill="#091620" stroke="#d4e3e6" stroke-width="0.75"/>
        <line x1="142.0" y1="24.2" x2="146.5" y2="21.0" stroke="#eab308" stroke-width="0.8"/>
        <circle cx="142.0" cy="63.8" r="2.6" fill="#091620" stroke="#d4e3e6" stroke-width="0.75"/>
        <line x1="142.0" y1="63.8" x2="146.5" y2="67.0" stroke="#eab308" stroke-width="0.8"/>

        <!-- [核心特征 2] 后部隐身塔桅与顶置大型黑色长方形 S1850M 远程三坐标雷达板 (X=154..180, cy=44.0) -->
        <polygon points="154.0,32.5 180.0,32.5 177.0,55.5 157.0,55.5" fill="#132c3d" stroke="#d4e3e6" stroke-width="1.05"/>
        <!-- S1850M 旋转扫描轨迹圆与黑色长方形平板天线 -->
        <circle cx="167.0" cy="44.0" r="11.2" fill="none" stroke="#38bdf8" stroke-width="0.55" stroke-dasharray="2.2 1.5"/>
        <g transform="translate(167.0, 44.0) rotate(-18)">
          <rect x="-3.2" y="-10.2" width="6.4" height="20.4" rx="0.8" fill="#050c11" stroke="#38bdf8" stroke-width="1.15"/>
          <line x1="0" y1="-9.8" x2="0" y2="9.8" stroke="#38bdf8" stroke-width="0.6"/>
          <line x1="-3.0" y1="-5.0" x2="3.0" y2="-5.0" stroke="#38bdf8" stroke-width="0.5"/>
          <line x1="-3.0" y1="0" x2="3.0" y2="0" stroke="#38bdf8" stroke-width="0.5"/>
          <line x1="-3.0" y1="5.0" x2="3.0" y2="5.0" stroke="#38bdf8" stroke-width="0.5"/>
        </g>
        <!-- 左右 SCOT 球形卫通天线罩 -->
        <circle cx="149.0" cy="34.5" r="2.8" fill="#091620" stroke="#d4e3e6" stroke-width="0.8"/>
        <circle cx="149.0" cy="53.5" r="2.8" fill="#091620" stroke="#d4e3e6" stroke-width="0.8"/>

        <!-- 后 WR-21 燃气轮机隐身排烟囱俯视 (X=188..208, Y=36.5..51.5) -->
        <polygon points="188.0,36.5 208.0,37.5 208.0,50.5 188.0,51.5" fill="#0a1822" stroke="#d4e3e6" stroke-width="0.95"/>
        <rect x="192.5" y="39.5" width="11.0" height="9.0" fill="#180b0e" stroke="#ff5a36" stroke-width="0.8"/>
        <line x1="196.2" y1="39.5" x2="196.2" y2="48.5" stroke="#ff5a36" stroke-width="0.55"/>
        <line x1="199.8" y1="39.5" x2="199.8" y2="48.5" stroke="#ff5a36" stroke-width="0.55"/>

        <!-- 两舷中段外飘平台 2×20mm Phalanx Block 1B 密集阵近防炮 (X=208..222, Y=17.5..24.5 &amp; 63.5..70.5) -->
        <rect x="208.5" y="17.8" width="13.0" height="6.2" fill="#122938" stroke="#38bdf8" stroke-width="0.85"/>
        <circle cx="215.0" cy="20.8" r="2.3" fill="#d4e3e6" stroke="#eab308" stroke-width="0.8"/>
        <line x1="215.0" y1="20.8" x2="219.5" y2="16.5" stroke="#eab308" stroke-width="0.9"/>
        <rect x="208.5" y="64.0" width="13.0" height="6.2" fill="#122938" stroke="#38bdf8" stroke-width="0.85"/>
        <circle cx="215.0" cy="67.2" r="2.3" fill="#d4e3e6" stroke="#eab308" stroke-width="0.8"/>
        <line x1="215.0" y1="67.2" x2="219.5" y2="71.5" stroke="#eab308" stroke-width="0.9"/>

        <!-- 前 WR-21 燃气轮机隐身排烟囱俯视 (X=224..245, Y=36.0..52.0) -->
        <polygon points="224.0,36.0 245.5,37.2 245.5,50.8 224.0,52.0" fill="#0a1822" stroke="#d4e3e6" stroke-width="0.95"/>
        <rect x="228.5" y="39.2" width="12.0" height="9.6" fill="#180b0e" stroke="#ff5a36" stroke-width="0.8"/>
        <line x1="232.5" y1="39.2" x2="232.5" y2="48.8" stroke="#ff5a36" stroke-width="0.55"/>
        <line x1="236.5" y1="39.2" x2="236.5" y2="48.8" stroke="#ff5a36" stroke-width="0.55"/>
      </g>

      <!-- 4. [核心特征 1] 封闭式隐身舰桥 + 金字塔前主桅 + 顶置球形带刺 SAMPSON 双面有源相控阵雷达球俯视图 (X=250..298) -->
      <g id="top-bridge-and-sampson-foremast">
        <!-- 舰桥前部多面体折角与防风观察窗带 -->
        <polygon points="252.0,23.5 288.0,26.5 296.5,34.0 296.5,54.0 288.0,61.5 252.0,64.5"
                 fill="#102534" stroke="#d4e3e6" stroke-width="1.1"/>
        <polyline points="286.5,28.5 294.2,35.2 294.2,52.8 286.5,59.5" fill="none" stroke="#38bdf8" stroke-width="1.05"/>

        <!-- 高耸金字塔前主桅俯视四棱锥台斜面 (Integrated Pyramidal Foremast · X=256..288, Y=30.5..57.5) -->
        <polygon points="256.0,33.5 272.0,29.5 288.0,33.5 288.0,54.5 272.0,58.5 256.0,54.5"
                 fill="#142f42" stroke="#d4e3e6" stroke-width="1.15"/>
        <!-- 金字塔四条斜棱线向中心球顶汇聚 -->
        <line x1="256.0" y1="33.5" x2="272.0" y2="44.0" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="288.0" y1="33.5" x2="272.0" y2="44.0" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="288.0" y1="54.5" x2="272.0" y2="44.0" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="256.0" y1="54.5" x2="272.0" y2="44.0" stroke="#38bdf8" stroke-width="0.75"/>

        <!-- 顶置球形带刺 SAMPSON 双面旋转有源相控阵雷达球 (cx=272.0, cy=44.0, r=6.2) -->
        <circle cx="272.0" cy="44.0" r="10.2" fill="none" stroke="#38bdf8" stroke-width="0.55" stroke-dasharray="2 1.4"/>
        <circle cx="272.0" cy="44.0" r="6.2" fill="#0b2232" stroke="#38bdf8" stroke-width="1.25"/>
        <!-- 雷达球内部背靠背双面 S波段 AESA 相控阵天线阵面俯视透视 -->
        <g transform="translate(272.0, 44.0) rotate(28)">
          <polygon points="-1.8,-4.8 1.8,-4.8 2.4,0 1.8,4.8 -1.8,4.8 -2.4,0" fill="#1e0f14" stroke="#eab308" stroke-width="0.85"/>
          <line x1="0" y1="-5.0" x2="0" y2="5.0" stroke="#ff5a36" stroke-width="0.9"/>
        </g>
        <!-- 雷达球四周放射状防雷静电尖刺 (Spiked Radome Diverters) -->
        <g stroke="#eab308" stroke-width="0.75">
          <line x1="272.0" y1="37.8" x2="272.0" y2="35.6"/>
          <line x1="272.0" y1="50.2" x2="272.0" y2="52.4"/>
          <line x1="265.8" y1="44.0" x2="263.6" y2="44.0"/>
          <line x1="278.2" y1="44.0" x2="280.4" y2="44.0"/>
          <line x1="267.6" y1="39.6" x2="266.0" y2="38.0"/>
          <line x1="276.4" y1="39.6" x2="278.0" y2="38.0"/>
          <line x1="267.6" y1="48.4" x2="266.0" y2="50.0"/>
          <line x1="276.4" y1="48.4" x2="278.0" y2="50.0"/>
        </g>
        <circle cx="272.0" cy="44.0" r="1.2" fill="#eab308"/>
      </g>

      <!-- 5. 前甲板武器区：2×4 鱼叉反舰导弹倾斜架 + 48单元(6×8) Sylver A50 海毒蛇垂发矩阵 + 24单元 Sea Ceptor CAMM + 114mm 隐身主炮 (X=298..406) -->
      <g id="top-foredeck-vls-and-gun">
        <!-- 舰桥前左右交叉布置的 2座四联装 RGM-84 Harpoon 鱼叉反舰导弹发射箱 (X=300..313, Y=28.5..59.5) -->
        <g transform="translate(306.5, 34.5) rotate(16)">
          <rect x="-5.5" y="-2.8" width="11.0" height="5.6" fill="#1e0d12" stroke="#ff5a36" stroke-width="0.85"/>
          <line x1="-5.2" y1="-1.0" x2="5.2" y2="-1.0" stroke="#eab308" stroke-width="0.5"/>
          <line x1="-5.2" y1="1.0" x2="5.2" y2="1.0" stroke="#eab308" stroke-width="0.5"/>
        </g>
        <g transform="translate(306.5, 53.5) rotate(-16)">
          <rect x="-5.5" y="-2.8" width="11.0" height="5.6" fill="#1e0d12" stroke="#ff5a36" stroke-width="0.85"/>
          <line x1="-5.2" y1="-1.0" x2="5.2" y2="-1.0" stroke="#eab308" stroke-width="0.5"/>
          <line x1="-5.2" y1="1.0" x2="5.2" y2="1.0" stroke="#eab308" stroke-width="0.5"/>
        </g>

        <!-- 高起式前甲板导弹井围井平台 (X=315..354, Y=28.0..60.0) -->
        <polygon points="315.0,28.0 351.0,30.5 354.0,33.5 354.0,54.5 351.0,57.5 315.0,60.0"
                 fill="#0d202e" stroke="#38bdf8" stroke-width="1.05"/>

        <!-- 中央 48单元 (6×8) Sylver A50「海毒蛇」(Sea Viper / PAAMS) 垂直发射系统矩阵 (X=320.0..348.0, Y=35.0..53.0) -->
        <rect x="320.0" y="35.0" width="28.0" height="18.0" fill="#061118" stroke="#38bdf8" stroke-width="0.95"/>
        <g stroke="#4a6368" stroke-width="0.45">
          <!-- 8列分格线 (每列宽 3.5) -->
          <line x1="323.5" y1="35.0" x2="323.5" y2="53.0"/>
          <line x1="327.0" y1="35.0" x2="327.0" y2="53.0"/>
          <line x1="330.5" y1="35.0" x2="330.5" y2="53.0"/>
          <line x1="334.0" y1="35.0" x2="334.0" y2="53.0"/>
          <line x1="337.5" y1="35.0" x2="337.5" y2="53.0"/>
          <line x1="341.0" y1="35.0" x2="341.0" y2="53.0"/>
          <line x1="344.5" y1="35.0" x2="344.5" y2="53.0"/>
          <!-- 6行分格线 (每行高 3.0) -->
          <line x1="320.0" y1="38.0" x2="348.0" y2="38.0"/>
          <line x1="320.0" y1="41.0" x2="348.0" y2="41.0"/>
          <line x1="320.0" y1="44.0" x2="348.0" y2="44.0"/>
          <line x1="320.0" y1="47.0" x2="348.0" y2="47.0"/>
          <line x1="320.0" y1="50.0" x2="348.0" y2="50.0"/>
        </g>
        <!-- 高亮开启/待发的 Aster-30 与 Aster-15 发射单元 -->
        <rect x="320.5" y="35.5" width="2.5" height="2.0" fill="#ff5a36"/>
        <rect x="324.0" y="35.5" width="2.5" height="2.0" fill="#ff5a36"/>
        <rect x="334.5" y="41.5" width="2.5" height="2.0" fill="#38bdf8"/>
        <rect x="341.5" y="47.5" width="2.5" height="2.0" fill="#eab308"/>
        <rect x="345.0" y="50.5" width="2.5" height="2.0" fill="#ff5a36"/>

        <!-- 两侧并列加装的 24单元 (2×12) Sea Ceptor (CAMM)「海受体」防空导弹发射井组 (Port Y=30.2..33.6 / Stbd Y=54.4..57.8) -->
        <rect x="321.0" y="30.2" width="26.0" height="3.2" fill="#091a26" stroke="#eab308" stroke-width="0.75"/>
        <rect x="321.0" y="54.6" width="26.0" height="3.2" fill="#091a26" stroke="#eab308" stroke-width="0.75"/>
        <line x1="321.0" y1="31.8" x2="347.0" y2="31.8" stroke="#eab308" stroke-width="0.5" stroke-dasharray="1.6 1.0"/>
        <line x1="321.0" y1="56.2" x2="347.0" y2="56.2" stroke="#eab308" stroke-width="0.5" stroke-dasharray="1.6 1.0"/>

        <!-- 舰首 114mm (4.5 inch) BAE Mk 8 Mod 1 折角隐身主炮塔 (X=358..391, cy=44.0) -->
        <circle cx="367.0" cy="44.0" r="6.8" fill="#0b1b26" stroke="#4a6368" stroke-width="0.7" stroke-dasharray="2 1.2"/>
        <!-- Kryten 多面体低雷达反射隐身炮塔外壳 -->
        <polygon points="359.5,39.5 365.5,37.8 372.5,39.2 375.0,42.0 375.0,46.0 372.5,48.8 365.5,50.2 359.5,48.5"
                 fill="#142d3e" stroke="#d4e3e6" stroke-width="1.15"/>
        <polyline points="361.0,40.5 368.5,41.5 368.5,46.5 361.0,47.5" fill="none" stroke="#38bdf8" stroke-width="0.65"/>
        <!-- 55倍径 114mm 舰炮炮管 (朝向舰首 +X) -->
        <rect x="375.0" y="43.2" width="16.5" height="1.6" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.55"/>
        <circle cx="391.5" cy="44.0" r="0.8" fill="#eab308"/>

        <!-- 舰首封闭式防浪板与系泊导缆孔 -->
        <polyline points="376.0,33.5 385.0,38.5 396.0,44.0 385.0,49.5 376.0,54.5" fill="none" stroke="#38bdf8" stroke-width="0.75"/>
        <text x="394.0" y="34.5" class="mono" font-size="3.8" font-weight="bold" fill="#d4e3e6">D32</text>
      </g>

      <!-- 6. 底部全舰武器与动力配置总结栏 (零碰撞净空排布) -->
      <text x="20.0" y="81.5" class="mono" font-size="2.6" fill="#38bdf8">PAAMS (SEA VIPER): SAMPSON DUAL-FACE MFR + S1850M LRR + 48×SYLVER A50 (ASTER-15/30) + 24×CAMM</text>
      <text x="410.0" y="81.5" text-anchor="end" class="mono" font-size="2.6" fill="#eab308">▲ HMS DARING (D32) · 152.4M×21.2M</text>
    </g>
  </g>
