<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" width="1120" height="320" data-asset-id="naval.typhoon.side.standard" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1120" height="320" fill="#080a0b"/>
    <rect x="20" y="20" width="1080" height="280" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1084 20 H 1100 V 36 M 20 284 V 300 H 36 M 1084 300 H 1100 V 284" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1100" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="274" x2="1100" y2="274" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">PROJECT 941 AKULA / TYPHOON SSBN · STARBOARD ELEVATION [STANDARD HULL]</text>
    <text x="1086" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">941型「鲨鱼/台风」级重型战略核潜艇 · 侧视立面标准外廓图 (48,000T)</text>
    <text x="34" y="291" class="p mono" fill="#8aa1a7" font-size="9.5">LOA: 172.8M · BEAM: 23.3M · 20×R-39 (SS-N-20) SLBM TURTLEBACK · STREAMLINED SAIL WITH 7 MASTS · SHROUDED PROPS · REF: F89-UPPER</text>
    <text x="1086" y="291" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (无损原生算子输出) -->
  <g id="layer-ship-cad">
    <g transform="translate(56.0,79.1) scale(2.400,2.044)">
      <!-- 尾部上下巨型梯形垂直尾翼 + 顶部拖曳线列声呐导流管荚舱 (舰政标准规范 左端) -->
      <polygon points="14,48 16,18 34,18 40,46" fill="#0a1822" stroke="#d4e3e6" stroke-width="1.25"/>
      <ellipse cx="26" cy="17.5" rx="3.5" ry="1.3" fill="#0d222e" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="31" y1="22" x2="31" y2="45" stroke="#4a6368" stroke-width="0.8"/>
      <!-- 下垂直尾舵与环形导管螺旋桨护罩 (Shrouded Propeller Duct) -->
      <polygon points="18,62 36,64 34,82 18,79" fill="#0a1822" stroke="#d4e3e6" stroke-width="1.2"/>
      <polygon points="8,49 20,47 20,65 8,63" fill="#0d222e" stroke="#38bdf8" stroke-width="1.2"/>
      <!-- 外露螺旋桨尖与水平尾翼轴线 -->
      <path d="M 4 52 L 8 54 L 4 56 L 8 58 L 4 60" fill="none" stroke="#ff5a36" stroke-width="1"/>
      <ellipse cx="28" cy="56" rx="20" ry="1.8" fill="#09151e" stroke="#38bdf8" stroke-width="0.9"/>

      <!-- 主艇体：后部流线收缩尾锥 + 前置导弹平直龟背 + 浑圆鲸型艇艏 (舰政标准规范 外廓) -->
      <path d="M 18 50 L 85 40 L 210 39.8 L 382 40 C 406 40 416 48 416 56 C 416 66 402 73 376 73 L 105 73 C 68 73 38 66 18 61 Z"
            fill="#08141c" stroke="#d4e3e6" stroke-width="1.35"/>

      <!-- 艇艏下半部 MGK-500「鲨鱼鳃」巨型主被动声呐导流罩分界线与前水平舵槽 (舰政标准规范 右端) -->
      <path d="M 392 59 L 415.5 59 M 392 59 Q 390 66 396 71.5" fill="none" stroke="#38bdf8" stroke-width="0.9"/>
      <rect x="366" y="45" width="18" height="3.2" rx="1" fill="#050d12" stroke="#38bdf8" stroke-width="0.85"/>
      <rect x="368" y="62" width="15" height="6" fill="none" stroke="#4a6368" stroke-width="0.7" stroke-dasharray="2 1.5"/>
      <rect x="352" y="59" width="6" height="5" fill="none" stroke="#d4e3e6" stroke-width="0.7"/>

      <!-- 前置导弹龟背10对舱盖凸缘 + 艇体中线水线与侧向声呐护套 (Flank Array Fairing) -->
      <rect x="216" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/><rect x="226.2" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/><rect x="236.4" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/><rect x="246.6" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/><rect x="256.8" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/><rect x="267" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/><rect x="277.2" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/><rect x="287.4" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/><rect x="297.6" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/><rect x="307.8" y="38.2" width="7.5" height="1.6" fill="#0d222e" stroke="#38bdf8" stroke-width="0.65"/>
      <line x1="42" y1="48.5" x2="412" y2="48.5" stroke="#4a6368" stroke-width="0.75"/>
      <path d="M 134 59 L 298 59 C 304 59 304 62 298 62 L 134 62 C 128 62 128 59 134 59 Z"
            fill="#0b1b26" stroke="#38bdf8" stroke-width="0.85"/>
      <!-- 尾部侧向稳定鳍 -->
      <path d="M 74 62 L 96 67 L 94 69 L 72 64 Z" fill="#0d222e" stroke="#d4e3e6" stroke-width="0.8"/>
      <rect x="228" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="232.2" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="236.4" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="240.6" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="244.8" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="249" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="253.2" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="257.4" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="261.6" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="265.8" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="270" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="274.2" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="278.4" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="282.6" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="286.8" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="291" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="295.2" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="299.4" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="303.6" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="307.8" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="312" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="316.2" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="320.4" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="324.6" y="53.5" width="2.4" height="1.8" fill="none" stroke="#38bdf8" stroke-width="0.6"/><rect x="132" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="135.6" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="139.2" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="142.8" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="146.4" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="150" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="153.6" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="157.2" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="160.8" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="164.4" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="168" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="171.6" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="175.2" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><rect x="178.8" y="50" width="2.2" height="1.6" fill="none" stroke="#d4e3e6" stroke-width="0.55"/><line x1="108" y1="70.5" x2="126" y2="70.5" stroke="#4a6368" stroke-width="1.3" stroke-dasharray="2 1.5"/><line x1="138" y1="70.5" x2="156" y2="70.5" stroke="#4a6368" stroke-width="1.3" stroke-dasharray="2 1.5"/><line x1="168" y1="70.5" x2="186" y2="70.5" stroke="#4a6368" stroke-width="1.3" stroke-dasharray="2 1.5"/><line x1="198" y1="70.5" x2="216" y2="70.5" stroke="#4a6368" stroke-width="1.3" stroke-dasharray="2 1.5"/><line x1="282" y1="70.5" x2="300" y2="70.5" stroke="#4a6368" stroke-width="1.3" stroke-dasharray="2 1.5"/><line x1="346" y1="70.5" x2="364" y2="70.5" stroke="#4a6368" stroke-width="1.3" stroke-dasharray="2 1.5"/>

      

      <!-- 中后部标志性流线型大圆角围壳 (Sail · X=128..212 · 1:1 还原前缓坡+后长裙边+顶部7根潜望镜/雷达桅杆) -->
      <path d="M 128 40 C 138 33 146 31 154 31 L 204 31 C 209 31 211 35 212 40 Z"
            fill="#0b1a24" stroke="#d4e3e6" stroke-width="1.2"/>
      <path d="M 152 31 L 154 18 C 154 16 156 15 160 15 L 198 15 C 202 15 203 16 204 31 Z"
            fill="#0d202c" stroke="#38bdf8" stroke-width="1.25"/>
      <!-- 围壳观察窗、垂直登艇爬梯刻度与逃生舱轮廓 -->
      <rect x="174" y="21" width="5" height="3.5" rx="1" fill="#061016" stroke="#d4e3e6" stroke-width="0.7"/>
      <line x1="194" y1="16" x2="194" y2="39" stroke="#d4e3e6" stroke-width="1.8" stroke-dasharray="1.2 1.8"/>
      <line x1="378" y1="41" x2="378" y2="54" stroke="#d4e3e6" stroke-width="1.8" stroke-dasharray="1.2 1.8"/>
      <!-- 围壳顶部7根潜望镜、雷达与「白杨」卫通升降桅杆群 (舰政标准规范 围壳顶) -->
      <g stroke="#d4e3e6" stroke-width="1">
        <line x1="159" y1="15" x2="159" y2="3"/><line x1="164" y1="15" x2="164" y2="1"/>
        <polygon points="162.5,5 165.5,5 164,1" fill="#38bdf8"/>
        <line x1="170" y1="15" x2="170" y2="0"/><rect x="168" y="3" width="4" height="3" fill="none" stroke="#38bdf8"/>
        <line x1="175" y1="15" x2="175" y2="-2"/><circle cx="175" cy="2" r="2.2" fill="none" stroke="#38bdf8"/>
        <line x1="181" y1="15" x2="181" y2="2"/>
        <line x1="189" y1="15" x2="189" y2="4"/><line x1="197" y1="15" x2="197" y2="6"/>
      </g>
    </g>
  </g>
</svg>
