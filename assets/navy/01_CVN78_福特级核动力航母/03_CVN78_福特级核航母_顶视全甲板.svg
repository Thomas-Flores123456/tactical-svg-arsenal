<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" data-asset-id="naval.cvn78.top.deck" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1080" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">USS GERALD R. FORD (CVN-78) · ASYMMETRIC FLIGHT DECK PLAN VIEW</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">福特级核动力航母 · 顶视非对称外飘飞行甲板与满编舰载机群</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9.5">4×EMALS CATAPULTS (C1–C4) · 3×DECK-EDGE ELEVATORS · 3×ARRESTING WIRES · E-2D + F-35C/F-18E AIR WING · REF: F80-LOWER / F82</text>
    <text x="1066" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (无损原生算子输出) -->
  <g id="layer-ship-cad">
    <g transform="translate(56.0,71.4) scale(2.744,2.414)">
      <!-- 福特级标志性非对称多边形外飘飞行甲板外轮廓 (严格还原 ARCH-STD下 / ARCH-STD右 折角比例) -->
      <polygon points="10,24 88,16 218,12 246,12 276,34 352,36 352,68 272,76 244,88 18,88 10,74"
               fill="#081218" stroke="#d4e3e6" stroke-width="1.4"/>
      <!-- 船体底层水线虚线轮廓 -->
      <path d="M 22 34 L 348 40 Q 358 52 348 64 L 22 70 Z" fill="none" stroke="#4a6368" stroke-width="0.7" stroke-dasharray="5 3"/>

      <!-- 斜角降落甲板跑道边界白线、黄白中心线与 3 道拦阻索 (Arresting Wires) -->
      <line x1="14" y1="62" x2="256" y2="24" stroke="#d4e3e6" stroke-width="1.5"/>
      <line x1="12" y1="40" x2="238" y2="14" stroke="#d4e3e6" stroke-width="1.3"/>
      <line x1="14" y1="51" x2="248" y2="19" stroke="#eab308" stroke-width="1.2" stroke-dasharray="8 4"/>
      <!-- 舰尾 3 道拦阻索 -->
      <line x1="36" y1="37" x2="40" y2="59" stroke="#38bdf8" stroke-width="0.9"/>
      <line x1="52" y1="35" x2="56" y2="57" stroke="#38bdf8" stroke-width="0.9"/>
      <line x1="68" y1="33" x2="72" y2="55" stroke="#38bdf8" stroke-width="0.9"/>

      <!-- 4 条 EMALS 电磁弹射轨道 (C1/C2 舰艏双平行长轨 + C3/C4 斜角甲板双斜轨) -->
      <line x1="215" y1="43" x2="346" y2="43" stroke="#38bdf8" stroke-width="1.3"/>
      <line x1="215" y1="57" x2="346" y2="55" stroke="#38bdf8" stroke-width="1.3"/>
      <line x1="132" y1="22" x2="244" y2="22" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="142" y1="31" x2="254" y2="28" stroke="#38bdf8" stroke-width="1.2"/>
      <!-- 偏流板 (Jet Blast Deflectors) -->
      <rect x="210" y="40" width="4" height="7" fill="#152c38" stroke="#38bdf8" stroke-width="0.8"/>
      <rect x="210" y="53" width="4" height="7" fill="#152c38" stroke="#38bdf8" stroke-width="0.8"/>

      <!-- 3 座黄色边框舷侧巨型飞机升降机 (舰政标准规范 / ARCH-STD右 黄框位置：左舷后1 + 右舷前2) -->
      <rect x="98" y="16" width="14" height="20" fill="#0c1b22" stroke="#eab308" stroke-width="1.1"/>
      <rect x="132" y="72" width="18" height="15" fill="#0c1b22" stroke="#eab308" stroke-width="1.1"/>
      <rect x="216" y="68" width="18" height="16" fill="#0c1b22" stroke="#eab308" stroke-width="1.1"/>

      <!-- 右舷后置紧凑型双波段舰岛俯视图 (带双球形卫通天线罩与右后侧双圆雷达台) -->
      <g transform="translate(64, 72)">
        <rect x="0" y="0" width="38" height="16" fill="#102430" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="10" cy="8" r="4.2" fill="#09151c" stroke="#d4e3e6" stroke-width="0.9"/>
        <circle cx="20" cy="8" r="4.2" fill="#09151c" stroke="#d4e3e6" stroke-width="0.9"/>
        <circle cx="31" cy="6" r="5" fill="#0d1e28" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="29" cy="14" r="3.5" fill="#09151c" stroke="#d4e3e6" stroke-width="0.8"/>
      </g>

      <!-- 舰艏巨型双线舷号 78 (舰政标准规范 右端与 ARCH-STD右 顶端) -->
      <text x="336" y="56" text-anchor="middle" class="p mono" fill="#d4e3e6" font-size="15" font-weight="bold" letter-spacing="1">78</text>

      <!-- 满载甲板机群：舰艏弹射位 E-2D 鹰眼预警机 + 左舷3架旋翼直升机 + 斜列舰载战斗机群 -->
