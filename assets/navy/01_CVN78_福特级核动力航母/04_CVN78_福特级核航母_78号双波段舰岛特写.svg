<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" data-asset-id="naval.cvn78.island.detail" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="640" height="560" fill="#080a0b"/>
    <rect x="20" y="20" width="600" height="520" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 604 20 H 620 V 36 M 20 524 V 540 H 36 M 604 540 H 620 V 524" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="620" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="514" x2="620" y2="514" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">CVN-78 COMPACT DUAL-BAND RADAR (DBR) ISLAND · ISOMETRIC WIREFRAME</text>
    <text x="606" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">福特级 78 号紧凑型双波段相控阵舰岛 · 总师级立体线框特写</text>
    <text x="34" y="531" class="p mono" fill="#8aa1a7" font-size="9.5">AN/SPY-3 (X-BAND) + AN/SPY-4 (S-BAND) · 4-TIER CANTILEVER BRIDGE · 3-TIER INTEGRATED MAST &amp; TACAN · REF: F81</text>
    <text x="606" y="531" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (无损原生算子输出) -->
  <g id="layer-ship-cad">
    <g transform="translate(136.0,68.0) scale(1.45)">
      <!-- 舰岛底部甲板基座与右下方白车/起重臂细节 (舰政标准规范 底部) -->
      <path d="M 10 250 L 210 272 L 245 258 L 45 236 Z" fill="#071015" stroke="#4a6368" stroke-width="1"/>
      <!-- 舰岛主塔身：多面体内倾切角隐身装甲壳体 -->
      <polygon points="42,244 48,118 138,112 152,258" fill="#0b1820" stroke="#d4e3e6" stroke-width="1.4"/>
      <polygon points="138,112 192,134 202,246 152,258" fill="#08131a" stroke="#d4e3e6" stroke-width="1.3"/>

      <!-- 左侧标志性 4 层悬挑式全向落地窗航海/航空指挥舰桥 (舰政标准规范 左中四层外飘窗) -->
      <g fill="#0d222e" stroke="#38bdf8" stroke-width="1.1">
        <polygon points="18,128 68,124 88,132 88,142 66,144 18,138"/>
        <polygon points="20,146 70,142 90,150 90,160 68,162 20,156"/>
        <polygon points="22,164 72,160 92,168 92,178 70,180 22,174"/>
        <polygon points="26,182 74,178 94,186 94,196 72,198 26,192"/>
      </g>
      <!-- 舰桥密集分格防弹观察窗线 -->
      <line x1="34" y1="126" x2="34" y2="194" stroke="#d4e3e6" stroke-width="0.7"/>
      <line x1="50" y1="125" x2="50" y2="195" stroke="#d4e3e6" stroke-width="0.7"/>

      <!-- 正面切角墙体：上小 (AN/SPY-3 X波段) + 下大 (AN/SPY-4 S波段) 双正方形相控阵盾面 (舰政标准规范 中央) -->
      <rect x="112" y="124" width="20" height="24" fill="#112a38" stroke="#38bdf8" stroke-width="1.3"/>
      <rect x="115" y="127" width="14" height="18" fill="none" stroke="#d4e3e6" stroke-width="0.6" stroke-dasharray="2 2"/>
      <rect x="102" y="166" width="36" height="38" fill="#112a38" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="106" y="170" width="28" height="30" fill="none" stroke="#d4e3e6" stroke-width="0.7" stroke-dasharray="3 2"/>
      <!-- 右侧面副相控阵盾面与多层防风外廊平台 -->
      <polygon points="158,138 182,148 180,178 156,168" fill="#102532" stroke="#38bdf8" stroke-width="1.1"/>
      <line x1="146" y1="192" x2="198" y2="204" stroke="#4a6368" stroke-width="1.2"/>
      <line x1="148" y1="216" x2="200" y2="228" stroke="#4a6368" stroke-width="1.2"/>

      <!-- 舰岛左下角醒目巨型双线舷号 78 (舰政标准规范 左下巨型白字黑边 78) -->
      <text x="52" y="232" class="p mono" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.8" font-size="34" font-weight="bold">78</text>

      <!-- 舰岛顶层平台：双座锥柱基座球形卫通天线罩 (Radomes) + 左前小卫通球 (舰政标准规范 舰桥顶) -->
      <circle cx="32" cy="112" r="9" fill="#0c1c24" stroke="#d4e3e6" stroke-width="1"/>
      <path d="M 82 114 L 86 92 L 106 92 L 110 114 Z" fill="#0a161d" stroke="#4a6368"/>
      <circle cx="96" cy="86" r="13" fill="#0d202a" stroke="#d4e3e6" stroke-width="1.1"/>
      <path d="M 122 116 L 126 96 L 148 96 L 152 116 Z" fill="#0a161d" stroke="#4a6368"/>
      <circle cx="137" cy="90" r="14" fill="#0d202a" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="204" cy="196" r="10" fill="#0d202a" stroke="#d4e3e6" stroke-width="1"/>

      <!-- 顶部三层横桁阶梯式综合射频/电子战主桅杆 + 顶球罩 (舰政标准规范 上半部) -->
      <polygon points="106,112 110,24 124,24 128,112" fill="#0c1a22" stroke="#d4e3e6" stroke-width="1.3"/>
      <!-- 第一层宽横桁 (带左右斜撑杆与战术旗绳) -->
      <polygon points="44,78 188,68 184,76 48,86" fill="#0f2430" stroke="#38bdf8" stroke-width="1.2"/>
      <line x1="88" y1="82" x2="108" y2="98" stroke="#d4e3e6" stroke-width="1"/>
      <line x1="152" y1="72" x2="126" y2="96" stroke="#d4e3e6" stroke-width="1"/>
      <!-- 第二层中横桁与第三层顶横桁 + 顶部球形TACAN天线罩 -->
      <polygon points="58,36 182,36 176,44 64,44" fill="#0f2430" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="86" cy="28" r="6" fill="#0d202a" stroke="#d4e3e6" stroke-width="1"/>
      <circle cx="117" cy="14" r="14" fill="#0f2532" stroke="#38bdf8" stroke-width="1.4"/>
      <line x1="142" y1="36" x2="142" y2="2" stroke="#d4e3e6" stroke-width="1.2"/>
      <line x1="134" y1="6" x2="150" y2="6" stroke="#38bdf8" stroke-width="1"/>
    </g>
  </g>
</svg>
