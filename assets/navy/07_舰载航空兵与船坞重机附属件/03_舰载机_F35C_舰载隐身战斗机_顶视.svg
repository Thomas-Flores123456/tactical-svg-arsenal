<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" data-asset-id="naval.airwing.f35c" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="680" height="300" fill="#080a0b"/>
    <rect x="20" y="20" width="640" height="260" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 644 20 H 660 V 36 M 20 264 V 280 H 36 M 644 280 H 660 V 264" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="660" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="254" x2="660" y2="254" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">F-35C / F/A-18E CARRIER STRIKE FIGHTER · PLAN VIEW VARIANTS</text>
    <text x="646" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">F-35C / F/A-18E 舰载多用途战斗机 · 顶视双色战术涂装剪影</text>
    <text x="34" y="271" class="p mono" fill="#8aa1a7" font-size="9.5">CVN-78 CARRIER STRIKE GROUP AIR WING · STANDARD HI-VIS (#D4E3E6) &amp; TACTICAL FOCUS (#38BDF8) · REF: F80</text>
    <text x="646" y="271" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (无损原生算子输出) -->
  <g id="layer-ship-cad">
    
      <rect x="56" y="76" width="268" height="156" fill="#091116" fill-opacity="0.5" stroke="#2c3b40"/>
      <text x="190" y="98" text-anchor="middle" class="p mono" fill="#d4e3e6">STANDARD SQUADRON (#D4E3E6)</text>
      <g transform="translate(190.0,160.0) rotate(0) scale(5.20)">
      <polygon points="8,0 3,-2 -2,-7 -5,-7 -3,-2 -7,-4 -8,-4 -6,0 -8,4 -7,4 -3,2 -5,7 -2,7 3,2"
               fill="#0a161e" stroke="#d4e3e6" stroke-width="0.85"/>
    </g>

      <rect x="356" y="76" width="268" height="156" fill="#091116" fill-opacity="0.5" stroke="#2c3b40"/>
      <text x="490" y="98" text-anchor="middle" class="p mono" fill="#38bdf8">ALERT INTERCEPTOR (#38BDF8)</text>
      <g transform="translate(490.0,160.0) rotate(0) scale(5.20)">
      <polygon points="8,0 3,-2 -2,-7 -5,-7 -3,-2 -7,-4 -8,-4 -6,0 -8,4 -7,4 -3,2 -5,7 -2,7 3,2"
               fill="#0a161e" stroke="#38bdf8" stroke-width="0.85"/>
    </g>
    
  </g>
</svg>
