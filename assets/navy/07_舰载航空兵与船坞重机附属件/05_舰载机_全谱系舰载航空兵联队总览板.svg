<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" data-asset-id="naval.airwing.master.sheet" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1120" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1080" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1084 20 H 1100 V 36 M 20 324 V 340 H 36 M 1084 340 H 1100 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1100" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1100" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">POSEIDON NAVAL AIR WING · CARRIER &amp; AMPHIBIOUS AIRCRAFT MASTER PALETTE</text>
    <text x="1086" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">波塞冬海军舰载航空兵联队 · 全谱系固定翼/飞翼/预警机/旋翼机工程图板</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9.5">INCLUDES: E-2D HAWKEYE · F-35C STRIKE FIGHTER · GJ-11 UCAV (DEPLOYED &amp; FOLDED) · Z-20F / Z-8L HELICOPTERS</text>
    <text x="1086" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (无损原生算子输出) -->
  <g id="layer-ship-cad">
    
      <g>
        <rect x="48" y="78" width="190" height="204" fill="#091116" stroke="#2c3b40"/>
        <text x="143" y="102" text-anchor="middle" class="p mono" fill="#38bdf8">01 · E-2D AEW&amp;C</text>
        <g transform="translate(143.0,180.0) rotate(0) scale(3.80)">
      <line x1="-10" y1="0" x2="11" y2="0" stroke="#d4e3e6" stroke-width="1.6"/>
      <polygon points="2,-14 5,-14 4,14 2,14" fill="#0d1e28" stroke="#38bdf8" stroke-width="0.9"/>
      <line x1="-9" y1="-5" x2="-9" y2="5" stroke="#d4e3e6" stroke-width="1.1"/>
      <circle cx="-1" cy="0" r="6.2" fill="#09151c" stroke="#38bdf8" stroke-width="1.1"/>
      <line x1="-5" y1="-3.5" x2="3" y2="3.5" stroke="#38bdf8" stroke-width="0.6"/>
    </g>
        <text x="143" y="264" text-anchor="middle" class="p cap" fill="#8aa1a7">鹰眼舰载预警机</text>

        <rect x="254" y="78" width="190" height="204" fill="#091116" stroke="#2c3b40"/>
        <text x="349" y="102" text-anchor="middle" class="p mono" fill="#38bdf8">02 · F-35C / F-18E</text>
        <g transform="translate(349.0,155.0) rotate(0) scale(4.20)">
      <polygon points="8,0 3,-2 -2,-7 -5,-7 -3,-2 -7,-4 -8,-4 -6,0 -8,4 -7,4 -3,2 -5,7 -2,7 3,2"
               fill="#0a161e" stroke="#d4e3e6" stroke-width="0.85"/>
    </g>
        <g transform="translate(349.0,212.0) rotate(0) scale(4.20)">
      <polygon points="8,0 3,-2 -2,-7 -5,-7 -3,-2 -7,-4 -8,-4 -6,0 -8,4 -7,4 -3,2 -5,7 -2,7 3,2"
               fill="#0a161e" stroke="#38bdf8" stroke-width="0.85"/>
    </g>
        <text x="349" y="264" text-anchor="middle" class="p cap" fill="#8aa1a7">舰载多用途战斗机</text>

        <rect x="460" y="78" width="190" height="204" fill="#091116" stroke="#2c3b40"/>
        <text x="555" y="102" text-anchor="middle" class="p mono" fill="#38bdf8">03 · GJ-11 DEPLOYED</text>
        <g transform="translate(555.0,180.0) rotate(0) scale(4.4)">
      <polygon points="9,0 -4,-13 -8,-11 -4,-4 -7,0 -4,4 -8,11 -4,13" fill="#122634" stroke="#38bdf8" stroke-width="0.85"/>
      <polygon points="5,0 0,-2.2 -3,0 0,2.2" fill="#08131a" stroke="#d4e3e6" stroke-width="0.6"/>
    </g>
        <text x="555" y="264" text-anchor="middle" class="p cap" fill="#8aa1a7">攻击-11 展开弹射态</text>

        <rect x="666" y="78" width="190" height="204" fill="#091116" stroke="#2c3b40"/>
        <text x="761" y="102" text-anchor="middle" class="p mono" fill="#eab308">04 · GJ-11 FOLDED</text>
        <g transform="translate(761.0,180.0) rotate(0) scale(4.4)">
        <polygon points="8,0 4,-4.5 -5,-4.5 -8,0 -5,4.5 4,4.5" fill="#10212b" stroke="#d4e3e6" stroke-width="0.75"/>
        <line x1="-5" y1="-2.4" x2="5" y2="-2.4" stroke="#38bdf8" stroke-width="0.55"/>
        <line x1="-5" y1="2.4" x2="5" y2="2.4" stroke="#38bdf8" stroke-width="0.55"/>
        <polygon points="2,0 -1,-1.5 -1,1.5" fill="#38bdf8"/>
      </g>
        <text x="761" y="264" text-anchor="middle" class="p cap" fill="#8aa1a7">攻击-11 折翼停放态</text>

        <rect x="872" y="78" width="200" height="204" fill="#091116" stroke="#2c3b40"/>
        <text x="972" y="102" text-anchor="middle" class="p mono" fill="#38bdf8">05 · Z-20F / Z-8L HELO</text>
        <g transform="translate(972.0,152.0) scale(3.60)">
      <ellipse cx="1" cy="0" rx="5.5" ry="2" fill="#0b1820" stroke="#d4e3e6" stroke-width="0.8"/>
      <line x1="-8" y1="0" x2="6" y2="0" stroke="#d4e3e6" stroke-width="0.8"/>
      <line x1="-6" y1="-6" x2="8" y2="6" stroke="#38bdf8" stroke-width="0.7"/>
      <line x1="-6" y1="6" x2="8" y2="-6" stroke="#38bdf8" stroke-width="0.7"/>
      <circle cx="1" cy="0" r="7.5" fill="none" stroke="#4a6368" stroke-width="0.5" stroke-dasharray="2 2"/>
    </g>
        <g transform="translate(972.0,216.0) rotate(0) scale(3.8)">
    <ellipse cx="1" cy="0" rx="6.5" ry="2.1" fill="#0d1e28" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="-8" y1="0" x2="7.5" y2="0" stroke="#38bdf8" stroke-width="0.9"/>
    <line x1="-7" y1="-1.4" x2="4" y2="-0.6" stroke="#38bdf8" stroke-width="0.65"/>
    <line x1="-7" y1="1.4" x2="4" y2="0.6" stroke="#38bdf8" stroke-width="0.65"/>
    <circle cx="2.5" cy="0" r="1.2" fill="#38bdf8"/>
  </g>
        <text x="972" y="264" text-anchor="middle" class="p cap" fill="#8aa1a7">舰载直升机 展开/折叠</text>
      </g>
    
  </g>
</svg>
