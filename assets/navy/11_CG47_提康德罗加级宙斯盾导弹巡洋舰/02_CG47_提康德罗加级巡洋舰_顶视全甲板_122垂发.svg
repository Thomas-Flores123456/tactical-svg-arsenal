<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" width="1120" height="320" data-asset-id="naval.cg47.top" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1120" height="320" fill="#080a0b"/>
    <rect x="20" y="20" width="1080" height="280" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1084 20 H 1100 V 36 M 20 284 V 300 H 36 M 1084 300 H 1100 V 284" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1100" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="274" x2="1100" y2="274" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">US NAVY CG-47 TICONDEROGA CLASS (CG-52 BUNKER HILL) · FULL DECK PLANIMETRIC VIEW</text>
    <text x="1086" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">CG-47「提康德罗加」级宙斯盾巡洋舰 · 顶视全甲板工程图 (双塔四盾 + 前后122单元Mk41垂发)</text>
    <text x="34" y="291" class="p mono" fill="#8aa1a7" font-size="9.5">TWIN AEGIS DECKHOUSES (FWD/STBD &amp; PORT/AFT SPY-1) · 61+61 MK41 VLS · DUAL MK45 127MM · SH-60B HELIDECK · QUAD HARPOON</text>
    <text x="1086" y="291" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">OBLIVION UI GFX · POSEIDON NAVAL CAD · TRUE 10.3:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (无损原生算子输出) -->
  <g id="layer-ship-cad">
    <g transform="translate(33.1,79.5) scale(2.485,2.485)">
      <!-- 1. 10.3:1 极度修长斯普鲁恩斯/提康德罗加级流线型高干舷船体 (X=10..414, Y=14.35..53.65, 长宽比 10.3:1) -->
      <polygon points="10,16.5 56,14.8 96,14.35 304,14.35 352,18.2 388,24.5 414,34 388,43.5 352,49.8 304,53.65 96,53.65 56,53.2 10,51.5"
               fill="#0a1822" stroke="#d4e3e6" stroke-width="1.4"/>
      <polygon points="13,18.5 96,16.8 302,16.8 348,20.5 398,34 348,47.5 302,51.2 96,51.2 13,49.5"
               fill="#0d202c" stroke="#38bdf8" stroke-width="0.8"/>

      <!-- 2. 舰尾左右两座四联装「捕鲸叉」(Mk 141 Harpoon) 反舰导弹斜架 (X=12..24) -->
      <g fill="#163244" stroke="#ff5a36" stroke-width="0.85">
        <polygon points="13,19.5 23,23.5 21.5,27.5 11.5,23.5"/>
        <line x1="12.2" y1="21.5" x2="22.2" y2="25.5" stroke="#d4e3e6" stroke-width="0.5"/>
        <polygon points="11.5,44.5 21.5,40.5 23,44.5 13,48.5"/>
        <line x1="12.2" y1="46.5" x2="22.2" y2="42.5" stroke="#d4e3e6" stroke-width="0.5"/>
      </g>
      <text x="20" y="36.5" text-anchor="middle" class="p mono" font-size="6.5" fill="#d4e3e6" font-weight="bold">52</text>

      <!-- 3. 后 127mm/54 Mk 45 舰炮 (炮管朝左 -X · X=25..58) -->
      <polygon points="58,28.5 50,27 44,29 44,39 50,41 58,39.5" fill="#163244" stroke="#d4e3e6" stroke-width="1.15"/>
      <rect x="49" y="31" width="6" height="6" fill="#09151e" stroke="#38bdf8" stroke-width="0.6"/>
      <line x1="44" y1="34" x2="24" y2="34" stroke="#d4e3e6" stroke-width="1.6"/>

      <!-- 4. 后 61 单元 (8×8 网格 - 3装填机) Mk 41 垂发矩阵 (X=64..90) -->
      <rect x="64" y="22" width="26" height="24" fill="#07131c" stroke="#d4e3e6" stroke-width="1.05"/><line x1="67.3" y1="22" x2="67.3" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="70.5" y1="22" x2="70.5" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="73.8" y1="22" x2="73.8" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="77.0" y1="22" x2="77.0" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="80.3" y1="22" x2="80.3" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="83.5" y1="22" x2="83.5" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="86.8" y1="22" x2="86.8" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="64" y1="28.0" x2="90" y2="28.0" stroke="#38bdf8" stroke-width="0.45"/><line x1="64" y1="34.0" x2="90" y2="34.0" stroke="#38bdf8" stroke-width="0.45"/><line x1="64" y1="40.0" x2="90" y2="40.0" stroke="#38bdf8" stroke-width="0.45"/><line x1="64" y1="34.0" x2="90" y2="34.0" stroke="#d4e3e6" stroke-width="0.8"/><rect x="72.1" y="34.0" width="9.8" height="3.3" fill="#261410" stroke="#eab308" stroke-width="0.6"/>

      <!-- 5. 中后部 SH-60B「海鹰」直升机起降甲板 (白色起降圆圈 + RAST 助降格栅与双导轨 · X=96..148) -->
      <rect x="96" y="17" width="52" height="34" fill="#08131a" stroke="#d4e3e6" stroke-width="1.05"/>
      <line x1="98" y1="15.2" x2="146" y2="15.2" stroke="#38bdf8" stroke-width="1.0" stroke-dasharray="3 1.5"/>
      <line x1="98" y1="52.8" x2="146" y2="52.8" stroke="#38bdf8" stroke-width="1.0" stroke-dasharray="3 1.5"/>
      <line x1="98" y1="34" x2="146" y2="34" stroke="#d4e3e6" stroke-width="0.8" stroke-dasharray="3.5 2"/>
      <circle cx="122" cy="34" r="9.2" fill="none" stroke="#d4e3e6" stroke-width="1.15"/>
      <circle cx="122" cy="34" r="2.8" fill="none" stroke="#38bdf8" stroke-width="0.85"/>
      <!-- RAST 鱼叉着舰格栅与进出双机库牵引轨 -->
      <rect x="118" y="31.5" width="8" height="5" fill="#102432" stroke="#38bdf8" stroke-width="0.75"/>
      <line x1="126" y1="32.5" x2="148" y2="26.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 1.2"/>
      <line x1="126" y1="35.5" x2="148" y2="41.5" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 1.2"/>

      <!-- 6. 后宙斯盾塔楼 (左/后八角盾切面 + 后烟囱双黑排气口 + 后桅杆 AN/SPS-49 + 双 SPG-62 · X=148..198) -->
      <polygon points="148,18 198,18 198,50 148,50" fill="#122836" stroke="#d4e3e6" stroke-width="1.25"/>
      <rect x="152" y="21" width="26" height="26" fill="#18364a" stroke="#38bdf8" stroke-width="0.95"/>
      <!-- 左舷侧向 (Port) 与舰尾后向 (Aft) 两面八角形 AN/SPY-1A 相控阵盾切面 -->
      <rect x="158" y="18" width="13" height="3.2" fill="#1c445c" stroke="#38bdf8" stroke-width="1.1"/>
      <line x1="157" y1="17.6" x2="172" y2="17.6" stroke="#38bdf8" stroke-width="1.8"/>
      <rect x="148" y="35.5" width="3.2" height="11" fill="#1c445c" stroke="#38bdf8" stroke-width="1.1"/>
      <line x1="147.6" y1="35" x2="147.6" y2="47" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- 后烟囱双联黑色 LM2500 燃气轮机排气口 -->
      <rect x="181" y="23" width="14" height="22" fill="#0b1a24" stroke="#d4e3e6" stroke-width="0.95"/>
      <circle cx="188" cy="29.2" r="3.1" fill="#04080b" stroke="#38bdf8" stroke-width="0.85"/>
      <circle cx="188" cy="38.8" r="3.1" fill="#04080b" stroke="#38bdf8" stroke-width="0.85"/>
      <!-- 后四脚格子桅杆与顶置 AN/SPS-49 远程雷达横桁 -->
      <rect x="169" y="28" width="9" height="12" fill="#0d202c" stroke="#d4e3e6" stroke-width="0.95"/>
      <line x1="173.5" y1="19.5" x2="173.5" y2="48.5" stroke="#d4e3e6" stroke-width="1.1"/>
      <rect x="171" y="26.5" width="5" height="15" rx="1.2" fill="#183a4e" stroke="#38bdf8" stroke-width="1.0"/>
      <!-- 后部 2 座 SPG-62 照射雷达碗圆罩 -->
      <circle cx="161" cy="34" r="2.8" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.85"/>
      <circle cx="153" cy="26.5" r="2.5" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.85"/>

      <!-- 7. 舯部双联「密集阵」CIWS 耳台与左右舰载小艇架 (X=198..228) -->
      <rect x="198" y="21" width="30" height="26" fill="#0f2330" stroke="#d4e3e6" stroke-width="1.0"/>
      <!-- 左右两座 Mk 15「密集阵」CIWS 半圆耳台 -->
      <circle cx="213" cy="18.2" r="3.2" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.9"/>
      <line x1="213" y1="15.0" x2="213" y2="12.2" stroke="#38bdf8" stroke-width="1.1"/>
      <circle cx="213" cy="49.8" r="3.2" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.9"/>
      <line x1="213" y1="53.0" x2="213" y2="55.8" stroke="#38bdf8" stroke-width="1.1"/>
      <!-- 左右两艘 RHIB 刚性充气快艇与吊艇架 -->
      <ellipse cx="213" cy="25" rx="7.5" ry="2.3" fill="#163244" stroke="#d4e3e6" stroke-width="0.8"/>
      <ellipse cx="213" cy="43" rx="7.5" ry="2.3" fill="#163244" stroke="#d4e3e6" stroke-width="0.8"/>

      <!-- 8. 前宙斯盾塔楼 (前/右八角盾切面 + 前烟囱双黑排气口 + 前桅顶圆罩 + 双 SPG-62 · X=228..298) -->
      <polygon points="286,23 298,26 298,42 286,45" fill="#102432" stroke="#38bdf8" stroke-width="0.95"/>
      <polygon points="228,18 284,18 288,23 288,45 284,50 228,50" fill="#122836" stroke="#d4e3e6" stroke-width="1.25"/>
      <polygon points="260,21 280,21 284,25 284,43 280,47 260,47" fill="#18364a" stroke="#38bdf8" stroke-width="1.0"/>
      <!-- 正前向 (Forward) 与右舷侧向 (Starboard) 两面八角形 AN/SPY-1A 相控阵盾切面 -->
      <rect x="284.8" y="23.5" width="3.2" height="11" fill="#1c445c" stroke="#38bdf8" stroke-width="1.1"/>
      <line x1="288.4" y1="23" x2="288.4" y2="35" stroke="#38bdf8" stroke-width="1.8"/>
      <rect x="256" y="46.8" width="13" height="3.2" fill="#1c445c" stroke="#38bdf8" stroke-width="1.1"/>
      <line x1="255" y1="50.4" x2="270" y2="50.4" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- 前烟囱双联黑色 LM2500 燃气轮机排气口 -->
      <rect x="231" y="23" width="14" height="22" fill="#0b1a24" stroke="#d4e3e6" stroke-width="0.95"/>
      <circle cx="238" cy="29.2" r="3.1" fill="#04080b" stroke="#38bdf8" stroke-width="0.85"/>
      <circle cx="238" cy="38.8" r="3.1" fill="#04080b" stroke="#38bdf8" stroke-width="0.85"/>
      <!-- 前四脚格子桅杆与桅顶 SPQ-9B 圆罩 -->
      <rect x="249" y="28" width="10" height="12" fill="#0d202c" stroke="#d4e3e6" stroke-width="0.95"/>
      <line x1="254" y1="19.5" x2="254" y2="48.5" stroke="#d4e3e6" stroke-width="1.1"/>
      <circle cx="254" cy="34" r="3.3" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.9"/>
      <!-- 前部 2 座 SPG-62 照射雷达碗圆罩 -->
      <circle cx="274" cy="34" r="2.8" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.85"/>
      <circle cx="292" cy="34" r="2.8" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.85"/>

      <!-- 9. 前 61 单元 (8×8 网格 - 3装填机) Mk 41 垂发矩阵 (X=306..332) -->
      <rect x="306" y="22" width="26" height="24" fill="#07131c" stroke="#d4e3e6" stroke-width="1.05"/><line x1="309.3" y1="22" x2="309.3" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="312.5" y1="22" x2="312.5" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="315.8" y1="22" x2="315.8" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="319.0" y1="22" x2="319.0" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="322.3" y1="22" x2="322.3" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="325.5" y1="22" x2="325.5" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="328.8" y1="22" x2="328.8" y2="46" stroke="#38bdf8" stroke-width="0.45"/><line x1="306" y1="28.0" x2="332" y2="28.0" stroke="#38bdf8" stroke-width="0.45"/><line x1="306" y1="34.0" x2="332" y2="34.0" stroke="#38bdf8" stroke-width="0.45"/><line x1="306" y1="40.0" x2="332" y2="40.0" stroke="#38bdf8" stroke-width="0.45"/><line x1="306" y1="34.0" x2="332" y2="34.0" stroke="#d4e3e6" stroke-width="0.8"/><rect x="314.1" y="34.0" width="9.8" height="3.3" fill="#261410" stroke="#eab308" stroke-width="0.6"/>

      <!-- 10. 舰首 Mk 45 Mod 2 127mm/54 主炮 (朝右 +X) + V形防浪板与飞剪尖艏 (X=340..414) -->
      <polygon points="342,28.5 350,27 356,29 356,39 350,41 342,39.5" fill="#163244" stroke="#d4e3e6" stroke-width="1.15"/>
      <rect x="345" y="31" width="6" height="6" fill="#09151e" stroke="#38bdf8" stroke-width="0.6"/>
      <line x1="356" y1="34" x2="378" y2="34" stroke="#d4e3e6" stroke-width="1.6"/>
      <polyline points="374,23.5 386,34 374,44.5" fill="none" stroke="#38bdf8" stroke-width="0.85"/>
      <line x1="378" y1="34" x2="412" y2="34" stroke="#4a6368" stroke-width="0.85"/>
    </g>
  </g>
</svg>
