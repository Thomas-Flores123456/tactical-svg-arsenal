<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" data-asset-id="naval.columbia826.top" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.p { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1080" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8"  font-weight="bold" font-size="9.5">USS DISTRICT OF COLUMBIA (SSBN-826) · TOP VIEW &amp; 16-CELL TRIDENT II D5LE CMC</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6"  font-size="9.5">SSBN-826「哥伦比亚」级战略核潜艇 · 顶视4×4通用导弹舱与X尾舵透视图</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9.5">CMC: 4×QUAD-PACK (2×8 = 16×87" TRIDENT II D5LE SILOS) · X-STERN SURFACES + DUCTED PUMP-JET · SAIL FAIRWATER PLANES · UID: 106</text>
    <text x="1066" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT (13.05:1)</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 sx=sy=2.320 · X=16..420 长404 / Y=28.5..59.5 宽31.0 = 13.05:1) -->
  <g id="layer-ship-cad">
    <g transform="translate(52.0,78.0) scale(2.320,2.320)">

      <!-- 0. 顶视纵轴中心基准线、13.1m 艇宽工程标尺与顶部模块标注 (严格净空零碰撞) -->
      <line x1="8" y1="44.0" x2="424" y2="44.0" stroke="#2c3b40" stroke-width="0.6" stroke-dasharray="6 3"/>
      <!-- 左端 13.1m 艇宽工程标尺 (Y=28.5 .. 59.5 · 共 31.0 单位) -->
      <line x1="9.5" y1="28.5" x2="9.5" y2="59.5" stroke="#38bdf8" stroke-width="0.65"/>
      <line x1="7.2" y1="28.5" x2="12.0" y2="28.5" stroke="#38bdf8" stroke-width="0.7"/>
      <line x1="7.2" y1="59.5" x2="12.0" y2="59.5" stroke="#38bdf8" stroke-width="0.7"/>
      <text x="6.2" y="44.0" text-anchor="middle" transform="rotate(-90 6.2 44.0)" class="mono" font-size="2.5" fill="#38bdf8">BEAM 13.1M</text>

      <!-- 顶部左舷战略模块说明 (净空区 Y=9.2) -->
      <text x="16" y="9.2" class="mono" font-size="2.5" fill="#eab308" font-weight="bold">STERN: X-CONTROL SURFACES &amp; PMM PUMP-JET</text>
      <text x="184" y="9.2" class="mono" font-size="2.5" fill="#ff5a36" font-weight="bold">MIDSHIP: CMC 4×QUAD-PACK (16×TRIDENT II D5LE)</text>
      <text x="342" y="9.2" class="mono" font-size="2.5" fill="#38bdf8" font-weight="bold">SAIL PLANES &amp; LAB SONAR</text>

      <!-- 1. 艇尾标志性 X 形四翼控制舵面 (X-Stern Control Surfaces · X=32..64) + 环形导管泵喷推进器 (#eab308) -->
      <g id="top-x-stern-and-pumpjet">
        <!-- 左舷侧 X 形双斜翼投影 (左上翼与左下翼 45° 斜置交叠 + 全动舵面铰链分割线 · Y=14.8..30.0) -->
        <polygon points="34,34.5 41,15.2 52,15.2 63,29.5" fill="#0d202c" stroke="#d4e3e6" stroke-width="1.1"/>
        <polygon points="35,34.5 43,18.2 54,18.2 61,29.5" fill="#132c3d" fill-opacity="0.75" stroke="#38bdf8" stroke-width="0.8"/>
        <line x1="37.5" y1="24.8" x2="57.5" y2="22.5" stroke="#eab308" stroke-width="0.65" stroke-dasharray="2 1"/>
        <!-- 左上斜翼尖 TB-29A 细线拖曳线列声呐流线型荚舱 -->
        <rect x="31.5" y="14.2" width="23.5" height="2.2" rx="1.0" fill="#0d2230" stroke="#38bdf8" stroke-width="0.85"/>
        <circle cx="32.2" cy="15.3" r="0.7" fill="#ff5a36"/>

        <!-- 右舷侧 X 形双斜翼投影 (右上翼与右下翼 45° 斜置交叠 · Y=58.0..73.2) -->
        <polygon points="34,53.5 41,72.8 52,72.8 63,58.5" fill="#0d202c" stroke="#d4e3e6" stroke-width="1.1"/>
        <polygon points="35,53.5 43,69.8 54,69.8 61,58.5" fill="#132c3d" fill-opacity="0.75" stroke="#38bdf8" stroke-width="0.8"/>
        <line x1="37.5" y1="63.2" x2="57.5" y2="65.5" stroke="#eab308" stroke-width="0.65" stroke-dasharray="2 1"/>
        <!-- 右下斜翼尖 TB-16 粗线拖曳声呐释放管 -->
        <rect x="33.0" y="71.6" width="21.5" height="2.0" rx="0.9" fill="#0d2230" stroke="#38bdf8" stroke-width="0.75"/>

        <!-- 环形导管泵喷推进器顶视图 (Ducted Pump-Jet Propulsor · X=15.0..34.0, Y=35.8..52.2 · #eab308) -->
        <polygon points="18.0,36.8 31.0,35.2 34.0,36.5 34.0,51.5 31.0,52.8 18.0,51.2"
                 fill="#141e24" stroke="#eab308" stroke-width="1.2"/>
        <line x1="28.2" y1="35.8" x2="28.2" y2="52.2" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="1.6 1.0"/>
        <line x1="23.0" y1="36.4" x2="23.0" y2="51.6" stroke="#eab308" stroke-width="1.05" stroke-dasharray="1.8 1.0"/>
        <polygon points="14.8,44.0 18.2,41.5 18.2,46.5" fill="#eab308" stroke="#d4e3e6" stroke-width="0.65"/>
      </g>

      <!-- 2. 主艇体：13.05:1 修长流线型单耐压壳体外廓 (X=28..420, Y=28.5..59.5 · 严格锁定 31.0 单位艇宽 = 13.1m) -->
      <path d="M 32.0 38.2
               C 40.0 33.4 55.0 28.5 76.0 28.5
               L 378.0 28.5
               C 403.0 28.5 420.0 34.5 420.0 44.0
               C 420.0 53.5 403.0 59.5 378.0 59.5
               L 76.0 59.5
               C 55.0 59.5 40.0 54.6 32.0 49.8
               Z"
            fill="#08131b" stroke="#d4e3e6" stroke-width="1.35"/>

      <!-- 内部 HY-100 耐压壳壁与通用导弹舱龟背上层甲板边线 (X=174..334, Y=31.0..57.0) -->
      <path d="M 68.0 30.2 H 376.0 M 68.0 57.8 H 376.0" fill="none" stroke="#38bdf8" stroke-width="0.65" stroke-dasharray="4.5 2.2"/>
      <rect x="178.0" y="31.5" width="154.0" height="25.0" rx="2.5" fill="#0b1b26" fill-opacity="0.55" stroke="#38bdf8" stroke-width="0.7"/>
      <g stroke="#2c3b40" stroke-width="0.6" stroke-dasharray="2 1.5">
        <line x1="66" y1="28.7" x2="66" y2="59.3"/>
        <line x1="102" y1="28.7" x2="102" y2="59.3"/>
        <line x1="138" y1="28.7" x2="138" y2="59.3"/>
        <line x1="184" y1="28.7" x2="184" y2="59.3"/>
        <line x1="288" y1="28.7" x2="288" y2="59.3"/>
        <line x1="336" y1="28.7" x2="336" y2="59.3"/>
      </g>

      <!-- 3. 艇尾全电推进系统 X 光透视：PMM 永磁推进电机 + 涡轮发电机 + S1B 42年全寿命压水堆 (X=66..182) -->
      <g id="top-s1b-reactor-pmm-drive">
        <!-- 主推进轴与大直径环形永磁同步电机 (PMM · X=68..100) -->
        <line x1="34.0" y1="44.0" x2="102.0" y2="44.0" stroke="#eab308" stroke-width="1.3"/>
        <rect x="74.0" y="34.5" width="19.0" height="19.0" rx="2.0" fill="#0d2230" stroke="#eab308" stroke-width="0.95"/>
        <rect x="77.5" y="37.2" width="12.0" height="13.6" rx="1.2" fill="#133246" stroke="#38bdf8" stroke-width="0.75"/>
        <text x="83.5" y="44.8" text-anchor="middle" class="mono" font-size="2.3" fill="#eab308" font-weight="bold">PMM</text>

        <!-- 左右双蒸汽涡轮发电机组与高压直流配电母线 (Turbo-Electric Generators · X=104..138) -->
        <rect x="105.0" y="32.5" width="30.0" height="9.2" rx="1.2" fill="#071620" stroke="#38bdf8" stroke-width="0.75"/>
        <rect x="105.0" y="46.3" width="30.0" height="9.2" rx="1.2" fill="#071620" stroke="#38bdf8" stroke-width="0.75"/>
        <line x1="93.0" y1="38.5" x2="105.0" y2="38.5" stroke="#eab308" stroke-width="0.85"/>
        <line x1="93.0" y1="49.5" x2="105.0" y2="49.5" stroke="#eab308" stroke-width="0.85"/>
        <text x="120.0" y="38.0" text-anchor="middle" class="mono" font-size="2.1" fill="#38bdf8">TURBO-GEN L</text>
        <text x="120.0" y="51.8" text-anchor="middle" class="mono" font-size="2.1" fill="#38bdf8">TURBO-GEN R</text>

        <!-- S1B 42年全寿命自然循环压水核反应堆屏蔽舱与圆形压力容器顶盖 (X=140..182, cx=161, cy=44) -->
        <rect x="140.0" y="31.5" width="42.0" height="25.0" rx="2.0" fill="#1d0c10" fill-opacity="0.78" stroke="#ff5a36" stroke-width="0.95"/>
        <circle cx="161.0" cy="44.0" r="7.8" fill="#2b1015" stroke="#ff5a36" stroke-width="0.95"/>
        <circle cx="161.0" cy="44.0" r="3.6" fill="#ff5a36" fill-opacity="0.7"/>
        <line x1="153.2" y1="44.0" x2="168.8" y2="44.0" stroke="#eab308" stroke-width="0.65"/>
        <line x1="161.0" y1="36.2" x2="161.0" y2="51.8" stroke="#eab308" stroke-width="0.65"/>
      </g>

      <!-- 4. 核心灵魂：通用导弹舱 (CMC · 4组 Quad-Pack = 2×8 共 16 座直径 87英寸 UGM-133A 三叉戟 II D5LE 发射井 · X=186..286) -->
      <g id="top-cmc-4x4-quad-packs">
        <!-- CMC 总外框与 4 组 Quad-Pack 模块分界框 (QP-4 / QP-3 / QP-2 / QP-1) -->
        <rect x="186.0" y="27.8" width="100.0" height="32.4" fill="#180b10" fill-opacity="0.45" stroke="#ff5a36" stroke-width="1.1" stroke-dasharray="3.5 1.8"/>
        <line x1="186.0" y1="22.5" x2="186.0" y2="65.5" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="2.5 1.5"/>
        <line x1="286.0" y1="22.5" x2="286.0" y2="65.5" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="2.5 1.5"/>
        <!-- 4 组 Quad-Pack 独立钢结构模块盒 (每盒 2×2 = 4 具 87" 发射筒) -->
        <rect x="187.8" y="32.2" width="22.0" height="23.6" rx="1.2" fill="#0d1e2a" stroke="#38bdf8" stroke-width="0.8"/>
        <rect x="212.8" y="32.2" width="22.0" height="23.6" rx="1.2" fill="#0d1e2a" stroke="#38bdf8" stroke-width="0.8"/>
        <rect x="237.8" y="32.2" width="22.0" height="23.6" rx="1.2" fill="#0d1e2a" stroke="#38bdf8" stroke-width="0.8"/>
        <rect x="262.8" y="32.2" width="22.0" height="23.6" rx="1.2" fill="#0d1e2a" stroke="#ff5a36" stroke-width="0.9"/>

        <!-- 左舷偶数列 8 座发射井 (#16..#2 · cy=38.0) 与右舷奇数列 8 座发射井 (#15..#1 · cy=50.0) -->
        <!-- Quad-Pack 4: Silos #16, #15 (cx=193.5) &amp; #14, #13 (cx=204.0) -->
        <g fill="#1c0d12" stroke="#ff5a36" stroke-width="0.95">
          <circle cx="193.5" cy="38.0" r="4.3"/><circle cx="193.5" cy="50.0" r="4.3"/>
          <circle cx="204.0" cy="38.0" r="4.3"/><circle cx="204.0" cy="50.0" r="4.3"/>
          <!-- Quad-Pack 3: Silos #12, #11 (cx=218.5) &amp; #10, #9 (cx=229.0) -->
          <circle cx="218.5" cy="38.0" r="4.3"/><circle cx="218.5" cy="50.0" r="4.3"/>
          <circle cx="229.0" cy="38.0" r="4.3"/><circle cx="229.0" cy="50.0" r="4.3"/>
          <!-- Quad-Pack 2: Silos #8, #7 (cx=243.5) &amp; #6, #5 (cx=254.0) -->
          <circle cx="243.5" cy="38.0" r="4.3"/><circle cx="243.5" cy="50.0" r="4.3"/>
          <circle cx="254.0" cy="38.0" r="4.3"/><circle cx="254.0" cy="50.0" r="4.3"/>
          <!-- Quad-Pack 1 后排: Silos #4, #3 (cx=268.5) -->
          <circle cx="268.5" cy="38.0" r="4.3"/><circle cx="268.5" cy="50.0" r="4.3"/>
        </g>

        <!-- #3~#16 井内部 Trident II D5LE 导弹头锥与中心 Aerospike 激波杆点 X 光透视 -->
        <g fill="#091824" stroke="#eab308" stroke-width="0.6">
          <circle cx="193.5" cy="38.0" r="2.2"/><circle cx="193.5" cy="50.0" r="2.2"/>
          <circle cx="204.0" cy="38.0" r="2.2"/><circle cx="204.0" cy="50.0" r="2.2"/>
          <circle cx="218.5" cy="38.0" r="2.2"/><circle cx="218.5" cy="50.0" r="2.2"/>
          <circle cx="229.0" cy="38.0" r="2.2"/><circle cx="229.0" cy="50.0" r="2.2"/>
          <circle cx="243.5" cy="38.0" r="2.2"/><circle cx="243.5" cy="50.0" r="2.2"/>
          <circle cx="254.0" cy="38.0" r="2.2"/><circle cx="254.0" cy="50.0" r="2.2"/>
          <circle cx="268.5" cy="38.0" r="2.2"/><circle cx="268.5" cy="50.0" r="2.2"/>
        </g>
        <g fill="#38bdf8">
          <circle cx="193.5" cy="38.0" r="0.65"/><circle cx="193.5" cy="50.0" r="0.65"/>
          <circle cx="204.0" cy="38.0" r="0.65"/><circle cx="204.0" cy="50.0" r="0.65"/>
          <circle cx="218.5" cy="38.0" r="0.65"/><circle cx="218.5" cy="50.0" r="0.65"/>
          <circle cx="229.0" cy="38.0" r="0.65"/><circle cx="229.0" cy="50.0" r="0.65"/>
          <circle cx="243.5" cy="38.0" r="0.65"/><circle cx="243.5" cy="50.0" r="0.65"/>
          <circle cx="254.0" cy="38.0" r="0.65"/><circle cx="254.0" cy="50.0" r="0.65"/>
          <circle cx="268.5" cy="38.0" r="0.65"/><circle cx="268.5" cy="50.0" r="0.65"/>
        </g>

        <!-- Quad-Pack 1 前排：#2号井与 #1号井 (cx=279.0) 舱盖向外侧掀开露出内部待发/齐射 D5LE MIRV 弹头阵列 -->
        <circle cx="279.0" cy="38.0" r="4.4" fill="#2c1015" stroke="#38bdf8" stroke-width="1.15"/>
        <circle cx="279.0" cy="38.0" r="2.6" fill="#ff5a36" stroke="#d4e3e6" stroke-width="0.65"/>
        <circle cx="279.0" cy="38.0" r="0.9" fill="#eab308"/>
        <!-- 向左舷掀开的 #2 号圆形重装甲井盖 -->
        <ellipse cx="279.0" cy="31.2" rx="3.8" ry="1.5" fill="#163244" stroke="#d4e3e6" stroke-width="0.85"/>

        <circle cx="279.0" cy="50.0" r="4.4" fill="#2c1015" stroke="#ff5a36" stroke-width="1.15"/>
        <circle cx="279.0" cy="50.0" r="2.6" fill="#ff5a36" stroke="#d4e3e6" stroke-width="0.65"/>
        <circle cx="279.0" cy="50.0" r="0.9" fill="#eab308"/>
        <!-- 向右舷掀开的 #1 号圆形重装甲井盖 -->
        <ellipse cx="279.0" cy="56.8" rx="3.8" ry="1.5" fill="#163244" stroke="#d4e3e6" stroke-width="0.85"/>
      </g>

      <!-- 5. 流线型指挥台围壳 + 围壳两侧展开的前水平舵 (Sail-Mounted Fairwater Planes · X=294..336) -->
      <g id="top-sail-and-fairwater-planes">
        <!-- 围壳两侧展开的大型可偏转前水平舵翼 (Sail-Mounted Fairwater Planes · Y=16.5..39.8 &amp; Y=48.2..71.5 · #eab308 高亮) -->
        <polygon points="308.0,39.8 311.5,16.8 320.5,16.8 323.5,39.8" fill="#132e40" stroke="#eab308" stroke-width="1.1"/>
        <line x1="316.0" y1="16.8" x2="316.0" y2="39.8" stroke="#38bdf8" stroke-width="0.75"/>
        <polygon points="308.0,48.2 311.5,71.2 320.5,71.2 323.5,48.2" fill="#132e40" stroke="#eab308" stroke-width="1.1"/>
        <line x1="316.0" y1="48.2" x2="316.0" y2="71.2" stroke="#38bdf8" stroke-width="0.75"/>

        <!-- 流线型指挥台围壳顶视外廓 (X=294..334, Y=39.6..48.4) -->
        <path d="M 294.0 41.2 L 302.0 39.6 L 324.0 39.6 C 330.0 39.6 334.0 41.5 334.0 44.0 C 334.0 46.5 330.0 48.4 324.0 48.4 L 302.0 48.4 L 294.0 46.8 Z"
              fill="#102534" stroke="#d4e3e6" stroke-width="1.2"/>
        <!-- 围壳顶光电桅杆、ESM 与卫通升降井口 -->
        <circle cx="321.0" cy="44.0" r="1.5" fill="#050a0e" stroke="#38bdf8" stroke-width="0.7"/>
        <circle cx="315.5" cy="44.0" r="1.3" fill="#050a0e" stroke="#d4e3e6" stroke-width="0.65"/>
        <circle cx="310.0" cy="44.0" r="1.2" fill="#050a0e" stroke="#eab308" stroke-width="0.65"/>
        <rect x="299.0" y="42.4" width="6.5" height="3.2" rx="0.8" fill="#050a0e" stroke="#38bdf8" stroke-width="0.65"/>
      </g>

      <!-- 6. 前部指挥舱、4×533mm Mk 48 ADCAP 鱼雷室、两舷 LWWAA 宽孔径光纤侧舷阵与艇首 LAB 保形声呐罩 (X=336..420) -->
      <g id="top-bow-torpedo-and-sonar">
