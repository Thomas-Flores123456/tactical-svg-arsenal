        <circle cx="318.0" cy="56.5" r="10.2" fill="#12090d" stroke="#ff5a36" stroke-width="0.9" stroke-dasharray="2.5 1.2"/>
        <circle cx="318.0" cy="56.5" r="2.2" fill="#ff5a36"/>

        <!-- 四层全自动液压鱼雷储运架：混装 65-76A Kit (650mm 巨型鱼雷 · #eab308) 与 VA-111 Shkval (533mm 暴风超空泡鱼雷 · #ff5a36) -->
