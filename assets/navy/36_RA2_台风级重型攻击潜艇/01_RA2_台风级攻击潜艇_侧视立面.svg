        <!-- 后转轮自动装填鼓 (Drum #2 · cx=276.0, cy=56.5, r=10.5) 与前转轮自动装填鼓 (Drum #1 · cx=318.0, cy=56.5, r=10.5) -->
        <circle cx="276.0" cy="56.5" r="10.2" fill="#12090d" stroke="#eab308" stroke-width="0.9" stroke-dasharray="2.5 1.2"/>
