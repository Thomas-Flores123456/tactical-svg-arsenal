          <!-- 第 1 层 (650mm 65-76A 重型鱼雷) -->
          <rect x="260.0" y="44.8" width="32.0" height="2.6" rx="0.9" fill="#1f160c" stroke="#eab308"/>
          <rect x="296.0" y="44.8" width="32.0" height="2.6" rx="0.9" fill="#1f160c" stroke="#eab308"/>
          <rect x="331.0" y="44.8" width="29.0" height="2.6" rx="0.9" fill="#1f160c" stroke="#eab308"/>
          <!-- 第 2 层 (533mm VA-111 暴风超空泡鱼雷) -->
          <rect x="260.0" y="49.2" width="28.0" height="2.2" rx="0.7" fill="#281014" stroke="#ff5a36"/>
          <rect x="292.0" y="49.2" width="28.0" height="2.2" rx="0.7" fill="#281014" stroke="#ff5a36"/>
          <rect x="324.0" y="49.2" width="36.0" height="2.2" rx="0.7" fill="#281014" stroke="#ff5a36"/>
          <!-- 第 3 层 (533mm VA-111 / TEST-71M 鱼雷) -->
          <rect x="260.0" y="59.8" width="28.0" height="2.2" rx="0.7" fill="#281014" stroke="#ff5a36"/>
          <rect x="292.0" y="59.8" width="28.0" height="2.2" rx="0.7" fill="#0d2230" stroke="#38bdf8"/>
          <rect x="324.0" y="59.8" width="36.0" height="2.2" rx="0.7" fill="#281014" stroke="#ff5a36"/>
          <!-- 第 4 层 (650mm 65-76A 重型鱼雷) -->
          <rect x="260.0" y="64.0" width="32.0" height="2.6" rx="0.9" fill="#1f160c" stroke="#eab308"/>
          <rect x="296.0" y="64.0" width="32.0" height="2.6" rx="0.9" fill="#1f160c" stroke="#eab308"/>
          <rect x="331.0" y="64.0" width="29.0" height="2.6" rx="0.9" fill="#1f160c" stroke="#eab308"/>
        </g>
        <text x="310.0" y="56.2" text-anchor="middle" class="mono" font-size="2.3" fill="#d4e3e6" font-weight="bold">48-ROUND REVOLVER TORPEDO MAGAZINE</text>

        <!-- 艇首高密度 8具双口径重型鱼雷发射管 (上2排 4×650mm + 下2排 4×533mm · X=364..405) + 全向攻击声呐阵 -->
        <g stroke-width="0.8">
          <rect x="364.0" y="43.5" width="34.0" height="2.6" rx="0.6" fill="#1f160c" stroke="#eab308"/>
          <rect x="364.0" y="47.2" width="38.5" height="2.6" rx="0.6" fill="#1f160c" stroke="#eab308"/>
          <rect x="364.0" y="51.0" width="41.5" height="2.2" rx="0.5" fill="#281014" stroke="#ff5a36"/>
          <rect x="364.0" y="54.2" width="38.0" height="2.2" rx="0.5" fill="#281014" stroke="#ff5a36"/>
        </g>
        <!-- 艇首下部 MGK-540 Skat-3 全向主被动攻击声呐基阵 (X=368..396, Y=58.5..71.0) -->
        <polygon points="368.0,58.5 397.5,58.5 385.5,71.2 368.0,71.2" fill="#0b2434" fill-opacity="0.8" stroke="#38bdf8" stroke-width="0.95"/>
        <line x1="370.0" y1="62.5" x2="393.0" y2="62.5" stroke="#38bdf8" stroke-width="0.55"/>
        <line x1="370.0" y1="66.5" x2="389.0" y2="66.5" stroke="#38bdf8" stroke-width="0.55"/>
        <text x="380.0" y="69.8" text-anchor="middle" class="mono" font-size="2.2" fill="#38bdf8">SKAT-3 SONAR</text>
      </g>

      <!-- 6. 底部全艇总长与核心分段工程标尺 (LOA 128.0m · BEAM 15.2m · ASPECT 8.42:1 · 零碰撞) -->
      <g id="dimension-ruler" stroke="#5f7c84" stroke-width="0.6">
        <line x1="20.0" y1="84.5" x2="410.0" y2="84.5"/>
