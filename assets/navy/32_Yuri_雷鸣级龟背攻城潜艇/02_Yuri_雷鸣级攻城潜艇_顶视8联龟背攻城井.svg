<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" data-asset-id="naval.yuri.boomer.top" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.p { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1080" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="9.5" font-weight="bold">YURI BOOMER-CLASS SIEGE SUBMARINE (BMR-01) · ORTHOGRAPHIC TOP VIEW &amp; 2×4 TURTLEBACK SILOS</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="9.5">尤里「雷鸣」级龟背攻城潜艇 · 顶视2×4八联攻城导弹井与超导消磁/调平水舱总图</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9">LOA: 96.0M · BEAM: 12.8M (7.50:1) · 2×4 (8) Ø1.8M TURTLEBACK SIEGE SILOS · MICROSECOND TRIM BALLAST · 2×533MM TORPEDO · UID: 27</text>
    <text x="1066" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT (7.50:1)</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 sx=sy=2.340 · X=20..410 长390u / Y=18.0..70.0 宽52.0u = 7.50:1) -->
  <g id="layer-ship-cad">
    <g transform="translate(52.0,78.0) scale(2.340,2.340)">

      <!-- 0. 顶视纵轴中心基准线、12.8m 艇宽工程标尺与顶部模块标注 (严格净空零碰撞) -->
      <line x1="8.0" y1="44.0" x2="424.0" y2="44.0" stroke="#2c3b40" stroke-width="0.6" stroke-dasharray="6 3"/>
      <!-- 左端 12.8m 艇宽工程标尺 (Y=18.0 .. 70.0 · 共 52.0 单位 = 7.50:1) -->
      <line x1="9.5" y1="18.0" x2="9.5" y2="70.0" stroke="#38bdf8" stroke-width="0.65"/>
      <line x1="7.0" y1="18.0" x2="12.0" y2="18.0" stroke="#38bdf8" stroke-width="0.7"/>
      <line x1="7.0" y1="70.0" x2="12.0" y2="70.0" stroke="#38bdf8" stroke-width="0.7"/>
      <text x="6.0" y="44.0" text-anchor="middle" transform="rotate(-90 6.0 44.0)" class="mono" font-size="2.5" fill="#38bdf8">BEAM 12.8M (7.5:1)</text>

      <!-- 顶部左舷战略模块说明 (净空区 Y=8.5) -->
      <text x="18.0" y="8.5" class="mono" font-size="2.5" fill="#eab308" font-weight="bold">STERN: RIM-DRIVEN QUIET PROPULSOR &amp; MHD CORE</text>
      <text x="174.0" y="8.5" class="mono" font-size="2.5" fill="#ff5a36" font-weight="bold">TURTLEBACK: 2×4 (8×Ø1.8M) SIEGE SILOS (FAE / TOX / EMP)</text>
      <text x="348.0" y="8.5" class="mono" font-size="2.5" fill="#38bdf8" font-weight="bold">BOW: 2×533MM TORPEDO</text>

      <!-- 1. 艇尾无轴环形涵道静音推进器 (Rim-Driven Ducted Quiet Propulsor · X=15..34) + 复合折角稳定尾翼 (X=34..64) -->
      <g id="top-stern-ducted-propulsor">
        <!-- 左右折角水平/斜置复合尾稳定翼与全动舵面 (Y=14.5..28.5 &amp; Y=59.5..73.5) -->
        <polygon points="34.0,32.0 42.0,14.8 53.0,14.8 64.0,27.5" fill="#0b1a24" stroke="#d4e3e6" stroke-width="1.1"/>
        <line x1="47.5" y1="14.8" x2="50.5" y2="29.5" stroke="#38bdf8" stroke-width="0.7"/>
        <polygon points="34.0,56.0 42.0,73.2 53.0,73.2 64.0,60.5" fill="#0b1a24" stroke="#d4e3e6" stroke-width="1.1"/>
        <line x1="47.5" y1="73.2" x2="50.5" y2="58.5" stroke="#38bdf8" stroke-width="0.7"/>
        <!-- 上垂直尾翼脊线与顶置超低频神经通信天线荚舱 (Centerline Y=44.0) -->
        <rect x="31.5" y="42.6" width="25.5" height="2.8" rx="1.2" fill="#140b10" stroke="#ff5a36" stroke-width="0.85"/>
        <circle cx="32.5" cy="44.0" r="0.75" fill="#eab308"/>

        <!-- 无轴环形涵道静音推进器顶视图 (Rim-Driven Ducted Propulsor · X=15.0..34.0, Y=35.2..52.8 · #eab308) -->
        <polygon points="18.5,36.2 31.0,34.5 34.0,35.8 34.0,52.2 31.0,53.5 18.5,51.8"
                 fill="#161d24" stroke="#eab308" stroke-width="1.2"/>
        <line x1="28.5" y1="35.2" x2="28.5" y2="52.8" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="1.6 1.0"/>
        <line x1="23.2" y1="35.8" x2="23.2" y2="52.2" stroke="#eab308" stroke-width="1.1" stroke-dasharray="1.8 1.0"/>
        <polygon points="15.0,44.0 18.8,41.2 18.8,46.8" fill="#eab308" stroke="#d4e3e6" stroke-width="0.65"/>
      </g>

      <!-- 2. 主艇体：7.50:1 宽体低磁性钛合金双层壳体外廓 (X=28..410, Y=18.0..70.0 · 严格锁定 52.0 单位艇宽 = 12.8m) -->
      <g id="top-wide-turtleback-hull">
        <!-- 外层消声瓦与防浪轻壳体 (中后部 X=116..272 宽阔龟背段达到满宽 Y=18.0..70.0) -->
        <path d="M 32.0 37.5
                 C 42.0 30.5 64.0 23.5 92.0 20.2
                 L 124.0 18.0
                 L 264.0 18.0
                 L 318.0 21.0
                 C 356.0 23.5 386.0 29.5 404.0 37.5
                 C 408.5 39.8 410.0 41.8 410.0 44.0
                 C 410.0 46.2 408.5 48.2 404.0 50.5
                 C 386.0 58.5 356.0 64.5 318.0 67.0
                 L 264.0 70.0
                 L 124.0 70.0
                 L 92.0 67.8
                 C 64.0 64.5 42.0 57.5 32.0 50.5
                 Z"
              fill="#08131b" stroke="#d4e3e6" stroke-width="1.35"/>

        <!-- 内层低磁性钛合金 + 粘弹性声学阻尼聚合物主耐压壳体轮廓 (Titanium Pressure Hull · Y=25.0..63.0) -->
        <path d="M 66.0 26.5 L 368.0 26.5 C 388.0 26.5 402.0 33.5 402.0 44.0 C 402.0 54.5 388.0 61.5 368.0 61.5 L 66.0 61.5 Z"
              fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="4.5 2.2"/>

        <!-- 环艇超导消磁线圈环 (Superconducting Degaussing Coils · 世界书 uid=7 · #eab308) -->
        <g stroke="#eab308" stroke-width="0.75" stroke-opacity="0.75" stroke-dasharray="2.2 1.5">
          <line x1="78.0" y1="21.5" x2="78.0" y2="66.5"/>
          <line x1="122.0" y1="18.2" x2="122.0" y2="69.8"/>
          <line x1="268.0" y1="18.2" x2="268.0" y2="69.8"/>
          <line x1="334.0" y1="22.2" x2="334.0" y2="65.8"/>
          <line x1="374.0" y1="26.8" x2="374.0" y2="61.2"/>
        </g>
      </g>

      <!-- 3. 艇尾闭式高能反应堆与磁流体静音电力舱 X 光透视 (X=66..122, Y=29.0..59.0) -->
      <g id="top-aft-mhd-power-core">
        <line x1="34.0" y1="44.0" x2="96.0" y2="44.0" stroke="#eab308" stroke-width="1.3"/>
        <rect x="68.0" y="29.5" width="52.0" height="29.0" rx="2.0" fill="#1a0c10" fill-opacity="0.78" stroke="#ff5a36" stroke-width="0.9"/>
        <!-- 无齿轮磁流体/永磁推进变频模组与反应堆压力核心 -->
        <rect x="72.0" y="34.5" width="18.0" height="19.0" rx="1.5" fill="#0d2230" stroke="#eab308" stroke-width="0.85"/>
        <circle cx="105.0" cy="44.0" r="7.5" fill="#2b1015" stroke="#ff5a36" stroke-width="0.95"/>
        <circle cx="105.0" cy="44.0" r="3.4" fill="#ff5a36" fill-opacity="0.75"/>
        <line x1="97.5" y1="44.0" x2="112.5" y2="44.0" stroke="#eab308" stroke-width="0.65"/>
        <line x1="105.0" y1="36.5" x2="105.0" y2="51.5" stroke="#eab308" stroke-width="0.65"/>
        <text x="81.0" y="44.8" text-anchor="middle" class="mono" font-size="2.2" fill="#eab308" font-weight="bold">MHD</text>
      </g>

      <!-- 4. 核心灵魂：中后部高耸隆起「龟背」2×4 = 8 座 Ø1.8m 重型攻城导弹发射井 + 两舷微秒级高压吹除调平水舱 (X=126..264) -->
      <g id="top-turtleback-8-siege-silos">
        <!-- 两舷翼舱：微秒级高压吹除调平压载水舱与高压气瓶组 (Microsecond High-Pressure Trim Ballast Tanks · Y=19.2..24.8 &amp; Y=63.2..68.8) -->
        <!-- 左舷 4 组瞬态调平水舱 + 高压氮气吹除瓶 -->
        <g fill="#071a26" stroke="#38bdf8" stroke-width="0.8">
          <rect x="132.0" y="19.5" width="28.0" height="5.0" rx="0.8"/>
          <rect x="164.0" y="19.5" width="28.0" height="5.0" rx="0.8"/>
          <rect x="196.0" y="19.5" width="28.0" height="5.0" rx="0.8"/>
          <rect x="228.0" y="19.5" width="28.0" height="5.0" rx="0.8"/>
          <!-- 右舷 4 组瞬态调平水舱 -->
          <rect x="132.0" y="63.5" width="28.0" height="5.0" rx="0.8"/>
          <rect x="164.0" y="63.5" width="28.0" height="5.0" rx="0.8"/>
          <rect x="196.0" y="63.5" width="28.0" height="5.0" rx="0.8"/>
          <rect x="228.0" y="63.5" width="28.0" height="5.0" rx="0.8"/>
        </g>
        <!-- 调平水舱内部高压吹除阀点 -->
        <g fill="#eab308">
          <circle cx="146.0" cy="22.0" r="1.0"/><circle cx="178.0" cy="22.0" r="1.0"/>
          <circle cx="210.0" cy="22.0" r="1.0"/><circle cx="242.0" cy="22.0" r="1.0"/>
          <circle cx="146.0" cy="66.0" r="1.0"/><circle cx="178.0" cy="66.0" r="1.0"/>
          <circle cx="210.0" cy="66.0" r="1.0"/><circle cx="242.0" cy="66.0" r="1.0"/>
        </g>

        <!-- 高耸流线型装甲龟背上层甲板外框 (Turtleback Armored Missile Casing · X=128..262, Y=25.5..62.5) -->
        <rect x="128.0" y="25.5" width="134.0" height="37.0" rx="4.5" fill="#14090e" fill-opacity="0.82" stroke="#ff5a36" stroke-width="1.15"/>
        <line x1="162.0" y1="25.5" x2="162.0" y2="62.5" stroke="#2c3b40" stroke-width="0.7"/>
        <line x1="194.0" y1="25.5" x2="194.0" y2="62.5" stroke="#2c3b40" stroke-width="0.7"/>
        <line x1="226.0" y1="25.5" x2="226.0" y2="62.5" stroke="#2c3b40" stroke-width="0.7"/>

        <!-- ==================== 2×4 = 8 座 Ø1.8m 重型攻城导弹发射井 (左舷偶数列 cy=34.8 · 右舷奇数列 cy=53.2) ==================== -->
        <!-- 第 4 排 (cx=146.0, Silo #8 &amp; #7): 装载《协议 uid=28》TYPE-C 强磁通电磁脉冲淬灭战斗部 (High-Flux EMP · #38bdf8 高亮) -->
        <g transform="translate(146.0, 34.8)">
          <circle cx="0" cy="0" r="6.6" fill="#091a28" stroke="#38bdf8" stroke-width="1.1"/>
          <circle cx="0" cy="0" r="4.2" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 1"/>
          <circle cx="0" cy="0" r="1.8" fill="#38bdf8"/>
          <text x="0" y="-8.0" text-anchor="middle" class="mono" font-size="2.0" fill="#38bdf8">#8 EMP</text>
        </g>
        <g transform="translate(146.0, 53.2)">
          <circle cx="0" cy="0" r="6.6" fill="#091a28" stroke="#38bdf8" stroke-width="1.1"/>
          <circle cx="0" cy="0" r="4.2" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 1"/>
          <circle cx="0" cy="0" r="1.8" fill="#38bdf8"/>
          <text x="0" y="9.8" text-anchor="middle" class="mono" font-size="2.0" fill="#38bdf8">#7 EMP</text>
        </g>

        <!-- 第 3 排 (cx=178.0, Silo #6 &amp; #5): 装载《协议 uid=28》TYPE-B 广域二元神经毒气气溶胶战斗部 (Binary Neuro-Toxin · #eab308 高亮) -->
        <g transform="translate(178.0, 34.8)">
          <circle cx="0" cy="0" r="6.6" fill="#182012" stroke="#eab308" stroke-width="1.1"/>
          <circle cx="-1.8" cy="-1.2" r="1.6" fill="#eab308" fill-opacity="0.8"/>
          <circle cx="1.8" cy="-1.2" r="1.6" fill="#eab308" fill-opacity="0.8"/>
          <circle cx="0" cy="2.0" r="1.6" fill="#ff5a36" fill-opacity="0.85"/>
          <text x="0" y="-8.0" text-anchor="middle" class="mono" font-size="2.0" fill="#eab308">#6 TOX</text>
        </g>
        <g transform="translate(178.0, 53.2)">
          <circle cx="0" cy="0" r="6.6" fill="#182012" stroke="#eab308" stroke-width="1.1"/>
          <circle cx="-1.8" cy="-1.2" r="1.6" fill="#eab308" fill-opacity="0.8"/>
          <circle cx="1.8" cy="-1.2" r="1.6" fill="#eab308" fill-opacity="0.8"/>
          <circle cx="0" cy="2.0" r="1.6" fill="#ff5a36" fill-opacity="0.85"/>
          <text x="0" y="9.8" text-anchor="middle" class="mono" font-size="2.0" fill="#eab308">#5 TOX</text>
        </g>

        <!-- 第 2 排 (cx=210.0, Silo #4 &amp; #3): 装载《协议 uid=28》TYPE-A 重磅温压钻地攻城战斗部 (Thermobaric Bunker-Buster · #ff5a36 高亮) -->
        <g transform="translate(210.0, 34.8)">
          <circle cx="0" cy="0" r="6.6" fill="#1f0d12" stroke="#ff5a36" stroke-width="1.1"/>
          <circle cx="0" cy="0" r="3.8" fill="#2c1015" stroke="#eab308" stroke-width="0.75"/>
          <circle cx="0" cy="0" r="1.5" fill="#ff5a36"/>
          <text x="0" y="-8.0" text-anchor="middle" class="mono" font-size="2.0" fill="#ff5a36">#4 FAE</text>
        </g>
        <g transform="translate(210.0, 53.2)">
          <circle cx="0" cy="0" r="6.6" fill="#1f0d12" stroke="#ff5a36" stroke-width="1.1"/>
          <circle cx="0" cy="0" r="3.8" fill="#2c1015" stroke="#eab308" stroke-width="0.75"/>
          <circle cx="0" cy="0" r="1.5" fill="#ff5a36"/>
          <text x="0" y="9.8" text-anchor="middle" class="mono" font-size="2.0" fill="#ff5a36">#3 FAE</text>
        </g>

        <!-- 第 1 排 (cx=242.0, Silo #2 &amp; #1): 重装甲消磁井盖向两舷 90° 液压掀开 · 处于齐射点火态！ -->
        <g transform="translate(242.0, 34.8)">
          <circle cx="0" cy="0" r="6.8" fill="#2c1015" stroke="#38bdf8" stroke-width="1.25"/>
          <circle cx="0" cy="0" r="4.2" fill="#ff5a36" stroke="#d4e3e6" stroke-width="0.75"/>
          <circle cx="0" cy="0" r="1.6" fill="#eab308"/>
          <!-- 向左舷外侧液压掀开的 #2 号重装甲消磁井盖 -->
          <ellipse cx="0" cy="-9.2" rx="5.8" ry="2.0" fill="#163244" stroke="#d4e3e6" stroke-width="0.95"/>
        </g>
        <g transform="translate(242.0, 53.2)">
          <circle cx="0" cy="0" r="6.8" fill="#2c1015" stroke="#ff5a36" stroke-width="1.25"/>
          <circle cx="0" cy="0" r="4.2" fill="#ff5a36" stroke="#d4e3e6" stroke-width="0.75"/>
          <circle cx="0" cy="0" r="1.6" fill="#eab308"/>
          <!-- 向右舷外侧液压掀开的 #1 号重装甲消磁井盖 -->
          <ellipse cx="0" cy="9.2" rx="5.8" ry="2.0" fill="#163244" stroke="#d4e3e6" stroke-width="0.95"/>
        </g>
      </g>

      <!-- 5. 前倾棱角尤里式神经光学指挥台围壳 + 可收放围壳水平舵 + 28人神经接驳指挥舱 (X=270..332) -->
      <g id="top-yuri-sail-and-c2">
        <!-- 28人神经接驳指挥控制舱顶视 X 光框 (28-Crew Neural-Link C2 Pod · X=272..330, Y=29.5..58.5) -->
        <rect x="272.0" y="29.5" width="58.0" height="29.0" rx="2.0" fill="#07151f" fill-opacity="0.75" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="3 1.5"/>

        <!-- 围壳两侧展开的可偏转前水平舵翼 (Sail/Bow Hydroplanes · X=298..316, Y=20.0..38.0 &amp; Y=50.0..68.0) -->
        <polygon points="298.0,38.0 303.0,20.5 313.0,20.5 316.0,38.0" fill="#142e40" stroke="#eab308" stroke-width="1.05"/>
        <line x1="307.5" y1="20.5" x2="307.5" y2="38.0" stroke="#38bdf8" stroke-width="0.7"/>
        <polygon points="298.0,50.0 303.0,67.5 313.0,67.5 316.0,50.0" fill="#142e40" stroke="#eab308" stroke-width="1.05"/>
        <line x1="307.5" y1="50.0" x2="307.5" y2="67.5" stroke="#38bdf8" stroke-width="0.7"/>

        <!-- 刀锋状多面体指挥台围壳顶视轮廓 (X=270..326, Y=38.0..50.0) -->
        <polygon points="270.0,40.5 282.0,38.0 316.0,38.0 326.0,44.0 316.0,50.0 282.0,50.0 270.0,47.5"
                 fill="#112432" stroke="#d4e3e6" stroke-width="1.25"/>
