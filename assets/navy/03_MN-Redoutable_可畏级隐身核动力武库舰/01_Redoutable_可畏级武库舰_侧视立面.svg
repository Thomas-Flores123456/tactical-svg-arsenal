<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" data-asset-id="naval.redoutable.side" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1120" height="300" fill="#080a0b"/>
    <rect x="20" y="20" width="1080" height="260" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1084 20 H 1100 V 36 M 20 264 V 280 H 36 M 1084 280 H 1100 V 264" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1100" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="254" x2="1100" y2="254" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">MN REDOUTABLE (CGN-38) · STEALTH NUCLEAR ARSENAL SHIP SIDE ELEVATION</text>
    <text x="1086" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">MN Redoutable「可畏级」隐身核动力武库舰 · 侧视立面图 (38,000T)</text>
    <text x="34" y="271" class="p mono" fill="#8aa1a7" font-size="9.5">WAVE-PIERCING TUMBLEHOME HULL · 512-CELL VLS FORE-DECK · TWIN STEALTH PAGODAS WITH OCTAGONAL AESA · 4×SHAFTS · REF: F100-LOWER</text>
    <text x="1086" y="271" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (无损原生算子输出) -->
  <g id="layer-ship-cad">
    <g transform="translate(56.0,79.2) scale(2.291,1.994)">
      <!-- 水下舰尾：双舵叶 + 四轴金色五叶螺旋桨支架 + 船底声呐压载龙骨凸起 (舰政标准规范) -->
      <polygon points="22,52 34,52 31,65 21,64" fill="#0b1820" stroke="#d4e3e6" stroke-width="1.1"/>
      <line x1="34" y1="59" x2="64" y2="54" stroke="#eab308" stroke-width="1.2"/>
      <!-- 双列可见五叶金色螺旋桨 -->
      <ellipse cx="35" cy="59" rx="1.8" ry="6.2" fill="#eab308" stroke="#d4e3e6" stroke-width="0.6"/>
      <ellipse cx="44" cy="58" rx="1.6" ry="5.5" fill="#eab308" stroke="#d4e3e6" stroke-width="0.6"/>
      <!-- 船底中段流线型减阻/声呐龙骨 -->
      <path d="M 96 52 L 114 56 L 236 56 L 258 52 Z" fill="#061016" stroke="#38bdf8" stroke-width="0.9"/>

      <!-- 穿浪多面体内倾隐身主船体 (Faceted Tumblehome Stealth Hull · 舰尾切角 + 穿浪尖艏 · 舰政标准规范) -->
      <polygon points="10,43 18,37 66,37 72,27 192,27 196,37 404,37 424,41 432,45 428,52 20,52"
               fill="#0a1720" stroke="#d4e3e6" stroke-width="1.35"/>
      <!-- 干舷内倾折棱线 (Chine Line) 与水线 -->
      <polyline points="10,43 432,45" fill="none" stroke="#38bdf8" stroke-width="0.95"/>
      <line x1="18" y1="50" x2="429" y2="50" stroke="#4a6368" stroke-width="0.8"/>
      <!-- 舰艏黑色锚链孔与首柱防浪折角 -->
      <circle cx="394" cy="41.5" r="2.2" fill="#050b0e" stroke="#d4e3e6" stroke-width="0.8"/>
      <polygon points="404,37 414,34.5 424,41" fill="#0d202c" stroke="#38bdf8" stroke-width="0.85"/>
      <!-- 船体中段舷侧大型灰白共形相控阵贴片 (Conformal Flank Array · 舰政标准规范 侧面浅灰矩形) -->
      <rect x="132" y="30" width="28" height="8" fill="#162c3a" stroke="#d4e3e6" stroke-width="0.8"/>

      <!-- 前甲板全通式 512 单元垂发顶盖列阵与前近防遥控武器站 -->
      <rect x="198" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="204.8" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="211.6" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="218.4" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="225.2" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="232" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="238.8" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="245.6" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="252.4" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="259.2" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="266" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="272.8" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="279.6" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="286.4" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="293.2" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="300" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="306.8" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="313.6" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="320.4" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="327.2" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="334" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="340.79999999999995" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="347.6" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="354.4" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="361.2" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/><rect x="368" y="35.8" width="4.8" height="1.4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.55"/>
      <rect x="386" y="33" width="5" height="4" fill="#0d222e" stroke="#38bdf8" stroke-width="0.7"/>

      <!-- 前上层建筑：内倾切角隐身主堡垒 + 正面/侧面八角形白色相控阵盾 + 白腰线 + 顶双黑格栅与白圆罩 (X=142..196 · 舰政标准规范) -->
      <polygon points="142,27 148,14 186,14 194,27" fill="#0e202c" stroke="#d4e3e6" stroke-width="1.25"/>
      <!-- 堡垒白色水平观察窗腰线 -->
      <polyline points="145,20 182,20 186,17 191,17" fill="none" stroke="#d4e3e6" stroke-width="1.1"/>
      <!-- 侧面八角形白色有源相控阵大盾 (Octagonal White AESA Shield) -->
      <polygon points="183,20 187,18 190,20 190,24 187,26 183,24" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.8"/>
      <!-- 顶部两座黑色斜格栅 + 中央白色圆罩 -->
      <rect x="152" y="12.2" width="9" height="1.8" fill="#050a0d" stroke="#38bdf8" stroke-width="0.6"/>
      <ellipse cx="168" cy="13" rx="4" ry="1.2" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.6"/>
      <rect x="175" y="12.2" width="9" height="1.8" fill="#050a0d" stroke="#38bdf8" stroke-width="0.6"/>

      <!-- 中段反舰导弹/电子战武器鞍部 (Midships Weapon Saddle · X=124..142) -->
      <rect x="125" y="21" width="16" height="6" fill="#08131a" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="127" y1="26" x2="135" y2="19" stroke="#ff5a36" stroke-width="1.2"/>
      <line x1="132" y1="26" x2="140" y2="19" stroke="#ff5a36" stroke-width="1.2"/>

      <!-- 后上层建筑：内倾切角隐身副堡垒 + 白腰线 + 顶双黑格栅与白圆罩 (X=82..124 · 舰政标准规范) -->
      <polygon points="82,27 88,14 120,14 124,27" fill="#0e202c" stroke="#d4e3e6" stroke-width="1.25"/>
      <line x1="85" y1="20" x2="122" y2="20" stroke="#d4e3e6" stroke-width="1.1"/>
      <rect x="92" y="12.2" width="8" height="1.8" fill="#050a0d" stroke="#38bdf8" stroke-width="0.6"/>
      <ellipse cx="105" cy="13" rx="3.8" ry="1.2" fill="#d4e3e6" stroke="#38bdf8" stroke-width="0.6"/>
      <rect x="111" y="12.2" width="8" height="1.8" fill="#050a0d" stroke="#38bdf8" stroke-width="0.6"/>

      <!-- 舰尾直升机甲板与驻留直升机侧视剪影 (X=18..66) -->
      <ellipse cx="42" cy="33.5" rx="7" ry="2.2" fill="#0d222e" stroke="#d4e3e6" stroke-width="0.8"/>
      <line x1="32" y1="33.5" x2="49" y2="33.5" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="35" y1="30.5" x2="49" y2="30.5" stroke="#d4e3e6" stroke-width="0.9"/>
    </g>
  </g>
</svg>
