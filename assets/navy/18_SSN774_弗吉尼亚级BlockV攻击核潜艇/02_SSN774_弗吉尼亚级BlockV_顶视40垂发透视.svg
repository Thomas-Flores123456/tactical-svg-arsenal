<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" data-asset-id="naval.virginia.top" style="background:#080a0b;">
  <defs>
    <style>
      svg { fill: none; stroke-linecap: butt; }
      .s-dim { stroke: #2c3b40; stroke-width: 1; }
      .s-line { stroke: #5f7c84; stroke-width: 1; }
      .s-hi { stroke: #d4e3e6; stroke-width: 1.2; }
      .s-alert { stroke: #ff5a36; stroke-width: 1.4; }
      .s-focus { stroke: #38bdf8; stroke-width: 1.4; }
      .f-dim { fill: #2c3b40; stroke: none; }
      .f-line { fill: #5f7c84; stroke: none; }
      .f-hi { fill: #d4e3e6; stroke: none; }
      .f-alert { fill: #ff5a36; stroke: none; }
      .f-panel { fill: #0c1113; }
      text { font-family: "Rajdhani", "Bahnschrift", "DIN Alternate", "Microsoft YaHei", sans-serif; letter-spacing: 0.12em; }
      text:not([stroke]) { stroke: none; }
      text:not([fill]) { fill: #cfdde0; }
      text:not([font-size]):not(.cap):not(.big) { font-size: 10px; }
      text.p { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.cap { letter-spacing: 0.2em; text-transform: uppercase; }
      text.cap:not([fill]) { fill: #8aa1a7; }
      text.cap:not([font-size]) { font-size: 8.5px; }
      text.mono { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; letter-spacing: 0.06em; }
      text.big { font-family: "Rajdhani", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 0.08em; }
      text.big:not([font-size]) { font-size: 18px; }
      text.big:not([fill]) { fill: #d4e3e6; }
      text.alert { fill: #ff5a36; }
    </style>
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10181c" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#1b262b"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ff5a36" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 1. 工程蓝图暗色底板与坐标网格图层 -->
  <g id="layer-backdrop">
    <rect x="0" y="0" width="1100" height="360" fill="#080a0b"/>
    <rect x="20" y="20" width="1060" height="320" fill="url(#cad-grid)" stroke="#2c3b40" stroke-width="1"/>
    <path d="M 20 36 V 20 H 36 M 1064 20 H 1080 V 36 M 20 324 V 340 H 36 M 1064 340 H 1080 V 324" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="1080" y2="54" stroke="#2c3b40" stroke-width="1"/>
    <line x1="20" y1="314" x2="1080" y2="314" stroke="#2c3b40" stroke-width="1"/>
    <text x="34" y="42" class="p mono" fill="#38bdf8" font-size="11" font-weight="bold">USS VIRGINIA (SSN-774) BLOCK V · ORTHOGRAPHIC TOP VIEW &amp; 40-CELL VPM/VPT X-RAY</text>
    <text x="1066" y="42" text-anchor="end" class="p cap" fill="#d4e3e6" font-size="10.5">SSN-774「弗吉尼亚」级 Block V 攻击核潜艇 · 顶视40单元(2×VPT+4×VPM)垂发透视图</text>
    <text x="34" y="331" class="p mono" fill="#8aa1a7" font-size="9.5">FWD 2×6 VPT REVOLVERS (12×TLAM) + MIDSHIP 4×7 VPM HONEYCOMB TUBES (28×TLAM / 12×IRCPS) · LWWAA + LAB SONAR</text>
    <text x="1066" y="331" text-anchor="end" class="p mono" fill="#5f7c84" font-size="9.5">POSEIDON NAVAL CAD ASSET · TRUE 1:1 ASPECT (13.48:1)</text>
  </g>

  <!-- 2. 舰艇核心 CAD 矢量图层 (1:1 等比缩放 sx=sy=2.320 · X=16..420 长404 / Y=29..59 宽30.0 = 13.48:1) -->
  <g id="layer-ship-cad">
    <g transform="translate(52.0,78.0) scale(2.320,2.320)">
      <!-- 0. 顶视纵轴中心基准线、宽度标尺与顶部模块标注 (零碰撞净空排布) -->
      <line x1="8" y1="44.0" x2="424" y2="44.0" stroke="#2c3b40" stroke-width="0.6" stroke-dasharray="6 3"/>
      <!-- 左端 10.4m 艇宽工程标尺 (Y=29.0 .. 59.0) -->
      <line x1="9.5" y1="29.0" x2="9.5" y2="59.0" stroke="#38bdf8" stroke-width="0.65"/>
      <line x1="7.2" y1="29.0" x2="12.0" y2="29.0" stroke="#38bdf8" stroke-width="0.7"/>
      <line x1="7.2" y1="59.0" x2="12.0" y2="59.0" stroke="#38bdf8" stroke-width="0.7"/>
      <text x="6.2" y="44.0" text-anchor="middle" transform="rotate(-90 6.2 44.0)" class="mono" font-size="2.6" fill="#38bdf8">BEAM 10.4M</text>

      <!-- 顶部左舷战略模块说明 -->
      <text x="20" y="9.5" class="mono" font-size="2.7" fill="#eab308">STERN: DUCTED PUMP-JET &amp; S9G 210MWt PWR</text>
      <text x="186" y="9.5" class="mono" font-size="2.7" fill="#ff5a36" font-weight="bold">MIDSHIP: 4×VPM 7-CELL HONEYCOMB (28×TLAM)</text>
      <text x="336" y="9.5" class="mono" font-size="2.7" fill="#38bdf8" font-weight="bold">BOW: 2×VPT 6-CELL (12×TLAM)</text>

      <!-- 1. 艇尾水平稳定翼、TB-16/TB-29A 拖曳声呐导流管与环形导管泵喷推进器 (Stern X=15..64) -->
      <g id="top-stern-pumpjet">
        <!-- 左右水平尾稳定翼与舵面 (Y=15.5..29.5 &amp; Y=58.5..72.5) -->
        <polygon points="36,31.5 42,15.8 51,15.8 61,29.5" fill="#0a1822" stroke="#d4e3e6" stroke-width="1.05"/>
        <line x1="46.5" y1="15.8" x2="49.5" y2="30.2" stroke="#4a6368" stroke-width="0.65"/>
        <polygon points="36,56.5 42,72.2 51,72.2 61,58.5" fill="#0a1822" stroke="#d4e3e6" stroke-width="1.05"/>
        <line x1="46.5" y1="72.2" x2="49.5" y2="57.8" stroke="#4a6368" stroke-width="0.65"/>
        <!-- 右舷翼尖 TB-16 粗线拖曳线列声呐导流管 -->
        <rect x="33.5" y="71.4" width="22.0" height="2.0" rx="0.9" fill="#0d2230" stroke="#38bdf8" stroke-width="0.75"/>

        <!-- 环形导管泵喷推进器顶视图 (Ducted Pump-Jet Propulsor · X=15.0..34.5, Y=36.2..51.8 · #eab308) -->
        <polygon points="18.0,37.2 31.5,35.5 34.5,36.8 34.5,51.2 31.5,52.5 18.0,50.8"
                 fill="#141e24" stroke="#eab308" stroke-width="1.15"/>
        <line x1="28.5" y1="36.0" x2="28.5" y2="52.0" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="1.6 1.0"/>
        <line x1="23.2" y1="36.6" x2="23.2" y2="51.4" stroke="#eab308" stroke-width="1.05" stroke-dasharray="1.8 1.0"/>
        <polygon points="15.0,44.0 18.5,41.6 18.5,46.4" fill="#eab308" stroke="#d4e3e6" stroke-width="0.65"/>
      </g>

      <!-- 2. 主艇体 13.48:1 修长流线型单壳体外廓 (X=28..420, Y=29.0..59.0 · 严格锁定 30.0 单位艇宽) -->
      <path d="M 32.0 38.5 C 40.0 33.8 54.0 29.0 74.0 29.0 L 380.0 29.0 C 403.5 29.0 420.0 34.8 420.0 44.0 C 420.0 53.2 403.5 59.0 380.0 59.0 L 74.0 59.0 C 54.0 59.0 40.0 54.2 32.0 49.5 Z"
            fill="#08131b" stroke="#d4e3e6" stroke-width="1.35"/>
      <!-- 上垂直尾翼脊线与顶置 TB-29A 细线拖曳声呐荚舱 (Centerline Y=44.0) -->
      <rect x="31.5" y="42.8" width="24.5" height="2.4" rx="1.1" fill="#0d2230" stroke="#38bdf8" stroke-width="0.85"/>
      <circle cx="32.2" cy="44.0" r="0.7" fill="#ff5a36"/>

      <!-- 内部 HY-100 耐压壳体肋骨分舱线与消音瓦网格线 -->
      <path d="M 68.0 30.5 H 374.0 M 68.0 57.5 H 374.0" fill="none" stroke="#38bdf8" stroke-width="0.65" stroke-dasharray="4.5 2.2"/>
      <g stroke="#2c3b40" stroke-width="0.6" stroke-dasharray="2 1.5">
        <line x1="74" y1="29.2" x2="74" y2="58.8"/>
        <line x1="112" y1="29.2" x2="112" y2="58.8"/>
        <line x1="152" y1="29.2" x2="152" y2="58.8"/>
        <line x1="186" y1="29.2" x2="186" y2="58.8"/>
        <line x1="260" y1="29.2" x2="260" y2="58.8"/>
        <line x1="338" y1="29.2" x2="338" y2="58.8"/>
      </g>

      <!-- 3. 后部轮机舱 + S9G 自然循环压水核反应堆舱顶视 X 光透视 (X=70..184) -->
      <g id="top-s9g-reactor-propulsion">
        <!-- 主推进轴与双蒸汽轮机座 (X=72..110) -->
        <line x1="34.5" y1="44.0" x2="114.0" y2="44.0" stroke="#eab308" stroke-width="1.1" stroke-dasharray="4 1.8"/>
        <rect x="78.0" y="34.0" width="30.0" height="7.5" rx="1.2" fill="#071620" stroke="#eab308" stroke-width="0.75" stroke-dasharray="2.5 1.2"/>
        <rect x="78.0" y="46.5" width="30.0" height="7.5" rx="1.2" fill="#071620" stroke="#eab308" stroke-width="0.75" stroke-dasharray="2.5 1.2"/>
        <!-- S9G 210MWt 核反应堆屏蔽舱与圆形压力容器顶盖 (X=114..152, cx=133, cy=44) -->
        <rect x="114.0" y="32.5" width="38.0" height="23.0" rx="2.0" fill="#1d0c10" fill-opacity="0.75" stroke="#ff5a36" stroke-width="0.9"/>
        <circle cx="133.0" cy="44.0" r="7.4" fill="#2b1015" stroke="#ff5a36" stroke-width="0.95"/>
        <circle cx="133.0" cy="44.0" r="3.4" fill="#ff5a36" fill-opacity="0.65"/>
        <line x1="125.6" y1="44.0" x2="140.4" y2="44.0" stroke="#eab308" stroke-width="0.65"/>
        <line x1="133.0" y1="36.6" x2="133.0" y2="51.4" stroke="#eab308" stroke-width="0.65"/>
        <!-- 后救生对接舱口与辅机舱 (X=154..184) -->
        <circle cx="168.5" cy="44.0" r="3.6" fill="#0b1d28" stroke="#d4e3e6" stroke-width="0.85"/>
        <circle cx="168.5" cy="44.0" r="1.4" fill="none" stroke="#38bdf8" stroke-width="0.65"/>
      </g>

      <!-- 4. 核心灵魂：舯部 25.6m VPM 有效载荷插入段 (4座直径2.2m 7联装蜂窝垂发筒 = 28枚战斧/12枚高超音速导弹 · X=186..260) -->
      <g id="top-vpm-4x7-honeycomb">
        <!-- 25.6m VPM 插入段边界高亮框 -->
        <rect x="186.0" y="28.2" width="74.0" height="31.6" fill="#180b10" fill-opacity="0.45" stroke="#ff5a36" stroke-width="1.1" stroke-dasharray="3.5 1.8"/>
        <line x1="186.0" y1="22.0" x2="186.0" y2="66.0" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="2.5 1.5"/>
        <line x1="260.0" y1="22.0" x2="260.0" y2="66.0" stroke="#38bdf8" stroke-width="0.85" stroke-dasharray="2.5 1.5"/>

        <!-- VPM-4 (cx=197.0, cy=44.0, r=6.2 · 7孔蜂窝阵列: 1中心 + 6外环) -->
        <g transform="translate(197.0, 44.0)">
          <circle cx="0" cy="0" r="6.2" fill="#1b0d12" stroke="#ff5a36" stroke-width="1.05"/>
          <circle cx="0" cy="0" r="1.55" fill="#091620" stroke="#38bdf8" stroke-width="0.65"/>
          <circle cx="3.4" cy="0" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="1.7" cy="2.95" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="-1.7" cy="2.95" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="-3.4" cy="0" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="-1.7" cy="-2.95" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="1.7" cy="-2.95" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
        </g>

        <!-- VPM-3 (cx=214.0, cy=44.0, r=6.2 · 7孔蜂窝阵列) -->
        <g transform="translate(214.0, 44.0)">
          <circle cx="0" cy="0" r="6.2" fill="#1b0d12" stroke="#ff5a36" stroke-width="1.05"/>
          <circle cx="0" cy="0" r="1.55" fill="#091620" stroke="#38bdf8" stroke-width="0.65"/>
          <circle cx="3.4" cy="0" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="1.7" cy="2.95" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="-1.7" cy="2.95" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="-3.4" cy="0" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="-1.7" cy="-2.95" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="1.7" cy="-2.95" r="1.55" fill="#091620" stroke="#eab308" stroke-width="0.65"/>
        </g>

        <!-- VPM-2 (cx=231.0, cy=44.0, r=6.2 · 7孔蜂窝阵列 + 向右舷翻开的圆形水密发射盖) -->
        <g transform="translate(231.0, 44.0)">
          <circle cx="0" cy="0" r="6.2" fill="#240e14" stroke="#ff5a36" stroke-width="1.15"/>
          <circle cx="0" cy="0" r="1.55" fill="#ff5a36" stroke="#eab308" stroke-width="0.65"/>
          <circle cx="3.4" cy="0" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <circle cx="1.7" cy="2.95" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <circle cx="-1.7" cy="2.95" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <circle cx="-3.4" cy="0" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <circle cx="-1.7" cy="-2.95" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <circle cx="1.7" cy="-2.95" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <!-- 向右舷开启的圆形发射舱盖 -->
          <ellipse cx="0" cy="10.2" rx="5.6" ry="2.2" fill="#132836" stroke="#eab308" stroke-width="0.85"/>
        </g>

        <!-- VPM-1 (cx=248.0, cy=44.0, r=6.2 · 7孔蜂窝阵列 + 向右舷翻开的圆形水密发射盖 · 齐射态) -->
        <g transform="translate(248.0, 44.0)">
          <circle cx="0" cy="0" r="6.2" fill="#2a1016" stroke="#ff5a36" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="1.55" fill="#ff5a36" stroke="#eab308" stroke-width="0.7"/>
          <circle cx="3.4" cy="0" r="1.55" fill="#ff5a36" stroke="#eab308" stroke-width="0.7"/>
          <circle cx="1.7" cy="2.95" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <circle cx="-1.7" cy="2.95" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <circle cx="-3.4" cy="0" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <circle cx="-1.7" cy="-2.95" r="1.55" fill="#0d2230" stroke="#38bdf8" stroke-width="0.7"/>
          <circle cx="1.7" cy="-2.95" r="1.55" fill="#ff5a36" stroke="#eab308" stroke-width="0.7"/>
          <!-- 向右舷开启的圆形发射舱盖 -->
          <ellipse cx="0" cy="10.2" rx="5.6" ry="2.2" fill="#132836" stroke="#eab308" stroke-width="0.85"/>
        </g>
      </g>

      <!-- 5. 流线型圆角指挥台围壳俯视图 (Fillet Sail · X=268..321.5, Y=39.2..48.8) 与双侧 3×LWWAA 宽孔径侧舷声呐阵 -->
      <g id="top-sail-and-lwwaa">
        <!-- 左右舷对称分布的 3块式 LWWAA 轻质宽孔径光纤保形侧舷声呐阵 (Port Y=27.4..29.0 / Stbd Y=59.0..60.6) -->
        <g fill="#0c2a3c" stroke="#38bdf8" stroke-width="0.8">
          <rect x="216.0" y="27.4" width="18.0" height="1.6" rx="0.5"/>
          <rect x="264.0" y="27.4" width="18.0" height="1.6" rx="0.5"/>
          <rect x="312.0" y="27.4" width="18.0" height="1.6" rx="0.5"/>
          <rect x="216.0" y="59.0" width="18.0" height="1.6" rx="0.5"/>
          <rect x="264.0" y="59.0" width="18.0" height="1.6" rx="0.5"/>
          <rect x="312.0" y="59.0" width="18.0" height="1.6" rx="0.5"/>
        </g>

        <!-- 指挥台围壳流线型前缘圆角底座与顶置非穿透光电桅杆井 -->
        <path d="M 268.0 41.2 L 306.0 40.0 Q 321.5 44.0 306.0 48.0 L 268.0 46.8 Z"
              fill="#0d2230" stroke="#38bdf8" stroke-width="0.95"/>
        <path d="M 271.0 40.5 L 304.5 40.5 C 310.5 40.5 313.5 42.0 313.5 44.0 C 313.5 46.0 310.5 47.5 304.5 47.5 L 271.0 47.5 Z"
              fill="#122b3b" stroke="#d4e3e6" stroke-width="1.15"/>
        <!-- 2×AN/BVS-1 光电桅杆与 ESM / HDR 卫通升降井口 -->
        <circle cx="299.5" cy="44.0" r="1.6" fill="#091620" stroke="#eab308" stroke-width="0.8"/>
        <circle cx="293.0" cy="44.0" r="1.5" fill="#091620" stroke="#38bdf8" stroke-width="0.8"/>
        <circle cx="285.5" cy="44.0" r="1.3" fill="#091620" stroke="#d4e3e6" stroke-width="0.7"/>
        <circle cx="278.5" cy="44.0" r="1.4" fill="#091620" stroke="#38bdf8" stroke-width="0.7"/>
      </g>

      <!-- 6. 艇首 2×VPT (Virginia Payload Tubes · 2座6联装左轮垂发筒 = 12枚战斧 · cx=349, 363) + 首水平舵 + LAB 保形声呐 -->
      <g id="top-bow-vpt-and-lab">
        <!-- 艇首左右展开态可收放首水平舵 (Retractable Bow Planes · X=345..360, Y=18.2..29.0 &amp; 59.0..69.8) -->
        <polygon points="345,29.0 349,18.2 359,18.2 361,29.0" fill="#0b1d28" stroke="#38bdf8" stroke-width="0.95"/>
        <polygon points="345,59.0 349,69.8 359,69.8 361,59.0" fill="#0b1d28" stroke="#38bdf8" stroke-width="0.95"/>

        <!-- VPT-2 (cx=349.0, cy=44.0, r=5.5 · 6孔梅花左轮阵列 = 6×BGM-109 Tomahawk) -->
        <g transform="translate(349.0, 44.0)">
          <circle cx="0" cy="0" r="5.5" fill="#0c202e" stroke="#38bdf8" stroke-width="1.05"/>
          <circle cx="0" cy="0" r="0.9" fill="#eab308"/>
          <circle cx="2.9" cy="0" r="1.35" fill="#07131c" stroke="#d4e3e6" stroke-width="0.65"/>
          <circle cx="1.45" cy="2.5" r="1.35" fill="#07131c" stroke="#d4e3e6" stroke-width="0.65"/>
          <circle cx="-1.45" cy="2.5" r="1.35" fill="#07131c" stroke="#d4e3e6" stroke-width="0.65"/>
          <circle cx="-2.9" cy="0" r="1.35" fill="#07131c" stroke="#d4e3e6" stroke-width="0.65"/>
          <circle cx="-1.45" cy="-2.5" r="1.35" fill="#07131c" stroke="#d4e3e6" stroke-width="0.65"/>
          <circle cx="1.45" cy="-2.5" r="1.35" fill="#07131c" stroke="#d4e3e6" stroke-width="0.65"/>
        </g>

        <!-- VPT-1 (cx=363.0, cy=44.0, r=5.5 · 6孔梅花左轮阵列 + 向左舷翻开的圆形发射盖) -->
        <g transform="translate(363.0, 44.0)">
          <circle cx="0" cy="0" r="5.5" fill="#10293b" stroke="#38bdf8" stroke-width="1.15"/>
          <circle cx="0" cy="0" r="0.9" fill="#eab308"/>
          <circle cx="2.9" cy="0" r="1.35" fill="#ff5a36" stroke="#eab308" stroke-width="0.65"/>
